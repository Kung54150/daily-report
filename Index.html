    return `<tr${label === 'รวม' ? ' class="tot"' : ''}><td>${esc(label)} \u00b7 ${esc(k)}</td><td class="n">${c('RN')}</td><td class="n">${c('PN')}</td><td class="n">${c('NA')}</td><td class="n">${st.length - c('RN') - c('PN') - c('NA')}</td><td class="n">${red}</td></tr>`; };
  h += `<h2>อัตรากำลัง</h2><table class="stat"><thead><tr><th>กลุ่ม</th><th>RN</th><th>PN</th><th>NA</th><th>อื่นๆ</th><th>ลดอัตรากำลัง (ชม.)</th></tr></thead>
    ${S.cfg.groups.map(g => SH.filter(k => units(g.key).some(u => unitHas(u, k))).map(k => grpRow(g.name, k, units(g.key).filter(u => unitHas(u, k)))).join('')).join('')}
    ${SH.map(k => grpRow('รวม', k, S.cfg.units.filter(u => unitHas(u, k)))).join('')}</table>`;
  return h;
}

function printIncidents() {
  const incs = [];
  S.cfg.units.forEach(u => shiftsOf(u).forEach(k => ((repAt(u, k) || {}).incidents || []).forEach(i => incs.push(Object.assign({}, i, { unit: shiftLab(u, k).replace(/<[^>]*>/g, '') })))));
  const byType = {}; incs.forEach(i => byType[i.type] = (byType[i.type] || 0) + 1);
  return `<h2>เหตุการณ์ผิดปกติ รวมทุกหน่วยงาน (${incs.length})</h2>` + (incs.length
    ? `<div class="chipsp">${Object.entries(byType).map(([k, n]) => `<span>${esc(k)} <b>${n}</b></span>`).join('')}</div>${incTable(incs)}`
    : '<div>ไม่มีรายงานเหตุการณ์ผิดปกติ</div>');
}

function incTable(incs, first) {
  return `<table><thead><tr><th>${first || 'หน่วยงาน'}</th><th>ผู้ป่วย</th><th>V/S</th><th>ประเภท / ระดับ</th><th>รายละเอียด / การแก้ไข</th></tr></thead>
    ${incs.map(i => `<tr><td>${esc(i.unit)}</td>
      <td>${esc(i.patient || '-')}${i.age ? `<br>อายุ ${esc(i.age)} ปี` : ''}${i.hn ? `<br>HN ${esc(i.hn)}` : ''}${i.time ? `<br>มา ${esc(i.time)} น.` : ''}${i.doctor ? `<br>แพทย์ ${esc(i.doctor)}` : ''}</td>
      <td>${vitals(i).map(([k, x, unit]) => `${k} ${esc(x)}${unit === '%' ? '%' : unit === '\u00b0C' ? '\u00b0C' : ''}`).join('<br>')}${i.o2mode ? `<br>O2: ${esc(o2Text(i))}` : ''}</td>
      <td>${esc(i.type)}<br>ระดับ ${esc(i.severity || '-')}</td>
      <td>${esc(i.detail)}${i.action ? `<br><i>แก้ไข: ${esc(i.action)}</i>` : ''}</td></tr>${(i.files || []).length ? `<tr class="attrow"><td></td><td colspan="4"><div class="attbox">${i.files.map(f => `<figure data-attfile="${esc(f.id)}"><figcaption>ไฟล์แนบ: ${esc(f.name)}</figcaption></figure>`).join('')}</div></td></tr>` : ''}`).join('')}</table>`;
}

function printUnits() {
  let body = printHead('แยกหน่วยงาน');
  S.cfg.sections.forEach(sc => {
    body += `<h2>${esc(sc.label)}</h2><div class="cols">`;
    sc.units.map(unitCfg).forEach(u => { body += `<div class="ub"><b class="c">${esc(u.code)}</b>${unitShiftBlocks(u)}</div>`; });
    body += '</div>';
  });
  return body;
}

// รายงานเฉพาะหน่วยงานเดียว (ละเอียด)
function printSingle(u, shift) {
  const r = repAt(u, shift);
  let h = `<h1>รายงานยอดประจำวัน \u00b7 ${esc(u.code)} \u00b7 เวร ${esc(shift)}</h1><div class="d">${esc(unitLabel(u))} \u00b7 ${esc(thaiDate(S.date, true))}</div>`;
  if (!r) return h + '<div class="miss" style="text-align:center;margin:20mm 0">หน่วยงานนี้ยังไม่ส่งรายงานเวร ' + esc(shift) + '</div>';
  const v = r.values || {};
  h += `<div class="st">ผู้รายงาน ${esc(r.reporter)} \u00b7 แก้ไขล่าสุด ${esc(r.updatedAt)}</div><h2>รายงานผู้ป่วย</h2><div class="cols">`;
  u.form.sections.forEach(s => {
    h += `<div class="ub"><b>${esc(s.title)}</b>`;
    if (s.type === 'list') {
      h += '<table class="stat">' + (listRows(s, v).map(r => `<tr><td>${esc(listLabel(r.it, r))}</td><td class="n">${r.n}</td></tr>`).join('') || '<tr><td colspan="2">\u2013</td></tr>') + `<tr class="tot"><td>${esc(s.totalLabel)}</td><td class="n">${listTotal(s, v)}</td></tr></table>`;
    } else if (s.type === 'grid') {
      h += `<table class="stat"><tr><th></th>${s.cols.map(c => `<th>${esc(c[1])}</th>`).join('')}<th>รวม</th></tr>${s.rows.map(rw => { const xs = s.cols.map(c => num(v[rw[0] + '_' + c[0]])); return `<tr><td>${esc(rw[1])}</td>${xs.map(x => `<td class="n">${x || '\u2013'}</td>`).join('')}<td class="n b">${xs.reduce((a, x) => a + x, 0)}</td></tr>`; }).join('')}</table>`;
    } else {
      h += '<table class="stat">' + s.fields.map(f => {
        const val = fieldValue(u, v, f);
        if (f.type === 'text') return val ? `<tr><td colspan="2">${esc(f.label)}: ${esc(val)}</td></tr>` : '';
        return `<tr><td>${esc(f.label)}${f.note && num(val) && v[f.key + '_note'] ? `<br><small>${esc(v[f.key + '_note'])}</small>` : ''}</td><td class="n${f.calc ? ' b' : ''}">${show(val)}${f.pctOf && num(v[f.pctOf]) ? ` (${(num(val) / num(v[f.pctOf]) * 100).toFixed(1)}%)` : ''}</td></tr>`;
      }).join('') + (s.sum ? `<tr class="tot"><td>${esc(s.sum)}</td><td class="n">${sectionSum(s, v)}</td></tr>` : '') + '</table>';
    }
    h += '</div>';
  });
  if (u.form.total) h += `<div class="ub"><b>${esc(u.form.total)} ${u.form.sections.filter(s => s.sum).reduce((a, s) => a + sectionSum(s, v), 0)}</b></div>`;
  h += '</div>';
  if (r.notes) h += `<div class="ln"><b>เรื่องแจ้ง:</b> ${esc(r.notes).replace(/\n/g, ' / ')}</div>`;
  const staff = r.staff || [], rd = r.reduce || {};
  h += `<h2>อัตรากำลัง \u00b7 เวร ${esc(shiftName(r.shift))} \u00b7 ${roleCounts(staff).map(([k, n]) => `${esc(k)} ${n}`).join(', ') || 'ไม่ได้ระบุ'}</h2>
    <div class="cols">${staff.map(s => `<div class="ln">${esc(s.role)} ${esc(s.name)}${s.tag ? ` (${esc(s.tag)}${s.tagNote ? ' ' + esc(s.tagNote) : ''})` : ''}</div>`).join('')}</div>`;
  const rt = num(rd.RN) + num(rd.PN) + num(rd.NA);
  if (rt || rd.detail) h += `<div class="ln" style="margin-top:3px"><b>ลดอัตรากำลัง ${rt} ชม.</b> (RN ${num(rd.RN)} ชม., PN ${num(rd.PN)} ชม., NA ${num(rd.NA)} ชม.)${rd.detail ? ' \u00b7 ' + esc(rd.detail).replace(/\n/g, ' / ') : ''}</div>`;
  const incs = (r.incidents || []).map(i => Object.assign({ unit: u.code }, i));
  return h + `<h2>เหตุการณ์ผิดปกติ (${incs.length})</h2>` + (incs.length ? incTable(incs) : '<div>ไม่มีเหตุการณ์ผิดปกติ</div>');
}
// ปรับการแสดงผลในเอกสารสรุปของบางหัวข้อ: title = ชื่อหัวข้อที่แสดง, lead = ช่องที่นำค่ามาต่อท้ายหัวข้อ (ไม่ซ้ำในรายละเอียด), nosum = ไม่แสดงบรรทัดรวม
const SUMMARY_VIEW = {
  ER: { 'ยอดผู้รับบริการ': { title: 'ยอดผู้รับบริการทั้งหมด', lead: 'total' }, 'OPD Case แบ่งตามประเภท (Triage)': { title: 'แยกตามประเภท Triage', nosum: true } },
  OPD1: { 'ยอดรวม': { title: 'ยอดรวม Med+Psy', lead: 'total' }, 'ผู้ป่วยอายุรกรรม': { lead: 'med' }, 'ผู้ป่วยจิตเวช': { lead: 'psy' } }
};
// รายการหลักเป็นตัวหนา รายละเอียดขึ้นบรรทัดใหม่ขึ้นต้นด้วย -
function printLines(u, r) {
  const v = r.values || {}, out = [];
  const grp = (head, details) => out.push(`<div class="lg">${head ? `<div class="ln m">${head}</div>` : ''}${details.filter(Boolean).map(d => `<div class="ln d">- ${d}</div>`).join('')}</div>`);
  u.form.sections.forEach(s => {
    if (s.type === 'list') { const rows = listRows(s, v); if (rows.length) grp(`<b>${esc(s.totalLabel)} ${listTotal(s, v)} ราย</b>`, rows.map(r => `${esc(listLabel(r.it, r))} ${r.n}`)); return; }
    if (s.type === 'grid') {
      s.rows.forEach(rw => { const parts = s.cols.map(c => [c[1], num(v[rw[0] + '_' + c[0]])]).filter(x => x[1]); const t = parts.reduce((a, x) => a + x[1], 0); grp(`<b>${esc(rw[1])} ${t}</b>`, [parts.map(x => esc(x[0]) + ' ' + x[1]).join(', ')]); });
      return;
    }
    const calcs = [], vw = (SUMMARY_VIEW[u.code] || {})[s.title] || {};
    const items = s.fields.filter(f => f.type !== 'text').map(f => {
      if (f.key === vw.lead) return '';
      const val = fieldValue(u, v, f);
      if (f.type === 'time') return val ? `${esc(f.label)} ${esc(val)} น.` : '';
      if (f.calc) { calcs.push(`<b>${esc(f.label)} ${val}</b>`); return ''; }
      if (!num(val)) return '';
      return `${esc(f.label)} ${val}${f.pctOf && num(v[f.pctOf]) ? ` (${(num(val) / num(v[f.pctOf]) * 100).toFixed(1)}%)` : ''}${f.note && v[f.key + '_note'] ? ' (' + esc(v[f.key + '_note']) + ')' : ''}`;
    }).filter(Boolean);
    const lf = vw.lead && s.fields.find(f => f.key === vw.lead), lv = lf ? fieldValue(u, v, lf) : '';
    const head = (u.form.sections.length > 1 ? esc(vw.title || s.title) : '') + (lf && lv !== undefined && lv !== '' ? ` ${lv} ${esc(lf.unit || '')}` : '') + (s.sum && !vw.nosum ? ` ${esc(s.sum)} ${sectionSum(s, v)}` : '');
    if (items.length || (head.trim() && !s.sum)) grp(head.trim() ? `<b>${head.trim()}</b>` : '', items);
    calcs.forEach(l => grp(l, []));
    s.fields.filter(f => f.type === 'text' && v[f.key]).forEach(f => grp('', [`${esc(f.label)}: ${esc(v[f.key])}`]));
  });
  if (u.form.total) grp(`<b>${esc(u.form.total)} ${u.form.sections.filter(s => s.sum).reduce((a, s) => a + sectionSum(s, v), 0)}</b>`, []);
  const rc = roleCounts(r.staff || []);
  if (rc.length) grp('<b>อัตรากำลัง</b>', [rc.map(([k, n]) => `${esc(k)} ${n}`).join(', ')]);
  const rd = r.reduce || {}, rt = num(rd.RN) + num(rd.PN) + num(rd.NA);
  if (rt) grp(`<b>ลดอัตรากำลัง ${rt} ชม.</b>`, [['RN', 'PN', 'NA'].filter(k => num(rd[k])).map(k => `${k} ${num(rd[k])} ชม.`).join(', ')]);
  if (r.notes) grp('<b>เรื่องแจ้ง</b>', [esc(r.notes).replace(/\n/g, ' / ')]);
  if ((r.incidents || []).length) grp(`<b class="miss">เหตุการณ์ผิดปกติ ${r.incidents.length} เรื่อง</b>`, []);
  return out.join('');
}

/* ตรวจรายชื่อก่อนอัปโหลด: นำเข้าทุกคน ชื่อแผนกตามไฟล์เก็บไว้ ผูกกับหน่วยงานในระบบภายหลังได้ */
const NO_DEPT = '(ไม่ระบุแผนก)';
function drawUpPreview() {
  const rows = S.upRows || [], bad = S.upBad || [], by = {};
  rows.forEach(r => { const k = r.dept || NO_DEPT; if (!by[k]) by[k] = { n: 0, unit: resolveDept(r.dept) }; by[k].n++; });
  const bound = rows.filter(r => resolveDept(r.dept)).length;
  $('up_preview').innerHTML = `<p style="margin:10px 0 6px">พบ <b>${rows.length}</b> รายชื่อ จาก ${Object.keys(by).length} แผนกในไฟล์ \u00b7 จัดเข้าหน่วยงานได้ทันที <b>${bound}</b> คน \u00b7 ยังไม่ผูกแผนก <b>${rows.length - bound}</b> คน (เก็บไว้ ผูกภายหลังได้)${bad.length ? ` \u00b7 <span style="color:var(--bad)">ข้ามแถวที่ไม่มีชื่อ: ${bad.slice(0, 10).join(', ')}${bad.length > 10 ? '\u2026' : ''}</span>` : ''}</p>
    <div class="grid-scroll"><table class="g"><tr><th>ชื่อแผนกในไฟล์</th><th>คน</th><th>หน่วยงานในระบบ</th></tr>
    ${Object.entries(by).map(([k, o]) => `<tr><td>${esc(k)}</td><td class="num">${o.n}</td><td>${o.unit ? '<b>' + esc(o.unit) + '</b>' : '<span class="muted">ยังไม่ผูก</span>'}</td></tr>`).join('')}</table></div>
    <button type="button" class="btn" id="up_go" style="margin-top:10px"${rows.length ? '' : ' disabled'}>ยืนยันอัปโหลด</button>`;
  $('up_go').onclick = async () => {
    $('up_go').disabled = true;
    try {
      const r = await api('uploadStaff', S.token, rows);
      S.upRows = null; await loadStaff(); render();
      toast(`อัปโหลด ${r.added} รายชื่อ \u00b7 จัดเข้าหน่วยงานแล้ว ${r.bound} \u00b7 รอผูกแผนก ${r.unbound}`);
    } catch (e) { handleErr(e); $('up_go').disabled = false; }
  };
}

/* ผูกชื่อแผนกในไฟล์กับหน่วยงานในระบบ: เลือกแล้วกดบันทึก รายชื่อทั้งแผนกย้ายเข้าหน่วยงานนั้น และจำไว้ใช้ครั้งต่อไป */
function deptGroups() {
  const g = {};
  S.staff.filter(s => s.source === 'upload').forEach(s => {
    const k = s.fileDept || s.unit || NO_DEPT, o = g[k] || (g[k] = { n: 0, units: {} });
    o.n++; o.units[s.unit || ''] = (o.units[s.unit || ''] || 0) + 1;
  });
  return Object.entries(g).map(([k, o]) => {
    const cur = Object.entries(o.units).sort((a, b) => b[1] - a[1])[0][0];
    return { dept: k, n: o.n, cur };
  }).sort((a, b) => (a.cur ? 1 : 0) - (b.cur ? 1 : 0) || a.dept.localeCompare(b.dept, 'th'));
}
function renderBindingCard() {
  const gs = deptGroups(), none = S.staff.filter(s => !s.unit).length;
  if (!gs.length) return '';
  S.bindSel = S.bindSel || {};
  return `<div class="card"><h3>ผูกชื่อแผนกในไฟล์กับหน่วยงานในระบบ <span class="sub">รอผูก ${none} คน</span></h3>
    <p class="muted" style="margin:0 0 8px;font-size:14px">เลือกหน่วยงานที่ตรงกับแต่ละแผนกในไฟล์ แล้วกด "บันทึกการผูก" รายชื่อทั้งแผนกจะเข้าหน่วยงานนั้น และอัปโหลดครั้งต่อไประบบจัดเข้าให้เอง (แผนกที่ระบบแนะนำให้ ยังไม่บันทึกจนกว่าจะกดบันทึก)</p>
    <div class="binding">${gs.map(o => {
      const sel = o.dept in S.bindSel ? S.bindSel[o.dept] : (o.cur || suggestUnit(o.dept));
      const tag = o.cur ? 'ผูกแล้ว' : (sel ? 'ระบบแนะนำ ยังไม่บันทึก' : 'ยังไม่ผูก');
      return `<span><b>${esc(o.dept)}</b> <small class="muted">(${o.n} คน) \u00b7 ${tag}</small></span><select data-dept="${esc(o.dept)}"${o.dept === NO_DEPT ? ' disabled' : ''}><option value="">\u2014 ยังไม่ผูก \u2014</option>${unitOptgroups(sel)}</select>`;
    }).join('')}</div>
    <button type="button" class="btn" data-act="bindsave">บันทึกการผูก</button></div>`;
}
async function saveBindingsNow() {
  const items = [];
  deptGroups().forEach(o => {
    if (o.dept === NO_DEPT) return;
    const sel = o.dept in S.bindSel ? S.bindSel[o.dept] : (o.cur || suggestUnit(o.dept));
    if (sel !== o.cur) items.push({ alias: o.dept, unit: sel });
  });
  if (!items.length) return toast('ไม่มีการเปลี่ยนแปลง');
  try {
    S.aliases = await api('saveBindings', S.token, items);
    S.bindSel = {}; await loadStaff(); render();
    toast(`บันทึกการผูก ${items.length} แผนกแล้ว`);
  } catch (e) { handleErr(e); }
}

/* ===== ผูกเหตุการณ์ของหน้าที่แสดงอยู่ ===== */
function bindView() {
  const v = $('view');
  v.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === 'edit') startEdit();
    else if (a === 'back') go('all');
    else if (a === 'gotoprint') go('print');
    else if (a === 'print') { if (S.pendingAtt > 0) toast('กำลังโหลดไฟล์แนบ รอสักครู่แล้วกดพิมพ์อีกครั้ง'); else window.print(); }
    else if (a === 'tpl') downloadTemplate();
    else if (a === 'bindsave') saveBindingsNow();
    else if (a === 'rooms') roomEditor($('adm_room_editor'), b.dataset.runit, () => render());
  });
  v.querySelectorAll('[data-vshift]').forEach(b => b.onclick = () => { S.vshift = b.dataset.vshift; S.day = { reports: deriveReports(S.vshift) }; render(); });
  v.querySelectorAll('[data-mshift]').forEach(b => b.onclick = () => { S.shift = b.dataset.mshift; render(); });
  v.querySelectorAll('[data-sub]').forEach(b => { if (!S.editing) b.onclick = () => { S.sub = b.dataset.sub; render(); }; });
  if ($('p_scope')) $('p_scope').onchange = () => { S.printScope = $('p_scope').value; render(); };
  if ($('p_kind')) $('p_kind').onchange = () => { S.printKind = $('p_kind').value; render(); };
  if ($('p_month')) $('p_month').onchange = () => { if ($('p_month').value) { S.printMonth = $('p_month').value; render(); } };
  v.querySelectorAll('[data-unit].ucard').forEach(b => b.onclick = () => (b.dataset.unit === S.me.unit ? go('mine') : go('all', b.dataset.unit)));
  v.querySelectorAll('[data-sact]').forEach(b => b.onclick = () => staffAction(b.dataset.sact, b.dataset.id, b.dataset.unit));
  if ($('st_unit')) $('st_unit').onchange = () => { S.staffUnit = $('st_unit').value; render(); };
  if ($('up_file')) $('up_file').onchange = async () => {
    const f = $('up_file').files[0]; if (!f) return;
    $('up_preview').innerHTML = '<p class="muted">กำลังอ่านไฟล์...</p>';
    try {
      const { rows, bad } = await readRoster(f);
      S.upRows = rows; S.upBad = bad;
      drawUpPreview();
    } catch (e) { $('up_preview').innerHTML = `<p style="color:var(--bad)">${esc(e.message)}</p>`; }
  };
  v.querySelectorAll('[data-dept]').forEach(sel => sel.onchange = () => { S.bindSel[sel.dataset.dept] = sel.value; });
  if (S.upRows && $('up_preview') && S.tab === 'staff' && S.upRows.length) drawUpPreview();

}
window.__scriptLoaded = true;
</script>
