function renderSummary() {
  const reps = S.day.reports, L = S.cfg.stdLabels;
  const sv = u => reps[u.code] ? stdValues(u, reps[u.code].values) : null;
  const sum = (list, k) => list.reduce((a, u) => a + ((sv(u) || {})[k] || 0), 0);
  const staffN = (list, role) => list.reduce((a, u) => a + (reps[u.code] ? (reps[u.code].staff || []).filter(x => x.role === role && x.tag !== 'ออกหน่วย').length : 0), 0);
  const opd = S.cfg.units.filter(u => u.group === 'OPD');
  const ipd = S.cfg.units.filter(u => u.group === 'IPD' || (u.group === 'SPU' && S.cfg.stdIpd.every(k => k in (u.form.std || {}))));
  const missing = S.cfg.units.filter(u => !reps[u.code]).map(u => u.code);
  const incs = []; S.cfg.units.forEach(u => (reps[u.code] ? reps[u.code].incidents || [] : []).forEach(i => incs.push({ u, i })));
  const tile = (n, t, cls) => `<div class="tile${cls ? ' ' + cls : ''}"><b>${n}</b><span>${t}</span></div>`;
  let h = vshiftSeg() + `<div class="meta">${esc(vshiftLabel())} \u00b7 ส่งรายงานแล้ว ${S.cfg.units.length - missing.length}/${S.cfg.units.length} หน่วยงาน${missing.length ? ` \u00b7 <span style="color:var(--bad)">ยังไม่รายงาน: ${missing.map(esc).join(', ')}</span>` : ''}</div>`;
  h += `<div class="tiles">${tile(sum(opd, 'total'), 'ผู้ป่วยนอก (ราย)')}${tile(sum(opd, 'admit'), 'Admit จาก OPD')}${tile(sum(ipd, 'remain'), 'ผู้ป่วยในคงพยาบาล')}${tile(sum(ipd, 'admit') + ' / ' + sum(ipd, 'dc'), 'รับใหม่ / จำหน่าย')}${tile(['RN', 'PN', 'NA'].map(k => staffN(S.cfg.units, k)).join(' / '), 'RN / PN / NA')}${tile(incs.length, 'เหตุการณ์ผิดปกติ', incs.length ? 'bad' : '')}</div>`;
  S.cfg.sections.forEach(sc => {
    const list = sc.units.map(unitCfg);
    h += `<h2 class="grp">${esc(sc.label)}</h2>`;
    const keys = sc.group === 'OPD' ? S.cfg.stdOpd : sc.group === 'IPD' ? S.cfg.stdIpd : null;
    if (keys) h += `<div class="card sbox gsum"><div class="shead"><b>รวม ${esc(sc.sub || sc.label)}</b></div><div class="kv">${keys.map(k => `<div>${L[k]}</div><div class="v">${sum(list, k)}</div>`).join('')}<div>RN / PN / NA</div><div class="v">${['RN', 'PN', 'NA'].map(k => staffN(list, k)).join(' / ')}</div></div></div>`;
    list.forEach(u => {
      const r = reps[u.code];
      h += `<div class="card sbox"><div class="shead"><b>${esc(u.code)}</b> ${statusPill(u, r)}</div>${r ? `<div class="slines">${printLines(u, r)}</div>` : '<div class="miss">ยังไม่รายงาน</div>'}</div>`;
    });
  });
  h += `<h2 class="grp">เหตุการณ์ผิดปกติ รวมทุกหน่วยงาน (${incs.length})</h2>`;
  h += incs.length ? incs.map((x, n) => incCardHtml(x.i, x.u.code, n + 1)).join('') : '<div class="card muted">ไม่มีเหตุการณ์ผิดปกติ</div>';
  return h;
}

/* ===== สรุป / พิมพ์ A4 ===== */
function renderPrint() {
  const scope = S.printScope || 'all';
  const inFrame = !(window.google && google.script);
  const sign = '<div class="sign">ลงชื่อ ........................................ ผู้สรุปรายงาน<br>(........................................)</div>';
  const pages = scope === 'all'
    ? [printUnits(), printOverview() + printIncidents() + sign]
    : [printSingle(unitCfg(scope)) + sign];
  return vshiftSeg() + `<div class="noprint" style="display:flex;gap:10px;align-items:end;margin-bottom:12px;flex-wrap:wrap">
      <div style="flex:0 1 260px"><label class="f" for="p_scope">พิมพ์</label>
        <select id="p_scope"><option value="all">รายงานทั้งหมด (แยกหน่วยงาน + ภาพรวม + เหตุการณ์ผิดปกติ)</option>
        ${unitOptgroups(scope, '\u0e40\u0e09\u0e1e\u0e32\u0e30\u0e2b\u0e19\u0e48\u0e27\u0e22\u0e07\u0e32\u0e19 \u00b7 ')}</select></div>
      <button type="button" class="btn" data-act="print">พิมพ์ / บันทึกเป็น PDF</button>
      <span class="muted" style="font-size:13px">${inFrame ? 'ในหน้าตัวอย่างนี้ปุ่มพิมพ์ใช้ไม่ได้ ในแอปจริงจะเปิดหน้าต่างพิมพ์ของเครื่อง' : 'ตั้งค่ากระดาษ A4 แนวตั้ง'}</span></div>
    <div class="a4-scroll">${pages.map(p => `<div class="a4">${p}</div>`).join('')}</div>`;
}
function printHead(sub) {
  const reps = S.day.reports, missing = S.cfg.units.filter(u => !reps[u.code]).map(u => u.code);
  return `<h1>รายงานยอดประจำวัน${sub ? ' \u00b7 ' + sub : ''}</h1><div class="d">${esc(thaiDate(S.date, true))}</div>
    <div class="st">${esc(vshiftLabel())} \u00b7 ส่งรายงานแล้ว ${S.cfg.units.length - missing.length}/${S.cfg.units.length} หน่วยงาน${missing.length ? ` \u00b7 <span class="m">ยังไม่รายงาน: ${missing.map(esc).join(', ')}</span>` : ''}</div>`;
}

function printOverview() {
  const reps = S.day.reports, L = S.cfg.stdLabels;
  const units = g => S.cfg.units.filter(u => u.group === g);
  const sv = u => reps[u.code] ? stdValues(u, reps[u.code].values) : null;
  const sum = (list, k) => list.reduce((a, u) => a + ((sv(u) || {})[k] || 0), 0);

  const opd = units('OPD'), ipd = units('IPD').concat(units('SPU').filter(u => S.cfg.stdIpd.every(k => k in (u.form.std || {})))),
    spu = units('SPU').filter(u => !ipd.includes(u));
  const allIncs = S.cfg.units.flatMap(u => reps[u.code] ? reps[u.code].incidents || [] : []);
  const staffAll = S.cfg.units.flatMap(u => reps[u.code] ? reps[u.code].staff || [] : []);
  const reduceAll = S.cfg.units.reduce((a, u) => { const r = reps[u.code] && reps[u.code].reduce || {}; return a + num(r.RN) + num(r.PN) + num(r.NA); }, 0);

  // ตัวเลขสรุป
  let h = printHead('ภาพรวม') + `<div class="kpis">
    <div><b>${sum(opd, 'total')}</b>ผู้ป่วยนอก (ราย)</div>
    <div><b>${sum(opd, 'admit')}</b>Admit จาก OPD</div>
    <div><b>${sum(ipd, 'remain')}</b>ผู้ป่วยในคงพยาบาล</div>
    <div><b>${sum(ipd, 'admit')} / ${sum(ipd, 'dc')}</b>รับใหม่ / จำหน่าย</div>
    <div><b>${roleCounts(staffAll).filter(x => ['RN', 'PN', 'NA'].includes(x[0])).map(x => x[1]).join(' / ') || 0}</b>RN / PN / NA ปฏิบัติงาน</div>
    <div class="${allIncs.length ? 'alert' : ''}"><b>${allIncs.length}</b>เหตุการณ์ผิดปกติ</div></div>`;

  // ผู้ป่วยนอก
  const sc3 = u => { const r = reps[u.code]; const st = r ? (r.staff || []).filter(x => x.tag !== 'ออกหน่วย') : []; return ['RN', 'PN', 'NA'].map(k => st.filter(x => x.role === k).length); };
  const ssum = (list, i) => list.reduce((a, u) => a + (reps[u.code] ? sc3(u)[i] : 0), 0);
  const staffTd = u => sc3(u).map(n => `<td class="n">${n || '\u2013'}</td>`).join('');
  const staffSumTd = list => [0, 1, 2].map(i => `<td class="n">${ssum(list, i)}</td>`).join('');
  const staffTh = '<th>RN</th><th>PN</th><th>NA</th>';
  h += `<h2>ผู้ป่วยนอก</h2><table class="stat"><thead><tr><th>หน่วยงาน</th>${S.cfg.stdOpd.map(k => `<th>${L[k]}</th>`).join('')}${staffTh}</tr></thead>
    ${opd.map(u => { const s = sv(u); return s ? `<tr><td>${esc(u.code)}</td>${S.cfg.stdOpd.map(k => `<td class="n">${k in s ? s[k] : '\u2013'}</td>`).join('')}${staffTd(u)}</tr>`
      : `<tr><td>${esc(u.code)}</td><td colspan="${S.cfg.stdOpd.length + 3}" class="miss">ยังไม่รายงาน</td></tr>`; }).join('')}
    <tr class="tot"><td>รวม</td>${S.cfg.stdOpd.map(k => `<td class="n">${sum(opd, k)}</td>`).join('')}${staffSumTd(opd)}</tr></table>
    <div class="foot">RN / PN / NA = จำนวนเจ้าหน้าที่ที่ปฏิบัติงานตามรายงานของแต่ละหน่วยงาน (ไม่นับผู้ที่ออกไปปฏิบัติงานหน่วยอื่น)${S.vshift === 'ALL' ? ' \u00b7 ทั้งวัน = รวมจำนวนคนของเวร Day และ Night' : ''}</div>`;

  // ผู้ป่วยใน
  const ipdRow = u => { const s = sv(u); return s ? `<tr><td>${esc(u.code)}</td>${S.cfg.stdIpd.map(k => `<td class="n${k === 'remain' ? ' b' : ''}">${s[k] || '\u2013'}</td>`).join('')}${staffTd(u)}</tr>`
      : `<tr><td>${esc(u.code)}</td><td colspan="${S.cfg.stdIpd.length + 3}" class="miss">ยังไม่รายงาน</td></tr>`; };
  const ipdBlocks = S.cfg.sections.filter(sc => sc.group === 'IPD').map(sc => ({ name: sc.sub, list: sc.units.map(unitCfg) }));
  const icuLike = ipd.filter(u => u.group !== 'IPD');
  if (icuLike.length) ipdBlocks.push({ name: 'Special Unit', list: icuLike });
  h += `<h2>ผู้ป่วยใน</h2><table class="stat"><thead><tr><th>ตึก</th>${S.cfg.stdIpd.map(k => `<th>${L[k]}</th>`).join('')}${staffTh}</tr></thead>
    ${ipdBlocks.map(bk => bk.list.map(ipdRow).join('') + `<tr class="sub"><td>รวม ${esc(bk.name)}</td>${S.cfg.stdIpd.map(k => `<td class="n">${sum(bk.list, k)}</td>`).join('')}${staffSumTd(bk.list)}</tr>`).join('')}
    <tr class="tot"><td>รวมทั้งหมด</td>${S.cfg.stdIpd.map(k => `<td class="n">${sum(ipd, k)}</td>`).join('')}${staffSumTd(ipd)}</tr></table>`;

  // ประเภทผู้ป่วยคงพยาบาล + Special Unit
  const cats = {};
  ipd.forEach(u => reps[u.code] && Object.entries(categoryValues(u, reps[u.code].values)).forEach(([k, n]) => cats[k] = (cats[k] || 0) + n));
  const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  h += `<div class="two"><div><h2>ประเภทผู้ป่วยคงพยาบาล (รวมทุกตึก)</h2>
    ${catList.length ? `<table class="stat">${catList.map(([k, n]) => `<tr><td>${esc(k)}</td><td class="n b">${n}</td></tr>`).join('')}</table>` : '<div class="miss">ไม่มีข้อมูล</div>'}</div>
    <div><h2>Special Unit</h2><table class="stat">${spu.map(u => { const s = sv(u); return `<tr><td>${esc(u.code)}</td>${s ? `<td class="n b">${s.total}</td><td>${esc(u.form.sections[0].title)}</td>` : '<td colspan="2" class="miss">ยังไม่รายงาน</td>'}</tr>`; }).join('')}</table></div></div>`;

  // อัตรากำลัง
  h += `<h2>อัตรากำลัง</h2><table class="stat"><thead><tr><th>กลุ่ม</th><th>RN</th><th>PN</th><th>NA</th><th>อื่นๆ</th><th>ลดอัตรากำลัง (ชม.)</th></tr></thead>
    ${S.cfg.groups.map(g => {
      const list = units(g.key).filter(u => reps[u.code]);
      const st = list.flatMap(u => reps[u.code].staff || []).filter(s => s.tag !== 'ออกหน่วย');
      const c = r => st.filter(s => s.role === r).length;
      const red = list.reduce((a, u) => { const r = reps[u.code].reduce || {}; return a + num(r.RN) + num(r.PN) + num(r.NA); }, 0);
      return `<tr><td>${esc(g.name)}</td><td class="n">${c('RN')}</td><td class="n">${c('PN')}</td><td class="n">${c('NA')}</td><td class="n">${st.length - c('RN') - c('PN') - c('NA')}</td><td class="n">${red}</td></tr>`;
    }).join('')}
    <tr class="tot"><td>รวม</td>${['RN', 'PN', 'NA'].map(r => `<td class="n">${staffAll.filter(s => s.role === r && s.tag !== 'ออกหน่วย').length}</td>`).join('')}<td class="n">${staffAll.filter(s => !['RN', 'PN', 'NA'].includes(s.role) && s.tag !== 'ออกหน่วย').length}</td><td class="n">${reduceAll}</td></tr></table>`;

  return h;
}

function printIncidents() {
  const reps = S.day.reports, incs = [];
  S.cfg.units.forEach(u => (reps[u.code] ? reps[u.code].incidents || [] : []).forEach(i => incs.push(Object.assign({ unit: u.code }, i))));
  const byType = {}; incs.forEach(i => byType[i.type] = (byType[i.type] || 0) + 1);
  return `<h2>เหตุการณ์ผิดปกติ รวมทุกหน่วยงาน (${incs.length})</h2>` + (incs.length
    ? `<div class="chipsp">${Object.entries(byType).map(([k, n]) => `<span>${esc(k)} <b>${n}</b></span>`).join('')}</div>${incTable(incs)}`
    : '<div>ไม่มีรายงานเหตุการณ์ผิดปกติ</div>');
}

function incTable(incs) {
  return `<table><thead><tr><th>หน่วยงาน</th><th>ผู้ป่วย</th><th>V/S</th><th>ประเภท / ระดับ</th><th>รายละเอียด / การแก้ไข</th></tr></thead>
    ${incs.map(i => `<tr><td>${esc(i.unit)}</td>
      <td>${esc(i.patient || '-')}${i.age ? `<br>อายุ ${esc(i.age)} ปี` : ''}${i.hn ? `<br>HN ${esc(i.hn)}` : ''}${i.time ? `<br>มา ${esc(i.time)} น.` : ''}${i.doctor ? `<br>แพทย์ ${esc(i.doctor)}` : ''}</td>
      <td>${vitals(i).map(([k, x, unit]) => `${k} ${esc(x)}${unit === '%' ? '%' : unit === '\u00b0C' ? '\u00b0C' : ''}`).join('<br>')}${i.o2mode ? `<br>O2: ${esc(o2Text(i))}` : ''}</td>
      <td>${esc(i.type)}<br>ระดับ ${esc(i.severity || '-')}</td>
      <td>${esc(i.detail)}${i.action ? `<br><i>แก้ไข: ${esc(i.action)}</i>` : ''}</td></tr>${(i.files || []).length ? `<tr class="attrow"><td></td><td colspan="4"><div class="attbox">${i.files.map(f => `<figure data-attfile="${esc(f.id)}"><figcaption>ไฟล์แนบ: ${esc(f.name)}</figcaption></figure>`).join('')}</div></td></tr>` : ''}`).join('')}</table>`;
}

function printUnits() {
  const reps = S.day.reports, incs = [];
  let body = printHead('แยกหน่วยงาน');
  S.cfg.sections.forEach(sc => {
    body += `<h2>${esc(sc.label)}</h2><div class="cols">`;
    sc.units.map(unitCfg).forEach(u => {
      const r = reps[u.code];
      if (!r) { body += `<div class="ub"><b class="c">${esc(u.code)}</b> <span class="miss">ยังไม่รายงาน</span></div>`; return; }
      (r.incidents || []).forEach(i => incs.push(Object.assign({ unit: u.code }, i)));
      body += `<div class="ub"><b class="c">${esc(u.code)}</b>${printLines(u, r)}</div>`;
    });
    body += '</div>';
  });
  return body;
}

// รายงานเฉพาะหน่วยงานเดียว (ละเอียด)
function printSingle(u) {
  const r = S.day.reports[u.code];
  let h = `<h1>รายงานยอดประจำวัน \u00b7 ${esc(u.code)}</h1><div class="d">${esc(unitLabel(u))} \u00b7 ${esc(thaiDate(S.date, true))}</div>`;
  if (!r) return h + '<div class="miss" style="text-align:center;margin:20mm 0">หน่วยงานนี้ยังไม่ส่งรายงาน</div>';
  const v = r.values || {};
  h += `<div class="st">ผู้รายงาน ${esc(r.reporter)} \u00b7 แก้ไขล่าสุด ${esc(r.updatedAt)}</div><h2>รายงานผู้ป่วย</h2><div class="cols">`;
  u.form.sections.forEach(s => {
    h += `<div class="ub"><b>${esc(s.title)}</b>`;
    if (s.type === 'grid') {
      h += `<table class="stat"><tr><th></th>${s.cols.map(c => `<th>${esc(c[1])}</th>`).join('')}<th>รวม</th></tr>${s.rows.map(rw => { const xs = s.cols.map(c => num(v[rw[0] + '_' + c[0]])); return `<tr><td>${esc(rw[1])}</td>${xs.map(x => `<td class="n">${x || '\u2013'}</td>`).join('')}<td class="n b">${xs.reduce((a, x) => a + x, 0)}</td></tr>`; }).join('')}</table>`;
    } else {
      h += '<table class="stat">' + s.fields.map(f => {
        const val = fieldValue(u, v, f);
        if (f.type === 'text') return val ? `<tr><td colspan="2">${esc(f.label)}: ${esc(val)}</td></tr>` : '';
        return `<tr><td>${esc(f.label)}${f.note && num(val) && v[f.key + '_note'] ? `<br><small>${esc(v[f.key + '_note'])}</small>` : ''}</td><td class="n${f.calc ? ' b' : ''}">${show(val)}${f.pctOf && num(v[f.pctOf]) ? ` (${(num(val) / num(v[f.pctOf]) * 100).toFixed(1)}%)` : ''}</td></tr>`;
      }).join('') + (s.sum ? `<tr class="tot"><td>${esc(s.sum)}</td><td class="n">${sectionSum(s, v)}</td></tr>` : '') + '</table>';
    }
    h += '</div>';
  });
  if (u.form.total) h += `<div class="ub"><b>${esc(u.form.total)} ${u.form.sections.filter(s => s.sum).reduce((a, s) => a + sectionSum(s, v), 0)}</b></div>`;
  h += '</div>';
  if (r.notes) h += `<div class="ln"><b>เรื่องแจ้ง:</b> ${esc(r.notes).replace(/\n/g, ' / ')}</div>`;
  const staff = r.staff || [], rd = r.reduce || {};
  h += `<h2>อัตรากำลัง \u00b7 เวร ${esc(shiftName(r.shift))} \u00b7 ${roleCounts(staff).map(([k, n]) => `${esc(k)} ${n}`).join(', ') || 'ไม่ได้ระบุ'}</h2>
    <div class="cols">${staff.map(s => `<div class="ln">${esc(s.role)} ${esc(s.name)}${s.tag ? ` (${esc(s.tag)}${s.tagNote ? ' ' + esc(s.tagNote) : ''})` : ''}</div>`).join('')}</div>`;
  const rt = num(rd.RN) + num(rd.PN) + num(rd.NA);
  if (rt || rd.detail) h += `<div class="ln" style="margin-top:3px"><b>ลดอัตรากำลัง ${rt} ชม.</b> (RN ${num(rd.RN)} ชม., PN ${num(rd.PN)} ชม., NA ${num(rd.NA)} ชม.)${rd.detail ? ' \u00b7 ' + esc(rd.detail).replace(/\n/g, ' / ') : ''}</div>`;
  const incs = (r.incidents || []).map(i => Object.assign({ unit: u.code }, i));
  return h + `<h2>เหตุการณ์ผิดปกติ (${incs.length})</h2>` + (incs.length ? incTable(incs) : '<div>ไม่มีเหตุการณ์ผิดปกติ</div>');
}
function printLines(u, r) {
  const v = r.values || {}, out = [];
  u.form.sections.forEach(s => {
    if (s.type === 'grid') {
      s.rows.forEach(rw => { const parts = s.cols.map(c => [c[1], num(v[rw[0] + '_' + c[0]])]).filter(x => x[1]); const t = parts.reduce((a, x) => a + x[1], 0); out.push(`${esc(rw[1])} ${t}${parts.length ? ` (${parts.map(x => esc(x[0]) + ' ' + x[1]).join(', ')})` : ''}`); });
      return;
    }
    const calcLines = [];
    const items = s.fields.filter(f => f.type !== 'text').map(f => {
      const val = fieldValue(u, v, f);
      if (f.type === 'time') return val ? `${esc(f.label)} ${esc(val)} น.` : '';
      if (f.calc) { calcLines.push(`<b>${esc(f.label)} ${val}</b>`); return ''; }
      if (!num(val)) return '';
      return `${esc(f.label)} <b>${val}</b>${f.pctOf && num(v[f.pctOf]) ? ` (${(num(val) / num(v[f.pctOf]) * 100).toFixed(1)}%)` : ''}${f.note && v[f.key + '_note'] ? ' (' + esc(v[f.key + '_note']) + ')' : ''}`;
    }).filter(Boolean);
    if (s.sum) items.push(`${esc(s.sum)} <b>${sectionSum(s, v)}</b>`);
    if (items.length) out.push((u.form.sections.length > 1 ? `<b>${esc(s.title)}:</b> ` : '') + items.join(', '));
    calcLines.forEach(l => out.push(l));
    s.fields.filter(f => f.type === 'text' && v[f.key]).forEach(f => out.push(`${esc(f.label)}: ${esc(v[f.key])}`));
  });
  if (u.form.total) out.push(`<b>${esc(u.form.total)} ${u.form.sections.filter(s => s.sum).reduce((a, s) => a + sectionSum(s, v), 0)}</b>`);
  const rc = roleCounts(r.staff || []);
  if (rc.length) out.push(`อัตรากำลัง (${esc(shiftName(r.shift))}): ${rc.map(([k, n]) => `${esc(k)} ${n}`).join(', ')}`);
  const rd = r.reduce || {}, rt = num(rd.RN) + num(rd.PN) + num(rd.NA);
  if (rt) out.push(`ลดอัตรากำลัง ${rt} ชม. (${['RN', 'PN', 'NA'].filter(k => num(rd[k])).map(k => `${k} ${num(rd[k])} ชม.`).join(', ')})`);
  if (r.notes) out.push(`เรื่องแจ้ง: ${esc(r.notes).replace(/\n/g, ' / ')}`);
  if ((r.incidents || []).length) out.push(`<span class="miss">เหตุการณ์ผิดปกติ ${r.incidents.length} เรื่อง</span>`);
  return out.map(l => `<div class="ln">${l}</div>`).join('');
}

/* ตรวจรายชื่อก่อนอัปโหลด: นำเข้าทุกคน ชื่อแผนกตามไฟล์เก็บไว้ ผูกกับหน่วยงานในระบบภายหลังได้ */
const NO_DEPT = '(ไม่ระบุแผนก)';
function drawUpPreview() {
  const rows = S.upRows || [], bad = S.upBad || [], by = {};
  rows.forEach(r => { const k = r.dept || NO_DEPT; if (!by[k]) by[k] = { n: 0, unit: resolveDept(r.dept) }; by[k].n++; });
  const bound = rows.filter(r => resolveDept(r.dept)).length;
  $('up_preview').innerHTML = `<p style="margin:10px 0 6px">พบ <b>${rows.length}</b> รายชื่อ จาก ${Object.keys(by).length} แผนกในไฟล์ \u00b7 จัดเข้าหน่วยงานได้ทันที <b>${bound}</b> คน \u00b7 ยังไม่ผูกแผนก <b>${rows.length - bound}</b> คน (เก็บไว้ ผูกภายหลังได้)${bad.length ? ` \u00b7 <span style="color:var(--bad)">ข้ามแถวที่ไม่มีชื่อ: ${bad.slice(0, 10).join(', ')}${bad.length > 10 ? '\u2026' : ''}</span>` : ''}</p>
    <div class="grid-scroll"><table class="g"><tr><th>ชื่อแผนกในไฟล์</th><th>คน</th><th>หน่วยงานในระบบ</th></tr>
    ${Object.entries(by).map(([k, o]) => `<tr><td>${esc(k)}</td><td class="num">${o.n}</td><td>${o.unit ? '<b>' + esc(o.unit) + '</b>' : '<span class="muted">ยังไม่ผูก</span>'}</td></tr>`).join('')}</table></div>
    <button type="button" class="btn" id="up_go" style="margin-top:10px"${rows.length ? '' : ' disabled'}>ยืนยันอัปโหลด</button>`;
  $('up_go').onclick = async () => {
    $('up_go').disabled = true;
    try {
      const r = await api('uploadStaff', S.token, rows);
      S.upRows = null; await loadStaff(); render();
      toast(`อัปโหลด ${r.added} รายชื่อ \u00b7 จัดเข้าหน่วยงานแล้ว ${r.bound} \u00b7 รอผูกแผนก ${r.unbound}`);
    } catch (e) { handleErr(e); $('up_go').disabled = false; }
  };
}

/* ผูกชื่อแผนกในไฟล์กับหน่วยงานในระบบ: เลือกแล้วกดบันทึก รายชื่อทั้งแผนกย้ายเข้าหน่วยงานนั้น และจำไว้ใช้ครั้งต่อไป */
function deptGroups() {
  const g = {};
  S.staff.filter(s => s.source === 'upload').forEach(s => {
    const k = s.fileDept || s.unit || NO_DEPT, o = g[k] || (g[k] = { n: 0, units: {} });
    o.n++; o.units[s.unit || ''] = (o.units[s.unit || ''] || 0) + 1;
  });
  return Object.entries(g).map(([k, o]) => {
    const cur = Object.entries(o.units).sort((a, b) => b[1] - a[1])[0][0];
    return { dept: k, n: o.n, cur };
  }).sort((a, b) => (a.cur ? 1 : 0) - (b.cur ? 1 : 0) || a.dept.localeCompare(b.dept, 'th'));
}
function renderBindingCard() {
  const gs = deptGroups(), none = S.staff.filter(s => !s.unit).length;
  if (!gs.length) return '';
  S.bindSel = S.bindSel || {};
  return `<div class="card"><h3>ผูกชื่อแผนกในไฟล์กับหน่วยงานในระบบ <span class="sub">รอผูก ${none} คน</span></h3>
    <p class="muted" style="margin:0 0 8px;font-size:14px">เลือกหน่วยงานที่ตรงกับแต่ละแผนกในไฟล์ แล้วกด "บันทึกการผูก" รายชื่อทั้งแผนกจะเข้าหน่วยงานนั้น และอัปโหลดครั้งต่อไประบบจัดเข้าให้เอง (แผนกที่ระบบแนะนำให้ ยังไม่บันทึกจนกว่าจะกดบันทึก)</p>
    <div class="binding">${gs.map(o => {
      const sel = o.dept in S.bindSel ? S.bindSel[o.dept] : (o.cur || suggestUnit(o.dept));
      const tag = o.cur ? 'ผูกแล้ว' : (sel ? 'ระบบแนะนำ ยังไม่บันทึก' : 'ยังไม่ผูก');
      return `<span><b>${esc(o.dept)}</b> <small class="muted">(${o.n} คน) \u00b7 ${tag}</small></span><select data-dept="${esc(o.dept)}"${o.dept === NO_DEPT ? ' disabled' : ''}><option value="">\u2014 ยังไม่ผูก \u2014</option>${unitOptgroups(sel)}</select>`;
    }).join('')}</div>
    <button type="button" class="btn" data-act="bindsave">บันทึกการผูก</button></div>`;
}
async function saveBindingsNow() {
  const items = [];
  deptGroups().forEach(o => {
    if (o.dept === NO_DEPT) return;
    const sel = o.dept in S.bindSel ? S.bindSel[o.dept] : (o.cur || suggestUnit(o.dept));
    if (sel !== o.cur) items.push({ alias: o.dept, unit: sel });
  });
  if (!items.length) return toast('ไม่มีการเปลี่ยนแปลง');
  try {
    S.aliases = await api('saveBindings', S.token, items);
    S.bindSel = {}; await loadStaff(); render();
    toast(`บันทึกการผูก ${items.length} แผนกแล้ว`);
  } catch (e) { handleErr(e); }
}

/* ===== ผูกเหตุการณ์ของหน้าที่แสดงอยู่ ===== */
function bindView() {
  const v = $('view');
  v.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === 'edit') startEdit();
    else if (a === 'back') go('all');
    else if (a === 'print') { if (S.pendingAtt > 0) toast('กำลังโหลดไฟล์แนบ รอสักครู่แล้วกดพิมพ์อีกครั้ง'); else window.print(); }
    else if (a === 'tpl') downloadTemplate();
    else if (a === 'bindsave') saveBindingsNow();
    else if (a === 'rooms') roomEditor($('adm_room_editor'), b.dataset.runit, () => render());
  });
  v.querySelectorAll('[data-vshift]').forEach(b => b.onclick = () => { S.vshift = b.dataset.vshift; S.day = { reports: deriveReports(S.vshift) }; render(); });
  v.querySelectorAll('[data-mshift]').forEach(b => b.onclick = () => { S.shift = b.dataset.mshift; render(); });
  v.querySelectorAll('[data-sub]').forEach(b => { if (!S.editing) b.onclick = () => { S.sub = b.dataset.sub; render(); }; });
  if ($('p_scope')) $('p_scope').onchange = () => { S.printScope = $('p_scope').value; render(); };
  v.querySelectorAll('[data-unit].ucard').forEach(b => b.onclick = () => (b.dataset.unit === S.me.unit ? go('mine') : go('all', b.dataset.unit)));
  v.querySelectorAll('[data-sact]').forEach(b => b.onclick = () => staffAction(b.dataset.sact, b.dataset.id, b.dataset.unit));
  if ($('st_unit')) $('st_unit').onchange = () => { S.staffUnit = $('st_unit').value; render(); };
  if ($('up_file')) $('up_file').onchange = async () => {
    const f = $('up_file').files[0]; if (!f) return;
    $('up_preview').innerHTML = '<p class="muted">กำลังอ่านไฟล์...</p>';
    try {
      const { rows, bad } = await readRoster(f);
      S.upRows = rows; S.upBad = bad;
      drawUpPreview();
    } catch (e) { $('up_preview').innerHTML = `<p style="color:var(--bad)">${esc(e.message)}</p>`; }
  };
  v.querySelectorAll('[data-dept]').forEach(sel => sel.onchange = () => { S.bindSel[sel.dataset.dept] = sel.value; });
  if (S.upRows && $('up_preview') && S.tab === 'staff' && S.upRows.length) drawUpPreview();

}
window.__scriptLoaded = true;
</script>
