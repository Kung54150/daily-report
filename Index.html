// รายงานประจำเดือนของหน่วยงานเดียว: หน้า 1 ยอดรายวัน/เวร + รวม + เฉลี่ย \u00b7 หน้า 2 รายการรวมทั้งเดือน + เหตุการณ์ผิดปกติ
function printMonthly(u, month, reps) {
  const L = S.cfg.stdLabels, keys = Object.keys(u.form.std || {}), two = shiftsOf(u).length > 1;
  const staff3 = r => { const st = (r.staff || []).filter(x => x.tag !== 'ออกหน่วย'); return ['RN', 'PN', 'NA'].map(n => st.filter(x => asRN(x.role) === n).length); };

  else {

    p1 += `<h2>ยอดรายวัน</h2><table class="stat"><thead><tr><th>วันที่</th>${two ? '<th>เวร</th>' : ''}${keys.map(k => `<th>${esc(L[k])}</th>`).join('')}<th>RN</th><th>PN</th><th>NA</th></tr></thead>
      ${rows.map(x => `<tr><td>${esc(fmtDMY(x.r.date))}</td>${two ? `<td>${esc(x.r.shift)}</td>` : ''}${keys.map(k => cell(x.sv[k] || '\u2013')).join('')}${x.st.map(n => cell(n || '\u2013')).join('')}</tr>`).join('')}
      <tr class="tot"><td colspan="${two ? 2 : 1}">รวมทั้งเดือน</td>${keys.map(k => additive(k) ? cell(rows.reduce((a, x) => a + (x.sv[k] || 0), 0)) : cell('\u2013')).join('')}${[0, 1, 2].map(() => cell('\u2013')).join('')}</tr>
      <tr class="sub"><td colspan="${two ? 2 : 1}">เฉลี่ยต่อ${unitTxt}</td>${keys.map(k => cell(f1(rows.reduce((a, x) => a + (x.sv[k] || 0), 0) / rows.length))).join('')}${[0, 1, 2].map(i => cell(f1(rows.reduce((a, x) => a + x.st[i], 0) / rows.length))).join('')}</tr></table>
      <div class="foot">RN / PN / NA = จำนวนเจ้าหน้าที่ที่ปฏิบัติงานในแต่ละ${unitTxt}ตามรายงาน (ไม่นับผู้ที่ออกไปปฏิบัติงานหน่วยอื่น) \u00b7 ยอดยกมาและคงพยาบาลไม่รวมเป็นยอดสะสม</div>`;
    const red = ['RN', 'PN', 'NA'].map(k => reps.reduce((a, r) => a + num((r.reduce || {})[k]), 0));
    if (red.some(Boolean)) p1 += `<div class="ln" style="margin-top:4px"><b>ลดอัตรากำลังรวมทั้งเดือน ${red.reduce((a, x) => a + x, 0)} ชม.</b> (RN ${red[0]} ชม., PN ${red[1]} ชม., NA ${red[2]} ชม.)</div>`;
  }
  // รายการรวมทั้งเดือน (ไม่ซ้ำกับตารางด้านบน)
  const stdKeys = new Set(Object.values(u.form.std || {}).flat());
  const boxes = [];
  u.form.sections.forEach(s => {
    const lines = [];
    if (s.type === 'docs') {
      reps.forEach(r => (( r.values || {})[s.key] || []).forEach(d => { const nm = d.name || '(ไม่ระบุชื่อ)'; lines.push([nm + ' (เคส)', num(d.n)]); (d.rows || []).forEach(x => lines.push([listLabel(s.items.find(i => i.k === x.k), x) + ' \u00b7 ' + nm, num(x.n)])); }));
    } else if (s.type === 'list') {
      const agg = {};

      Object.entries(agg).sort((a, b) => b[1] - a[1]).forEach(([k, n]) => lines.push([k, n]));

      s.rows.forEach(rw => { const n = reps.reduce((a, r) => a + s.cols.reduce((b, c) => b + num((r.values || {})[rw[0] + '_' + c[0]]), 0), 0); if (n) lines.push([rw[1], n]); });

        if (n) lines.push([f.label, n]);

    if (lines.length) boxes.push(`<div class="ub"><b>${esc(s.title)}</b><table class="stat">${lines.map(([k, n]) => `<tr><td>${esc(k)}</td><td class="n">${n}</td></tr>`).join('')}</table></div>`);

  const incs = reps.flatMap(r => (r.incidents || []).map(i => Object.assign({}, i, { unit: fmtDMY(r.date) + (two ? ' \u00b7 ' + r.shift : '') })));
  const css = reps.flatMap(r => (r.cases || []).map(i => Object.assign({}, i, { unit: fmtDMY(r.date) + (two ? ' \u00b7 ' + r.shift : '') })));
  let p2 = '';
  p2 += boxes.length ? `<h2>รวมจำนวนรายการ</h2><div class="cols">${boxes.join('')}</div>` : '<div class="muted">ไม่มีรายการอื่นนอกเหนือจากตารางยอดรายวัน</div>';
  const byType = {}; incs.forEach(i => byType[i.type] = (byType[i.type] || 0) + 1);
  p2 += `<h2>เหตุการณ์ผิดปกติ (${incs.length})</h2>` + (incs.length ? `<div class="chipsp">${Object.entries(byType).map(([k, n]) => `<span>${esc(k)} <b>${n}</b></span>`).join('')}</div>${incTable(incs, 'วันที่ / เวร')}` : '<div>ไม่มีรายงานเหตุการณ์ผิดปกติ</div>');
  if (css.length) p2 += `<h2>รายงานเคส (${css.length})</h2>${incTable(css, 'วันที่ / เวร', true)}`;
  return p1 + p2;
}
function printHead(sub) {

function printOverview() {
  const L = S.cfg.stdLabels, SH = S.cfg.shifts;
  const units = g => S.cfg.units.filter(u => u.group === g);
  const opd = units('OPD'), ipd = units('IPD').concat(units('SPU').filter(u => S.cfg.stdIpd.every(k => k in (u.form.std || {})))),
    spu = units('SPU').filter(u => !ipd.includes(u));
  const sv = (u, k) => { const r = repAt(u, k); return r ? stdValues(u, r.values) : null; };
  const sum = (list, key, k) => list.reduce((a, u) => a + ((sv(u, k) || {})[key] || 0), 0);
  const sc3 = (u, k) => { const r = repAt(u, k), st = r ? (r.staff || []).filter(x => x.tag !== 'ออกหน่วย') : []; return ['RN', 'PN', 'NA'].map(n => st.filter(x => asRN(x.role) === n).length); };
  const ssum = (list, i, k) => list.reduce((a, u) => a + sc3(u, k)[i], 0);
  const staffTh = '<th>RN</th><th>PN</th><th>NA</th>';
  const staffTd = (u, k) => sc3(u, k).map(n => `<td class="n">${n || '\u2013'}</td>`).join('');
  const staffSumTd = (list, k) => [0, 1, 2].map(i => `<td class="n">${ssum(list, i, k)}</td>`).join('');
  // ผู้ป่วยใน: คงพยาบาลมีลูกบอลสีเรียงลงมาข้างใต้ และอัตรากำลัง RN/PN/NA เรียงลงมาในช่องเดียว
  const ballsOf = (list, k) => { const t = { g: 0, y: 0, o: 0, r: 0 }; list.forEach(u => { const r = repAt(u, k); if (r) { const x = ballTotals(u, r.values || {}); S.cfg.balls.forEach(b => { t[b[0]] += x[b[0]]; }); } }); return t; };
  const remCell = (n, t) => `<div class="rem"><span>${n}</span>${ballStack(t, true)}</div>`;
  const stackStaff = c3 => c3.some(Boolean) ? `<div class="bstack">${['RN', 'PN', 'NA'].map((n, i) => c3[i] ? `<div>${n} ${c3[i]}</div>` : '').join('')}</div>` : '\u2013';
  const row = (u, k, keys, ipdMode) => { const s = sv(u, k);
    if (!s) return `<tr><td>${shiftLab(u, k)}</td><td colspan="${keys.length + (ipdMode ? 1 : 3)}" class="miss">ยังไม่รายงาน</td></tr>`;
    if (!ipdMode) return `<tr><td>${shiftLab(u, k)}</td>${keys.map(x => `<td class="n">${x in s ? s[x] : '\u2013'}</td>`).join('')}${staffTd(u, k)}</tr>`;
    return `<tr><td>${shiftLab(u, k)}</td>${keys.map(x => x === 'remain' ? `<td class="n b">${remCell(s[x] || '\u2013', ballsOf([u], k))}</td>` : `<td class="n">${s[x] || '\u2013'}</td>`).join('')}<td class="n">${stackStaff(sc3(u, k))}</td></tr>`; };
  const rows = (list, keys, ipdMode) => list.flatMap(u => shiftsOf(u).map(k => row(u, k, keys, ipdMode))).join('');
  const totRows = (list, keys, label, cls, ipdMode) => SH.filter(k => list.some(u => unitHas(u, k))).map(k => { const l = list.filter(u => unitHas(u, k));
    return `<tr class="${cls}"><td>${esc(label)} \u00b7 ${esc(k)}</td>${keys.map(x => `<td class="n">${ipdMode && x === 'remain' ? remCell(sum(l, x, k), ballsOf(l, k)) : sum(l, x, k)}</td>`).join('')}${ipdMode ? `<td class="n">${stackStaff([0, 1, 2].map(i => ssum(l, i, k)))}</td>` : staffSumTd(l, k)}</tr>`; }).join('');

  let h = printHead('ภาพรวม');
  h += `<h2>ผู้ป่วยนอก</h2><table class="stat"><thead><tr><th>หน่วยงาน</th>${S.cfg.stdOpd.map(k => `<th>${L[k]}</th>`).join('')}${staffTh}</tr></thead>
    ${rows(opd, S.cfg.stdOpd, false)}${totRows(opd, S.cfg.stdOpd, 'รวม', 'tot')}</table>
    <div class="foot">RN / PN / NA = จำนวนเจ้าหน้าที่ที่ปฏิบัติงานตามรายงานของแต่ละหน่วยงาน (ไม่นับผู้ที่ออกไปปฏิบัติงานหน่วยอื่น) \u00b7 แผนกที่มี 2 เวรแสดงแยกเป็นเวร Day และ Night</div>`;

  const ipdBlocks = S.cfg.sections.filter(sc => sc.group === 'IPD').map(sc => ({ name: sc.sub, list: sc.units.map(unitCfg) }));
  const icuLike = ipd.filter(u => u.group !== 'IPD');
  if (icuLike.length) ipdBlocks.push({ name: 'Special Unit', list: icuLike });
  h += `<h2>ผู้ป่วยใน</h2><table class="stat"><thead><tr><th>ตึก</th>${S.cfg.stdIpd.map(k => `<th${k === 'remain' ? ' style="width:17%"' : ''}>${L[k]}</th>`).join('')}<th style="width:9%">อัตรากำลัง</th></tr></thead>
    ${ipdBlocks.map(bk => rows(bk.list, S.cfg.stdIpd, true) + totRows(bk.list, S.cfg.stdIpd, 'รวม ' + bk.name, 'sub', true)).join('')}
    ${totRows(ipd, S.cfg.stdIpd, 'รวมทั้งหมด', 'tot', true)}</table>`;

  const cats = {};
  ipd.forEach(u => shiftsOf(u).forEach(k => { const r = repAt(u, k); if (r) Object.entries(categoryValues(u, r.values)).forEach(([c, n]) => { (cats[c] = cats[c] || {})[k] = (cats[c][k] || 0) + n; }); }));
  const tot = c => SH.reduce((a, k) => a + (c[1][k] || 0), 0), catList = Object.entries(cats).sort((a, b) => tot(b) - tot(a));
  h += `<div class="two"><div><h2>ประเภทผู้ป่วยคงพยาบาล (รวมทุกตึก)</h2>
    ${catList.length ? `<table class="stat"><tr><th></th>${SH.map(k => `<th>${esc(k)}</th>`).join('')}</tr>${catList.map(([c, o]) => `<tr><td>${esc(c)}</td>${SH.map(k => `<td class="n b">${o[k] || '\u2013'}</td>`).join('')}</tr>`).join('')}</table>` : '<div class="miss">ไม่มีข้อมูล</div>'}</div>
    <div><h2>Special Unit</h2><table class="stat">${spu.flatMap(u => shiftsOf(u).map(k => { const s = sv(u, k); return `<tr><td>${shiftLab(u, k)}</td>${s ? `<td class="n b">${s.total}</td><td>${esc(u.form.sections[0].title)}</td>` : '<td colspan="2" class="miss">ยังไม่รายงาน</td>'}</tr>`; })).join('')}</table></div></div>`;

  const grpRow = (label, k, list) => { const rs = list.map(u => repAt(u, k)).filter(Boolean), st = rs.flatMap(r => r.staff || []).filter(x => x.tag !== 'ออกหน่วย');
    const c = r => st.filter(x => asRN(x.role) === r).length, red = rs.reduce((a, r) => { const d = r.reduce || {}; return a + num(d.RN) + num(d.PN) + num(d.NA); }, 0);
    return `<tr${label === 'รวม' ? ' class="tot"' : ''}><td>${esc(label)} \u00b7 ${esc(k)}</td><td class="n">${c('RN')}</td><td class="n">${c('PN')}</td><td class="n">${c('NA')}</td><td class="n">${st.length - c('RN') - c('PN') - c('NA')}</td><td class="n">${red}</td></tr>`; };
  h += `<h2>อัตรากำลัง</h2><table class="stat"><thead><tr><th>กลุ่ม</th><th>RN</th><th>PN</th><th>NA</th><th>อื่นๆ</th><th>ลดอัตรากำลัง (ชม.)</th></tr></thead>
    ${S.cfg.groups.map(g => SH.filter(k => units(g.key).some(u => unitHas(u, k))).map(k => grpRow(g.name, k, units(g.key).filter(u => unitHas(u, k)))).join('')).join('')}
    ${SH.map(k => grpRow('รวม', k, S.cfg.units.filter(u => unitHas(u, k)))).join('')}</table>`;
  return h;
}

function printIncidents() {

function casesPrint() {

    ${incs.map(i => `<tr><td>${esc(i.unit)}</td>
      <td>${esc(i.patient || '-')}${i.age ? `<br>อายุ ${esc(ageText(i.age))}` : ''}${i.hn ? `<br>HN ${esc(i.hn)}` : ''}${i.time ? `<br>มา ${esc(i.time)} น.` : ''}${i.doctor ? `<br>แพทย์ ${esc(i.doctor)}` : ''}</td>
      <td>${vitals(i).map(([k, x, unit]) => `${k} ${esc(x)}${unit === '%' ? '%' : unit === '\u00b0C' ? '\u00b0C' : ''}`).join('<br>')}${i.o2mode ? `<br>O2: ${esc(o2Text(i))}` : ''}</td>
      ${cs ? '' : `<td>${esc(i.type)}<br>ระดับ ${esc(i.severity || '-')}</td>`}
      <td>${esc(i.detail)}${i.action ? `<br><i>แก้ไข: ${esc(i.action)}</i>` : ''}</td></tr>${(i.files || []).length ? `<tr class="attrow"><td></td><td colspan="${cs ? 3 : 4}"><div class="attbox">${i.files.map(f => `<figure data-attfile="${esc(f.id)}"><figcaption>ไฟล์แนบ: ${esc(f.name)}</figcaption></figure>`).join('')}</div></td></tr>` : ''}`).join('')}</table>`;
}

  const v = r.values || {};
  h += `<div class="st">ผู้รายงาน ${esc(r.reporter)} \u00b7 แก้ไขล่าสุด ${esc(r.updatedAt)}</div><h2>รายงานผู้ป่วย</h2><div class="cols">`;
  u.form.sections.forEach(s => {
    h += `<div class="ub"><b>${esc(s.title)}</b>`;
    if (s.type === 'docs') {
      h += '<table class="stat">' + (v[s.key] || []).map(d => `<tr><td><b>${esc(d.name || '(ไม่ระบุชื่อ)')}</b></td><td class="n">${num(d.n)}</td></tr>` + (d.rows || []).map(r => `<tr><td>&nbsp;&nbsp;${esc(listLabel(s.items.find(x => x.k === r.k), r))}</td><td class="n">${r.n}</td></tr>`).join('')).join('') + `<tr class="tot"><td>${esc(s.totalLabel)}</td><td class="n">${num(v[s.totalKey])}</td></tr></table>`;
    } else if (s.type === 'list') {
      h += '<table class="stat">' + (listRows(s, v).map(r => `<tr><td>${esc(listLabel(r.it, r))}</td><td class="n">${r.n}</td></tr>`).join('') || '<tr><td colspan="2">\u2013</td></tr>') + `<tr class="tot"><td>${esc(s.totalLabel)}</td><td class="n">${listTotal(s, v)}</td></tr></table>`;
    } else if (s.type === 'grid') {
      h += `<table class="stat"><tr><th></th>${s.cols.map(c => `<th>${esc(c[1])}</th>`).join('')}<th>รวม</th></tr>${s.rows.map(rw => { const xs = s.cols.map(c => num(v[rw[0] + '_' + c[0]])); return `<tr><td>${esc(rw[1])}</td>${xs.map(x => `<td class="n">${x || '\u2013'}</td>`).join('')}<td class="n b">${xs.reduce((a, x) => a + x, 0)}</td></tr>`; }).join('')}</table>`;
    } else {

      }).join('') + (s.sum ? `<tr class="tot"><td>${esc(s.sum)}</td><td class="n">${sectionSum(s, v)}</td></tr>` : '') + '</table>';

  });

  else {
  h += `<h2>อัตรากำลัง \u00b7 เวร ${esc(shiftName(r.shift))} \u00b7 ${roleCounts(staff).map(([k, n]) => `${esc(k)} ${n}`).join(', ') || 'ไม่ได้ระบุ'}</h2>
    <div class="cols">${(u.staffSlot ? slotSort(staff) : staff).map(s => `<div class="ln">${esc(dutyPos(s, u.code))}${u.staffSlot && s.slot ? ' \u00b7 คนที่ ' + esc(s.slot) : ''} ${esc(s.name)}${timeText(s) ? ' ' + esc(timeText(s)) : ''}${s.tag ? ` (${esc(s.tag)}${s.tagNote ? ' ' + esc(s.tagNote) : ''})` : ''}</div>`).join('')}</div>`;
  }
  const rt = num(rd.RN) + num(rd.PN) + num(rd.NA);

    + (css.length ? `<h2>รายงานเคส (${css.length})</h2>` + incTable(css, null, true) : '');
}
// ปรับการแสดงผลในเอกสารสรุปของบางหัวข้อ: title = ชื่อหัวข้อที่แสดง, lead = ช่องที่นำค่ามาต่อท้ายหัวข้อ (ไม่ซ้ำในรายละเอียด), nosum = ไม่แสดงบรรทัดรวม
const SUMMARY_VIEW = {
  ER: { 'ยอดผู้รับบริการ': { title: 'ยอดผู้รับบริการทั้งหมด', lead: 'total' }, 'OPD Case แบ่งตามประเภท (Triage)': { title: 'แยกตามประเภท Triage', nosum: true } },
  EENT: { 'ยอดผู้ป่วย': { title: 'จำนวนคนไข้ทั้งหมด', lead: 'total', nosum: true } },
  OPD1: { 'ยอดรวม': { title: 'ยอดรวม Med+Psy', lead: 'total' }, 'ผู้ป่วยอายุรกรรม': { lead: 'med' }, 'ผู้ป่วยจิตเวช': { lead: 'psy' } }
};
// รายการหลักเป็นตัวหนา รายละเอียดขึ้นบรรทัดใหม่ขึ้นต้นด้วย -
function printLines(u, r, withInc) {
  const v = r.values || {}, out = [];
  const grp = (head, details) => out.push(`<div class="lg">${head ? `<div class="ln m">${head}</div>` : ''}${details.filter(Boolean).map(d => `<div class="ln dt">- ${d}</div>`).join('')}</div>`);
  u.form.sections.forEach(s => {
    if (s.type === 'docs') {
      grp(`<b>${esc(s.title)} ${num(v[s.totalKey])} ${esc(s.unit)}</b>`, []);
      (v[s.key] || []).forEach(d => grp(`<b>${esc(d.name || '(ไม่ระบุชื่อ)')} ${num(d.n)} ${esc(s.unit)}</b>`, (d.rows || []).map(r => `${esc(listLabel(s.items.find(x => x.k === r.k), r))} ${r.n}`)));
      return;
    }
    if (s.type === 'list') { const rows = listRows(s, v); if (rows.length) grp(`<b>${esc(s.totalLabel)} ${listTotal(s, v)} ${esc(listUnit(s))}</b>`, rows.map(r => `${esc(listLabel(r.it, r))} ${r.n}`)); return; }
    if (s.type === 'grid') {
      s.rows.forEach(rw => { const parts = s.cols.map(c => [c[1], num(v[rw[0] + '_' + c[0]])]).filter(x => x[1]); const t = parts.reduce((a, x) => a + x[1], 0); grp(`<b>${esc(rw[1])} ${t}</b>`, [parts.map(x => esc(x[0]) + ' ' + x[1]).join(', ')]); });
      return;
    }
    const calcs = [], vw = (SUMMARY_VIEW[u.code] || {})[s.title] || {}, btxt = ballList(ballTotals(u, v));
    const items = s.fields.filter(f => f.type !== 'text').map(f => {
      if (f.key === vw.lead) return '';
      const val = fieldValue(u, v, f);
      if (f.type === 'time') return val ? `${esc(f.label)} ${esc(val)} น.` : '';
      if (f.calc) { calcs.push(`<b>${esc(f.label)} ${val}</b>${f.key === 'remain' && btxt ? ' (' + btxt + ')' : ''}`); return ''; }
      if (!num(val)) return '';
      return `${esc(f.label)} ${val}${s.categories ? ' ราย' : ''}${s.categories && ballText(v, f.key) ? ' (' + ballText(v, f.key) + ')' : ''}${f.pctOf && num(v[f.pctOf]) ? ` (${(num(val) / num(v[f.pctOf]) * 100).toFixed(1)}%)` : ''}${f.note && v[f.key + '_note'] ? ' (' + esc(v[f.key + '_note']) + ')' : ''}`;
    }).filter(Boolean);
    const lf = vw.lead && s.fields.find(f => f.key === vw.lead), lv = lf ? fieldValue(u, v, lf) : '';
    const head = (u.form.sections.length > 1 ? esc(vw.title || s.title) : '') + (lf && lv !== undefined && lv !== '' ? ` ${lv} ${esc(lf.unit || '')}` : '') + (s.sum && !vw.nosum ? ` ${esc(s.sum)} ${sectionSum(s, v)}` : '');
    if (items.length || (head.trim() && !s.sum)) grp(head.trim() ? `<b>${head.trim()}</b>` : '', items);
    calcs.forEach(l => grp(l, []));
    s.fields.filter(f => f.type === 'text' && v[f.key]).forEach(f => grp('', [`${esc(f.label)}: ${esc(v[f.key])}`]));
  });
  if (u.form.total) {
    const tl = [`<b>${esc(u.form.total)} ${u.form.sections.filter(s => s.sum).reduce((a, s) => a + sectionSum(s, v), 0)}</b>`];
    if (u.group === 'OPD') out.unshift(`<div class="lg"><div class="ln m">${tl[0]}</div></div>`); // ผู้ป่วยนอก: ยอดรวมทั้งหมดอยู่บรรทัดแรกเสมอ
    else grp(tl[0], []);
  }
  const rc = roleCounts(r.staff || []);
  const rd = r.reduce || {}, rt = num(rd.RN) + num(rd.PN) + num(rd.NA);
  const rdLine = rt ? `<b>ลดอัตรากำลัง ${rt} ชม.</b> (${['RN', 'PN', 'NA'].filter(k => num(rd[k])).map(k => `${k} ${num(rd[k])} ชม.`).join(', ')})` : '';
  if (u.group !== 'OPD' && withInc) {
    // ผู้ป่วยใน / Special Unit: แสดงชื่อ (เฉพาะชื่อต้น) ตามตำแหน่ง และการลดอัตรากำลังอยู่กลุ่มเดียวกับอัตรากำลัง
    const names = rl => (r.staff || []).filter(x => x.role === rl && x.tag !== 'ออกหน่วย').map(x => esc(firstName(x.name)));
    const lines = rc.map(([k, n]) => `${esc(k)} ${n}${k === 'ไม่ระบุ' ? '' : ' (' + names(k).join(', ') + ')'}`);
    if (rdLine) lines.push(rdLine);
    if (lines.length) grp('<b>อัตรากำลัง</b>', lines);
  } else {
    // ผู้ป่วยนอก: ไม่แสดงเจ้าหน้าที่และแพทย์ในหน้าสรุป (ดูได้ที่แท็บอัตรากำลัง/แพทย์ของแต่ละหน่วยงาน)
    if (u.group !== 'OPD' && rc.length) grp('<b>อัตรากำลัง</b>', [rc.map(([k, n]) => `${esc(k)} ${n}`).join(', ')]);
    if (rdLine) grp(rdLine, []);
  }
  if (r.notes) grp('<b>เรื่องแจ้ง</b>', [esc(r.notes).replace(/\n/g, ' / ')]);
  const one = t => esc(String(t || '').replace(/\s*\n\s*/g, ' / '));
  const caseText = (i, head) => {
    const pt = [i.patient, i.age ? 'อายุ ' + ageText(i.age) : '', i.hn ? 'HN ' + i.hn : ''].filter(Boolean).join(' ');
    const vs = vitals(i).map(([k, x, unit]) => `${k} ${esc(x)}${unit === '%' ? '%' : unit === '\u00b0C' ? '\u00b0C' : ''}`).join(', ') + (i.o2mode ? (vitals(i).length ? ', ' : '') + 'O2: ' + esc(o2Text(i)) : '');
    const who = [i.time ? 'มา ' + esc(i.time) + ' น.' : '', i.doctor ? 'แพทย์ ' + esc(i.doctor) : ''].filter(Boolean).join(' \u00b7 ');
    return head + (pt ? ' \u00b7 <b>' + esc(pt) + '</b>' : '') + (who ? '<br>' + who : '') + (vs ? '<br>' + vs : '') + (i.detail ? '<br>' + one(i.detail) : '') + (i.action ? `<br><i>แก้ไข: ${one(i.action)}</i>` : '');
  };
  if ((r.incidents || []).length) grp(`<b class="miss">เหตุการณ์ผิดปกติ ${r.incidents.length} เรื่อง</b>`, withInc ? r.incidents.map(i => caseText(i, `<b>${esc(i.type)}</b>${i.severity && i.severity !== '-' ? ` (ระดับ ${esc(i.severity)})` : ''}`)) : []);
  if ((r.cases || []).length) grp(`<b>รายงานเคส ${r.cases.length} เรื่อง</b>`, withInc ? r.cases.map(i => caseText(i, '<b>เคส</b>')) : []);
  return out.join('');
}

/* ตรวจรายชื่อก่อนอัปโหลด: นำเข้าทุกคน ชื่อแผนกตามไฟล์เก็บไว้ ผูกกับหน่วยงานในระบบภายหลังได้ */
const NO_DEPT = '(ไม่ระบุแผนก)';
function drawUpPreview() {
  const rows = S.upRows || [], bad = S.upBad || [], by = {};
  rows.forEach(r => { const k = r.dept || NO_DEPT; if (!by[k]) by[k] = { n: 0, unit: resolveDept(r.dept) }; by[k].n++; });
  const bound = rows.filter(r => resolveDept(r.dept)).length;
  $('up_preview').innerHTML = `<p style="margin:10px 0 6px">พบ <b>${rows.length}</b> รายชื่อ จาก ${Object.keys(by).length} แผนกในไฟล์ \u00b7 จัดเข้าหน่วยงานได้ทันที <b>${bound}</b> คน \u00b7 ยังไม่ผูกแผนก <b>${rows.length - bound}</b> คน (เก็บไว้ ผูกภายหลังได้)${bad.length ? ` \u00b7 <span style="color:var(--bad)">ข้ามแถวที่ไม่มีชื่อ: ${bad.slice(0, 10).join(', ')}${bad.length > 10 ? '\u2026' : ''}</span>` : ''}</p>
    <div class="grid-scroll"><table class="g"><tr><th>ชื่อแผนกในไฟล์</th><th>คน</th><th>หน่วยงานในระบบ</th></tr>
    ${Object.entries(by).map(([k, o]) => `<tr><td>${esc(k)}</td><td class="num">${o.n}</td><td>${o.unit ? '<b>' + esc(o.unit) + '</b>' : '<span class="muted">ยังไม่ผูก</span>'}</td></tr>`).join('')}</table></div>
    <button type="button" class="btn" id="up_go" style="margin-top:10px"${rows.length ? '' : ' disabled'}>ยืนยันอัปโหลด</button>`;
  $('up_go').onclick = async () => {
    $('up_go').disabled = true;
    try {
      const r = await api('uploadStaff', S.token, rows);
      S.upRows = null; await loadStaff(); render();
      toast(`อัปโหลด ${r.added} รายชื่อ \u00b7 จัดเข้าหน่วยงานแล้ว ${r.bound} \u00b7 รอผูกแผนก ${r.unbound}`);
    } catch (e) { handleErr(e); $('up_go').disabled = false; }
  };
}

/* ผูกชื่อแผนกในไฟล์กับหน่วยงานในระบบ: เลือกแล้วกดบันทึก รายชื่อทั้งแผนกย้ายเข้าหน่วยงานนั้น และจำไว้ใช้ครั้งต่อไป */
function deptGroups() {
  const g = {};
  S.staff.filter(s => s.source === 'upload').forEach(s => {
    const k = s.fileDept || s.unit || NO_DEPT, o = g[k] || (g[k] = { n: 0, units: {} });
    o.n++; o.units[s.unit || ''] = (o.units[s.unit || ''] || 0) + 1;
  });
  return Object.entries(g).map(([k, o]) => {
    const cur = Object.entries(o.units).sort((a, b) => b[1] - a[1])[0][0];
    return { dept: k, n: o.n, cur };
  }).sort((a, b) => (a.cur ? 1 : 0) - (b.cur ? 1 : 0) || a.dept.localeCompare(b.dept, 'th'));
}
/* ===== จับคู่ตำแหน่งงานในไฟล์กับบทบาท โดยแอดมิน ===== */
function setTitles(list) { S.titleMap = {}; (list || []).forEach(x => { S.titleMap[normTitle(x.title)] = x.role; }); }
function titleGroups() {
  const g = {};
  S.staff.filter(s => s.source === 'upload' && s.title).forEach(s => {
    const o = g[s.title] || (g[s.title] = { title: s.title, n: 0, roles: {} });
    o.n++; o.roles[s.role] = (o.roles[s.role] || 0) + 1;
  });
  return Object.values(g).map(o => Object.assign(o, { cur: Object.entries(o.roles).sort((a, b) => b[1] - a[1])[0][0] }))
    .filter(o => builtinRole(o.title) === '' || normTitle(o.title) in S.titleMap)
    .sort((a, b) => (a.cur === '' ? 0 : 1) - (b.cur === '' ? 0 : 1) || b.n - a.n);
}
function renderTitleCard() {
  const gs = titleGroups(), noTitle = S.staff.filter(s => s.source === 'upload' && !s.title).length;
  if (!gs.length && !noTitle) return '';
  S.titleSel = S.titleSel || {};
  return `<div class="card"><h3>จับคู่ตำแหน่งงานกับบทบาท <span class="sub">ตำแหน่งที่ระบบไม่รู้จัก ${gs.filter(o => !(normTitle(o.title) in S.titleMap)).length} ตำแหน่ง</span></h3>
    <p class="muted" style="margin:0 0 8px;font-size:14px">เลือกบทบาท (หัวหน้า / RN / PN / NA / นศ.) ให้แต่ละตำแหน่งในไฟล์ แล้วกด "บันทึกการจับคู่" รายชื่อที่มีตำแหน่งนี้จะเปลี่ยนทันที และการอัปโหลดครั้งต่อไปใช้ตามที่เลือก (หัวหน้า/ผู้ช่วยหัวหน้าแผนกถูกจัดเป็น RN ให้อัตโนมัติอยู่แล้ว)</p>
    ${noTitle ? `<div class="note">มี ${noTitle} คนที่อัปโหลดไว้ก่อนระบบเก็บตำแหน่ง \u2014 อัปโหลดไฟล์รายชื่อซ้ำอีก 1 ครั้งเพื่อให้จับคู่ตำแหน่งได้ครบ</div>` : ''}
    <div class="binding">${gs.map(o => {
      const bound = normTitle(o.title) in S.titleMap, sel = o.title in S.titleSel ? S.titleSel[o.title] : o.cur;
      return `<span><b>${esc(o.title)}</b> <small class="muted">(${o.n} คน) \u00b7 ${bound ? 'จับคู่แล้ว' : 'ยังไม่ได้กำหนด'}</small></span><select data-title="${esc(o.title)}">${roleOpts(sel)}</select>`;
    }).join('')}</div>
    ${gs.length ? '<button type="button" class="btn" data-act="titlesave">บันทึกการจับคู่</button>' : ''}</div>`;
}
async function saveTitlesNow() {
  const items = titleGroups().filter(o => o.title in (S.titleSel || {})).map(o => ({ title: o.title, role: S.titleSel[o.title] }));
  if (!items.length) return toast('ไม่มีการเปลี่ยนแปลง');
  try {
    setTitles(await api('saveTitleBindings', S.token, items));
    S.titleSel = {}; await loadStaff(); render();
    toast(`บันทึกการจับคู่ ${items.length} ตำแหน่งแล้ว`);
  } catch (e) { handleErr(e); }
}
function renderBindingCard() {
  const gs = deptGroups(), none = S.staff.filter(s => !s.unit).length;
  if (!gs.length) return '';
  S.bindSel = S.bindSel || {};
  return `<div class="card"><h3>ผูกชื่อแผนกในไฟล์กับหน่วยงานในระบบ <span class="sub">รอผูก ${none} คน</span></h3>
    <p class="muted" style="margin:0 0 8px;font-size:14px">เลือกหน่วยงานที่ตรงกับแต่ละแผนกในไฟล์ แล้วกด "บันทึกการผูก" รายชื่อทั้งแผนกจะเข้าหน่วยงานนั้น และอัปโหลดครั้งต่อไประบบจัดเข้าให้เอง (แผนกที่ระบบแนะนำให้ ยังไม่บันทึกจนกว่าจะกดบันทึก)</p>
    <div class="binding">${gs.map(o => {
      const sel = o.dept in S.bindSel ? S.bindSel[o.dept] : (o.cur || suggestUnit(o.dept));
      const tag = o.cur ? 'ผูกแล้ว' : (sel ? 'ระบบแนะนำ ยังไม่บันทึก' : 'ยังไม่ผูก');
      return `<span><b>${esc(o.dept)}</b> <small class="muted">(${o.n} คน) \u00b7 ${tag}</small></span><select data-dept="${esc(o.dept)}"${o.dept === NO_DEPT ? ' disabled' : ''}><option value="">\u2014 ยังไม่ผูก \u2014</option>${unitOptgroups(sel)}</select>`;
    }).join('')}</div>
    <button type="button" class="btn" data-act="bindsave">บันทึกการผูก</button></div>`;
}
async function saveBindingsNow() {
  const items = [];
  deptGroups().forEach(o => {
    if (o.dept === NO_DEPT) return;
    const sel = o.dept in S.bindSel ? S.bindSel[o.dept] : (o.cur || suggestUnit(o.dept));
    if (sel !== o.cur) items.push({ alias: o.dept, unit: sel });
  });
  if (!items.length) return toast('ไม่มีการเปลี่ยนแปลง');
  try {
    S.aliases = await api('saveBindings', S.token, items);
    S.bindSel = {}; await loadStaff(); render();
    toast(`บันทึกการผูก ${items.length} แผนกแล้ว`);
  } catch (e) { handleErr(e); }
}

/* ===== ผูกเหตุการณ์ของหน้าที่แสดงอยู่ ===== */
function bindView() {
  const v = $('view');
  v.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === 'edit') startEdit(b.dataset.eunit);
    else if (a === 'back') go('all');
    else if (a === 'home') go(S.home);
    else if (a === 'gotoprint') { if (b.dataset.punit) { S.printScope = b.dataset.punit; S.printKind = 'day'; } go('print'); }
    else if (a === 'print') { if (S.pendingAtt > 0) toast('กำลังโหลดไฟล์แนบ รอสักครู่แล้วกดพิมพ์อีกครั้ง'); else window.print(); }
    else if (a === 'tpl') downloadTemplate();
    else if (a === 'bindsave') saveBindingsNow();
    else if (a === 'titlesave') saveTitlesNow();
    else if (a === 'rooms') roomEditor($('adm_room_editor'), b.dataset.runit, () => render());
  });
  v.querySelectorAll('[data-vshift]').forEach(b => b.onclick = () => { S.vshift = b.dataset.vshift; S.day = { reports: deriveReports(S.vshift) }; render(); });
  v.querySelectorAll('[data-mshift]').forEach(b => b.onclick = () => { S.shift = b.dataset.mshift; render(); });
  v.querySelectorAll('[data-sub]').forEach(b => { if (!S.editing) b.onclick = () => { S.sub = b.dataset.sub; render(); }; });
  if ($('p_scope')) $('p_scope').onchange = () => { S.printScope = $('p_scope').value; render(); };
  if ($('p_kind')) $('p_kind').onchange = () => { S.printKind = $('p_kind').value; render(); };
  if ($('p_month')) $('p_month').onchange = () => { if ($('p_month').value) { S.printMonth = $('p_month').value; render(); } };
  v.querySelectorAll('[data-unit].ucard').forEach(b => b.onclick = () => (b.dataset.unit === S.me.unit ? go('mine') : go('all', b.dataset.unit)));
  v.querySelectorAll('[data-sact]').forEach(b => b.onclick = () => staffAction(b.dataset.sact, b.dataset.id, b.dataset.unit));
  v.querySelectorAll('[data-staffrole]').forEach(sel => sel.onchange = async () => {
    const st = S.staff.find(x => x.id === +sel.dataset.staffrole); if (!st) return;
    try { await api('saveStaff', S.token, { id: st.id, unit: st.unit, name: st.name, role: sel.value }); await loadStaff(); toast('เปลี่ยนตำแหน่ง ' + st.name + ' เป็น ' + sel.value + ' แล้ว'); } catch (e) { handleErr(e); }
    render();
  });
  if ($('st_unit')) $('st_unit').onchange = () => { S.staffUnit = $('st_unit').value; render(); };
  if ($('up_file')) $('up_file').onchange = async () => {
    const f = $('up_file').files[0]; if (!f) return;
    $('up_preview').innerHTML = '<p class="muted">กำลังอ่านไฟล์...</p>';
    try {
      const { rows, bad } = await Busy.wrap('กำลังอ่านไฟล์...', () => readRoster(f), true);
      S.upRows = rows; S.upBad = bad;
      drawUpPreview();
    } catch (e) { $('up_preview').innerHTML = `<p style="color:var(--bad)">${esc(e.message)}</p>`; }
  };
  v.querySelectorAll('[data-dept]').forEach(sel => sel.onchange = () => { S.bindSel[sel.dataset.dept] = sel.value; });
  v.querySelectorAll('[data-incgroup]').forEach(b => b.onclick = () => { S.incGroup = b.dataset.incgroup; render(); });
  v.querySelectorAll('[data-sumgroup]').forEach(b => b.onclick = () => { S.sumGroup = b.dataset.sumgroup; render(); });
  v.querySelectorAll('[data-title]').forEach(sel => sel.onchange = () => { S.titleSel = S.titleSel || {}; S.titleSel[sel.dataset.title] = sel.value; });
  if (S.upRows && $('up_preview') && S.tab === 'staff' && S.upRows.length) drawUpPreview();
  if ($('doc_file')) bindDocCard();

}
window.__scriptLoaded = true;

(function () {
  const pk = on => { const el = document.getElementById('settings'); if (el) el.classList.toggle('peek', on); };
  document.addEventListener('pointerdown', e => { if (e.target && e.target.type === 'range' && e.target.closest('#settings')) pk(true); });
  ['pointerup', 'pointercancel', 'touchend', 'touchcancel'].forEach(t => document.addEventListener(t, () => pk(false)));
})();
</script>
</body>
