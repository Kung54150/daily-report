  #settings .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #settings .ph { border: 2px solid var(--line); border-radius: 10px; background: var(--sunk); padding: 0; overflow: hidden; cursor: pointer; color: var(--fg); }
  #settings .ph.on { border-color: var(--accent-strong); }
  #settings .phimg { display: block; aspect-ratio: 1; background-size: cover; background-position: center top; background-color: var(--line); }
  #settings .ph small { display: block; padding: 3px 2px; font-size: 12px; font-weight: 600; }
  .themebtn { position: fixed; top: 12px; right: 12px; z-index: 6; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  #settings { position: fixed; z-index: 20; top: 58px; right: 12px; width: min(350px, calc(100vw - 24px)); max-height: calc(100vh - 76px); overflow: auto; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.28); padding: 14px; display: grid; gap: 10px; }
  #settings h3 { margin: 0; font-size: 15px; }
  #settings .optrow { display: flex; gap: 6px; }
  #settings .opt { flex: 1; padding: 8px 4px; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; cursor: pointer; text-align: center; font-size: 14px; }
  #settings .opt.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  #settings .swatches { display: flex; gap: 12px; flex-wrap: wrap; }
  #settings .sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
  #settings .sw.on { box-shadow: 0 0 0 2px var(--fg); }
  #settings hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 2px 0; }
  #settings .pw { display: grid; gap: 8px; }
  #settings .pw input { width: 100%; }
  #settings .msg { font-size: 13px; min-height: 18px; }
  #settings .msg.bad { color: var(--bad); } #settings .msg.ok { color: var(--ok); }
  #settings { transition: opacity .15s; }

  @media (max-width: 600px) { #settings { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 48vh; border-radius: 14px 14px 0 0; } }
  @media print { .themebtn, #settings { display: none !important; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--bg); }
  #bgimg { position: fixed; inset: 0; z-index: -1; display: none; overflow: hidden; }
  #bgpic { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background-repeat: no-repeat; background-size: cover; background-position: center top; transform-origin: 50% 50%; }
  #bgfillr { position: absolute; inset: 0; -webkit-mask-image: linear-gradient(to right, transparent, #000); mask-image: linear-gradient(to right, transparent, #000); }
  #bgpic { -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent); -webkit-mask-composite: source-in; mask-composite: intersect; }
  #bgimg::after { content: ""; position: absolute; inset: 0; background: var(--bg); opacity: var(--bgdim, .8); }
  html.has-bg #bgimg { display: block; }
  html.has-bg body { background: transparent; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font); -webkit-text-size-adjust: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .num { font-variant-numeric: tabular-nums; }

  /* ===== Login ===== */
  #login { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
  .login-card h1 { margin: 0; font-size: 22px; text-wrap: balance; }
  .login-card p { margin: 0; color: var(--muted); font-size: 14px; }
  .hint { font-size: 13px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }

  /* ===== Top bar ===== */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--accent-ink); }
  .top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
  .top .title { font-weight: 600; flex: 1; min-width: 0; line-height: 1.25; }
  .top .title small { display: block; font-weight: 400; opacity: .85; font-size: 12px; }
  .unit-pill { background: var(--accent-ink); color: var(--accent); font-weight: 700; padding: 3px 10px; border-radius: 99px; font-size: 14px; white-space: nowrap; }
  .top button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; opacity: .9; }
  .tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 4; }
  .tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; padding: 11px 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tabs button.on { color: var(--accent-strong); border-color: var(--accent); font-weight: 600; }
  .datebar { display: flex; align-items: center; gap: 8px; padding-block: 12px; }
  .dpick { position: relative; flex: 0 1 190px; min-width: 150px; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-weight: 600; }
  .dpick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; padding: 0; border: 0; }
  .dpick .cal { color: var(--muted); }
  .datebar .dlabel { color: var(--muted); font-size: 14px; flex: 1; min-width: 0; }
  .iconbtn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: 0 0 auto; }

  /* ===== Common ===== */
  main { padding-bottom: 96px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; }
  .card > h3 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card > h3 .sub { font-weight: 400; color: var(--muted); font-size: 13px; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent-strong); }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.sm { padding: 6px 12px; font-size: 14px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .muted { color: var(--muted); }
  .pill { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 99px; font-weight: 500; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.no { background: var(--bad-soft); color: var(--bad); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.plain { background: var(--sunk); color: var(--muted); }
  .note { font-size: 13px; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
  #busy { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center; }
  #busy[hidden] { display: none; }
  #boot .spin { margin-top: 20vh; }
  #busy .busybox { background: var(--surface); color: var(--fg); border-radius: 14px; padding: 20px 26px; display: grid; gap: 12px; justify-items: center; box-shadow: 0 10px 40px rgba(0,0,0,.35); font-size: 15px; }
  .spin { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent-strong); animation: busyspin .8s linear infinite; }
  @keyframes busyspin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 99px; z-index: 20; font-size: 14px; max-width: calc(100% - 32px); }

  /* ===== Form ===== */
  .frow { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .frow:last-child { border-bottom: 0; }
  .frow.text { grid-template-columns: 1fr; }
  .frow .lab small { color: var(--muted); }
  .frow input[type=number] { text-align: center; }
  #dlg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #dlg .dlgbox { background: var(--surface); color: var(--fg); border-radius: 14px; padding: 18px; max-width: 420px; width: 100%; max-height: 85vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  #dlg .dlgbox h3 { margin: 0 0 8px; color: var(--bad); }
  .sug { display: grid; gap: 2px; margin: 4px 0; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  .sug[hidden] { display: none; }
  .sug .sugi { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--fg); font-size: 15px; }
  .sug .sugi:hover { background: var(--accent-soft); }
  .remwarn { color: var(--bad); font-size: 13px; font-weight: 600; margin: 2px 0 6px; } .remwarn.ok { color: var(--ok); } .remwarn:empty { display: none; }
  .frow .calc { text-align: center; font-weight: 700; padding: 9px 0; background: var(--accent-soft); border-radius: 8px; }
  .sumline { display: flex; justify-content: space-between; padding-top: 8px; margin-top: 4px; border-top: 2px solid var(--line); font-weight: 600; }
  .grid-scroll { overflow-x: auto; }
  table.g { border-collapse: collapse; width: 100%; min-width: 360px; }
  table.g th, table.g td { border: 1px solid var(--line); padding: 4px; text-align: center; font-size: 14px; }
  table.g th { background: var(--sunk); font-weight: 600; }
  table.g td:first-child, table.g th:first-child { text-align: left; }
  table.g input { padding: 6px 2px; text-align: center; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .savebar .wrap { display: flex; gap: 10px; align-items: center; padding-block: 10px; }
  .savebar .msg { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }

  /* staff picker */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--sunk); border-radius: 99px; padding: 5px 11px; cursor: pointer; font-size: 14px; }
  .chip b { font-size: 11px; color: var(--muted); margin-left: 4px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.on b { color: inherit; opacity: .8; }
  .duty .rl { color: var(--accent-strong); font-weight: 600; white-space: nowrap; }
  .duty { display: grid; grid-template-columns: 1fr 108px 32px; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--line); }

  .duty select { padding: 6px; font-size: 14px; }

  .dtime .tin { width: 76px; padding: 6px; font-size: 14px; }
  .drow { display: grid; grid-template-columns: 1fr 128px 32px; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .drow input, .drow select { padding: 6px; font-size: 14px; min-width: 0; }
  .drow.off input:first-child { text-decoration: line-through; color: var(--muted); }

  .drow .tm { grid-column: 1 / 3; }

<div id="boot" class="wrap" style="padding-block:56px;text-align:center">

<script>
function bootFail(m) {
  var b = document.getElementById('boot'), t = document.getElementById('boot_msg'), r = document.getElementById('boot_retry');
  if (!b || window.__ready) return;
  b.hidden = false; r.hidden = false;
  t.style.color = 'var(--bad)'; t.dataset.err = '1'; t.textContent = 'เปิดระบบไม่สำเร็จ: ' + m;
}
function diag(msg) {
  try {
    if (!/SyntaxError/.test(msg)) return '';
    var target = String(msg).replace(/^Uncaught\s+/, '').replace(/^SyntaxError:\s*/, '');
    var ss = document.getElementsByTagName('script');
    for (var i = 0; i < ss.length; i++) {
      var t = ss[i].text || '';
      if (t.length < 5000) continue;
      var L = t.split('\n');
      var bad = function (k) { try { new Function(L.slice(0, k).join('\n')); return false; } catch (x) { return x.message === target; } };
      if (!bad(L.length)) continue;
      var lo = 0, hi = L.length;
      while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (bad(mid)) hi = mid; else lo = mid; }
      var line = L[hi - 1], codes = [];
      for (var j = 0; j < line.length; j++) { var c = line.charCodeAt(j); if (c > 127 && (c < 0xE00 || c > 0xE7F)) codes.push('U+' + c.toString(16).toUpperCase()); }
      return ' | สคริปต์หลัก บรรทัดที่ ' + hi + ': ' + line.replace(/^\s+/, '').slice(0, 120) + (codes.length ? ' | อักขระพิเศษ: ' + codes.slice(0, 6).join(' ') : '');
    }
  } catch (x) {}
  return '';
}
window.addEventListener('error', function (e) { var m = e.message || 'เกิดข้อผิดพลาดในหน้าเว็บ'; bootFail(m + diag(m)); });
window.addEventListener('unhandledrejection', function (e) { bootFail((e.reason && e.reason.message) || e.reason || 'เกิดข้อผิดพลาด'); });
// Apps Script เปิดครั้งแรกหลังไม่ได้ใช้งานจะตอบช้า (cold start) 10-30 วินาทีเป็นเรื่องปกติ จึงแจ้งแบบไม่ใช่ข้อผิดพลาดก่อน แล้วค่อยแจ้งล้มเหลวเมื่อรอนานผิดปกติจริง
setTimeout(function () {
  if (window.__ready) return;
  var e0 = document.getElementById('boot_msg');
  if (e0 && e0.dataset.err) return; // มีข้อผิดพลาดจริงแสดงอยู่แล้ว ไม่ทับด้วยข้อความเดา
  if (!window.__scriptLoaded) return bootFail('ไฟล์ Index วางโค้ดไม่ครบ (ต้องมีครบถึงบรรทัดสุดท้าย)');
  var t = document.getElementById('boot_msg');
  if (t && !t.dataset.err) t.textContent = 'กำลังเชื่อมต่อเซิร์ฟเวอร์ (เปิดครั้งแรกอาจใช้เวลาสักครู่) กรุณารอ...';
}, 6000);
setTimeout(function () {
  if (!window.__ready && window.__scriptLoaded) bootFail('เซิร์ฟเวอร์ไม่ตอบสนอง ลองรีเฟรชหน้านี้');
}, 60000);
</script>

/* ===== เวร Day / Night: รายงานแยกตามเวร  S.dayRaw = { หน่วยงาน: { Day, Night } } ===== */
const guessShift = () => { const h = new Date().getHours(); return h >= 7 && h < 19 ? 'Day' : 'Night'; };
S.shift = guessShift();
S.vshift = guessShift();
S.dayRaw = {};
const shiftName = s => s || '-';
const repOf = (code, shift) => (S.dayRaw[code] || {})[shift];
const unitHas = (u, k) => (u.shifts || ['Day', 'Night']).includes(k);
const shiftsOf = u => u.shifts || ['Day', 'Night'];
const repAt = (u, k) => (S.dayRaw[u.code] || {})[k];
// full = ส่งครบทุกเวรของหน่วยงาน, part = ส่งบางเวร, none = ยังไม่ส่ง
const unitState = u => { const n = shiftsOf(u).filter(k => repAt(u, k)).length; return n === shiftsOf(u).length ? 'full' : n ? 'part' : 'none'; };
const missingShifts = u => shiftsOf(u).filter(k => !repAt(u, k));
const missingText = () => S.cfg.units.filter(u => unitState(u) !== 'full').map(u => esc(u.code) + (shiftsOf(u).length > 1 && unitState(u) === 'part' ? ' (' + missingShifts(u).join(', ') + ')' : '')).join(', ');
const shiftLab = (u, k) => esc(u.code) + (shiftsOf(u).length > 1 ? ' \u00b7 ' + esc(k) : '');
function deriveReports(vs) {
  const out = {};
  S.cfg.units.forEach(u => { const r = (S.dayRaw[u.code] || {})[vs]; if (r && unitHas(u, vs)) out[u.code] = r; });
  return out;
}

const unitCfg = code => S.cfg.units.find(u => u.code === code);
const groupName = key => S.cfg.groups.find(g => g.key === key).name;

    : [['mine', 'หน่วยงานของฉัน'], ['summary', 'สรุป'], ['all', 'ติดตามรายแผนก'], ['incidents', 'เหตุการณ์ผิดปกติ'], ['print', 'พิมพ์รายงาน'], ['staff', 'ทะเบียนเจ้าหน้าที่ / ห้อง']];

  $('tabs').querySelectorAll('button').forEach(btn => btn.onclick = () => go(btn.dataset.tab));

async function loadStaff() { try { S.staff = await api('listStaff', S.token); } catch (e) { handleErr(e); } }

function handleErr(e) {

function go(tab, unit) {
  if (S.editing && S.dirty && !leaveGuard()) return;
  S.editing = false; S.dirty = false;

// ไม่มี confirm() ในบางเบราว์เซอร์ฝังตัว -> กดซ้ำเพื่อยืนยัน

function incList(group) {

}
// แท็บเหตุการณ์ผิดปกติ (ผู้จัดการ/Admin): ดูจากมือถือได้โดยไม่ต้องพิมพ์ A4

  h += `<h2 class="grp">เหตุการณ์ผิดปกติ${zoneOnly ? ' \u00b7 ' + esc(S.cfg.groups.find(x => x.key === g).name) : ''} (${incs.length}) \u00b7 ${esc(thaiDate(S.date, true))}</h2>`;

}
function render() {
  setStickTop();

  $('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));

/* ===== หน่วยงานของฉัน ===== */

    <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="edit" type="button">แก้ไขรายงานเวร ${esc(S.shift)}</button>
      <button class="btn ghost" data-act="gotoprint" data-punit="${esc(u.code)}" type="button">พิมพ์รายงาน (ยอดผู้ป่วย + อัตรากำลัง + เหตุการณ์ผิดปกติ)</button></div>
    ${renderReportView(u, rep)}`;
}
const draftNote = () => '<div class="note">แบบฟอร์มของหน่วยงานนี้เป็นตัวอย่าง รอปรับตามรูปแบบรายงานจริง</div>';

/* ===== ทุกหน่วยงาน ===== */
// แผนกที่รายงานครบขึ้นก่อน ส่งไม่ครบถัดมา ยังไม่รายงานเลยอยู่ล่างสุด (เท่ากันเรียงตามรายชื่อที่กำหนด)
const byProgress = list => list.map((u, i) => [u, i]).sort((a, b) => ({ full: 0, part: 1 }[unitState(a[0])] ?? 2) - ({ full: 0, part: 1 }[unitState(b[0])] ?? 2) || a[1] - b[1]).map(x => x[0]);
function renderAll() {
  const us = S.cfg.units, st = us.map(unitState), n = x => st.filter(y => y === x).length;
  let html = `<div class="card"><h3>ส่งรายงานครบ <span class="num">${n('full')}/${us.length}</span> หน่วยงาน <span class="sub">\u00b7 ส่งไม่ครบ ${n('part')} \u00b7 ยังไม่ส่ง ${n('none')}</span></h3>
    <div class="progress"><i style="width:${n('full') / us.length * 100}%"></i></div>
    <div class="muted" style="font-size:13px">แตะที่หน่วยงานเพื่อดูรายละเอียด${S.me.role !== 'unit' ? '' : ' \u00b7 แก้ไขได้เฉพาะหน่วยงานของตนเอง'}</div></div>`;
  S.cfg.sections.forEach(sc => {
    html += `<h2 class="grp">${esc(sc.label)}</h2><div class="ulist">`;
    byProgress(sc.units.map(unitCfg)).forEach(u => {

      html += `<button type="button" class="ucard${u.code === S.me.unit ? ' mine' : ''}" data-unit="${esc(u.code)}">
        <span class="code">${esc(u.code)} ${statusPill(u)}</span>
        ${reps.map(k => `<span class="big num">${shiftsOf(u).length > 1 ? esc(k) + ' \u00b7 ' : ''}${esc(headline(u, repAt(u, k)))}</span>`).join('') || '<span class="big">&nbsp;</span>'}
        ${incN ? `<span class="pill warn">เหตุการณ์ผิดปกติ ${incN}</span>` : ''}</button>`;
    });
    html += '</div>';
  });
  return html;
}
function statusPill(u) {
  const st = unitState(u);
  if (st === 'full') return `<span class="pill ok">${shiftsOf(u).length > 1 ? 'ส่งครบ 2 เวร' : 'ส่งแล้ว'}</span>`;
  if (st === 'part') return `<span class="pill warn">ส่งไม่ครบ \u00b7 ขาดเวร ${esc(missingShifts(u).join(', '))}</span>`;
  return '<span class="pill no">ยังไม่ส่ง</span>';
}
// ตัวเลขหลักบนการ์ด: คงพยาบาล หรือช่องแรก
function headline(u, r) {
  if (u.form.sections.some(x => x.type === 'docs')) return 'ผู้รับบริการ ' + num((r.values || {})[u.form.sections.find(x => x.type === 'docs').totalKey]);
  const f = allFields(u).find(f => f.calc) || allFields(u).find(f => !f.type);
  if (!f) { const t = stdValues(u, r.values).total; return t === undefined ? '' : 'ยอดรวม ' + t; }
  return `${f.label} ${fieldValue(u, r.values, f)}`;
}
function renderUnitDetail(code) {
  const u = unitCfg(code);
  if (!unitHas(u, S.vshift) || (S.detailFor !== code && !repAt(u, S.vshift) && shiftsOf(u).some(k => repAt(u, k)))) S.vshift = shiftsOf(u).find(k => repAt(u, k)) || shiftsOf(u)[0];
  S.detailFor = code; S.day = { reports: deriveReports(S.vshift) };
  const r = S.day.reports[code];
  const adminEdit = S.me.role === 'admin' ? `<button class="btn" data-act="edit" data-eunit="${esc(code)}" type="button">${r ? 'แก้ไข' : 'กรอก'}รายงานเวร ${esc(S.vshift)} (Admin)</button>` : '';
  return vshiftSeg(u) + `<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
      <button class="btn ghost sm" data-act="back" type="button">\u2039 ติดตามรายแผนก</button>
      <b style="font-size:18px">${esc(code)}</b><span class="muted">${esc(unitLabel(u))}</span></div>
    ${r ? `<div class="meta">ส่งโดย ${esc(r.reporter)} \u00b7 แก้ไขล่าสุด ${esc(r.updatedAt)}</div><div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-act="gotoprint" data-punit="${esc(code)}" type="button">พิมพ์รายงานหน่วยงานนี้</button>${adminEdit}</div>${renderReportView(u, r)}`
        : `<div class="card muted fit">หน่วยงานนี้ยังไม่ส่งรายงานเวร ${esc(S.vshift)} ของวันนี้</div>${adminEdit ? `<div style="margin-top:10px">${adminEdit}</div>` : ''}`}`;
}

/* ===== ค่าที่คำนวณ ===== */
const allFields = u => u.form.sections.flatMap(s => s.type === 'grid' ? [] : s.fields);
const hasVal = (vals, k) => vals[k] !== undefined && vals[k] !== '' && vals[k] !== null;
function fieldValue(u, vals, f) {
  if (f.calc && !(f.calc.manual && hasVal(vals, f.key))) return f.calc.plus.reduce((a, k) => a + num(vals[k]), 0) - f.calc.minus.reduce((a, k) => a + num(vals[k]), 0);
  return vals[f.key];
}
const sectionSum = (s, vals) => s.fields.filter(f => !f.type && !f.calc && !f.noSum).reduce((a, f) => a + num(vals[f.key]), 0);
const roleOpts = cur => (S.cfg.roles.indexOf(cur) < 0 ? `<option value="" selected>\u2014 เลือก \u2014</option>` : '') + S.cfg.roles.map(r => `<option${r === cur ? ' selected' : ''}>${esc(r)}</option>`).join('');
const roleCounts = staff => S.cfg.roles.map(r => [r, staff.filter(s => s.role === r && s.tag !== 'ออกหน่วย').length]).concat([['ไม่ระบุ', staff.filter(s => S.cfg.roles.indexOf(s.role) < 0 && s.tag !== 'ออกหน่วย').length]]).filter(x => x[1]);
// ยอดมาตรฐาน / ประเภทผู้ป่วย (สำเนาเดียวกับ Schema.gs)
function fieldNum(form, vals, key) {
  for (const s of form.sections) for (const f of (s.fields || [])) if (f.key === key && f.calc && !(f.calc.manual && hasVal(vals, key))) return f.calc.plus.reduce((a, k) => a + num(vals[k]), 0) - f.calc.minus.reduce((a, k) => a + num(vals[k]), 0);
  return num(vals[key]);
}
function stdValues(u, vals) {
  const out = {};
  Object.entries(u.form.std || {}).forEach(([k, spec]) => { out[k] = (Array.isArray(spec) ? spec : [spec]).reduce((a, key) => a + fieldNum(u.form, vals || {}, key), 0); });
  return out;
}
function categoryValues(u, vals) {
  const out = {};
  u.form.sections.filter(s => s.categories).forEach(s => s.fields.forEach(f => {
    const n = num((vals || {})[f.key]), c = S.cfg.categories[f.key] || f.label;
    if (n) out[c] = (out[c] || 0) + n;
  }));
  return out;
}
// อายุ: เก็บเป็นข้อความ เช่น "60" (ข้อมูลเดิม = ปี) หรือ "2 ปี 5 เดือน" / "8 เดือน" / "15 วัน" (ทารกและเด็กเล็กระบุเดือน/วันได้)
const parseAge = a => { const t = String(a == null ? '' : a).trim(); if (/^\d+$/.test(t)) return { y: t, m: '', d: '' }; const g = re => { const m = re.exec(t); return m ? m[1] : ''; }; return { y: g(/(\d+)\s*ปี/), m: g(/(\d+)\s*เดือน/), d: g(/(\d+)\s*วัน/) }; };
const composeAge = (y, m, d) => [num(y) > 0 ? num(y) + ' ปี' : '', num(m) > 0 ? num(m) + ' เดือน' : '', num(d) > 0 ? num(d) + ' วัน' : ''].filter(Boolean).join(' ');
const ageText = a => { const t = String(a == null ? '' : a).trim(); return /^\d+$/.test(t) ? t + ' ปี' : t; };
const vitals = i => [['BP', i.bp, 'mmHg'], ['PR', i.pr, 'ครั้ง/min'], ['RR', i.rr, 'ครั้ง/min'], ['T', i.temp, '\u00b0C'], ['O2 sat', i.spo2, '%']].filter(x => x[1] !== '' && x[1] != null);
const o2Text = i => i.o2mode ? (i.o2mode === 'Room air' ? 'Room air' : `${i.o2mode}${i.o2flow ? ' ' + i.o2flow : ''}`) : '';

/* ===== รายการแบบเลือกจาก Drop down แล้วกดเพิ่ม (เช่น HPC) ===== */
const listRows = (s, v) => (v[s.key] || []).map(r => Object.assign({ it: s.items.find(i => i.k === r.k) }, r));
const listLabel = (it, r) => (it && it.custom ? (r.name || it.label) : (it ? it.label : r.k) + (r.name ? ' \u00b7 ' + r.name : ''));
const listUnit = s => s.unit || 'ราย';
const listTotal = (s, v) => (v[s.key] || []).reduce((a, r) => a + num(r.n), 0);
/* ===== ลูกบอลสีของผู้ป่วยคงพยาบาลแต่ละประเภท (เขียว เหลือง ส้ม แดง) ===== */
const ballSum = (v, key) => S.cfg.balls.reduce((a, b) => a + num(v[key + '_' + b[0]]), 0);
const ballDot = c => `<i class="ball ${c}"></i>`;
// "\u25cf เขียว 1, \u25cf ส้ม 3" (สีที่ไม่มีผู้ป่วยไม่แสดง) \u2014 มีคำบอกสีด้วยเผื่อพิมพ์ขาวดำ
// always = แสดงคำ เขียว/เหลือง/ส้ม/แดง ตลอด (หน้าภาพรวม) ไม่งั้นแสดงเฉพาะตอนพิมพ์/ในแผ่น A4 (บนจอสรุปไม่ต้องมีคำ)
const ballWord = (b, always) => always ? esc(b[1]) + ' ' : `<span class="bw">${esc(b[1])} </span>`;
const ballList = (t, always) => S.cfg.balls.filter(b => num(t[b[0]])).map(b => `${ballDot(b[0])}${ballWord(b, always)}${num(t[b[0]])}`).join(', ');
const ballStack = (t, always) => S.cfg.balls.some(b => num(t[b[0]])) ? `<div class="bst">${S.cfg.balls.filter(b => num(t[b[0]])).map(b => `<div>${ballDot(b[0])}${ballWord(b, always)}${num(t[b[0]])}</div>`).join('')}</div>` : '';
const ballText = (v, key) => ballList(Object.fromEntries(S.cfg.balls.map(b => [b[0], v[key + '_' + b[0]]])));
function ballTotals(u, v) {
  const out = { g: 0, y: 0, o: 0, r: 0 };
  u.form.sections.filter(s => s.categories).forEach(s => s.fields.forEach(f => S.cfg.balls.forEach(b => { out[b[0]] += num(v[f.key + '_' + b[0]]); })));
  return out;
}
// ช่องกรอกลูกบอลสี อยู่แถวเดียวกับช่องจำนวนบนจอกว้าง และลงมาอยู่ด้านล่างบนมือถือ (แสดงเป็นลูกบอล ไม่มีคำบรรยาย)
const ballGroups = (f, v) => S.cfg.balls.map(b => `<label class="bl"><span class="bd"><i class="ball ${b[0]}"></i><span>${esc(b[1])}</span></span><input type="number" inputmode="numeric" min="0" step="1" data-v="${esc(f.key)}_${b[0]}" value="${esc(v[f.key + '_' + b[0]] ?? '')}" placeholder="\u2013" aria-label="${esc(b[1])}"></label>`).join('');

// ประเภทผู้ป่วยคงพยาบาล: ตาราง ประเภท | จำนวนรวม | ลูกบอลสี (บนมือถือจัดเป็นบรรทัด: ประเภท จำนวน แล้วลูกบอลอยู่บรรทัดถัดไป)
function catCard(s, v) {
  const tot = s.fields.reduce((a, f) => a + num(v[f.key]), 0);
  const rows = s.fields.map(f => { const n = num(v[f.key]);
    return `<tr><td class="ct">${esc(f.label)}</td><td class="cn">${n || '\u2013'}</td><td class="cb">${n ? ballText(v, f.key) : ''}</td></tr>`; }).join('');
  return `<div class="card" style="grid-column:1/-1"><h3>${esc(s.title)}</h3><table class="cattab"><thead><tr><th>ประเภท</th><th>จำนวนรวม</th><th>ลูกบอลสี</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td class="ct">${esc(s.sum || 'รวม')}</td><td class="cn">${tot}</td><td class="cb"></td></tr></tfoot></table></div>`;
}
function docsCard(s, v) {
  const docs = v[s.key] || [];
  return `<div class="card"><h3>${esc(s.title)}</h3>${docs.map(d => `<div style="margin-bottom:8px"><b>${esc(d.name || '(ไม่ระบุชื่อ)')}</b> <span class="muted">${num(d.n)} ${esc(s.unit)}</span>
    <div class="kv">${(d.rows || []).map(r => `<div>${esc(listLabel(s.items.find(x => x.k === r.k), r))}</div><div class="v">${r.n}</div>`).join('') || '<div class="full muted">\u2013</div>'}</div></div>`).join('') || '<div class="muted">ยังไม่มีรายการ</div>'}
    <div class="kv"><div class="total">${esc(s.totalLabel)}</div><div class="total v">${num(v[s.totalKey])}</div></div></div>`;
}
function listCard(s, v) {
  const rows = listRows(s, v);
  return `<div class="card"><h3>${esc(s.title)}</h3><div class="kv">${rows.map(r => `<div>${esc(listLabel(r.it, r))}</div><div class="v">${r.n}</div>`).join('') || '<div class="full muted">ยังไม่มีรายการ</div>'}
    <div class="total">${esc(s.totalLabel)}</div><div class="total v">${listTotal(s, v)}</div></div></div>`;
}

/* ===== แท็บย่อยของหน่วยงาน ===== */
const SUBS = [['patient', 'รายงานผู้ป่วย'], ['staff', 'อัตรากำลัง'], ['doctor', 'แพทย์'], ['incident', 'เหตุการณ์ผิดปกติ']];
const sameZone = code => { const a = unitCfg(code), b = unitCfg(S.me.unit); return !!(a && b && a.group === b.group); };
function subTabs(r) {
  const others = S.me.role === 'unit' && r && r.unit && !sameZone(r.unit); // เหตุการณ์ผิดปกติ/รายงานเคสเห็นเฉพาะ Zone ของตนเอง
  const staffN = r ? roleCounts(r.staff || []).map(([k, n]) => k + ' ' + n).join(' ') : '';
  const incN = r ? (r.incidents || []).length : 0;
  const docN = r ? (r.doctors || []).filter(x => !x.off).length : 0;
  const badge = { staff: staffN, doctor: docN ? String(docN) : '', incident: incN ? String(incN) : '' };
  const opd = !!(r && r.unit && isOpdUnit(r.unit));
  return `<div class="seg" role="tablist">${SUBS.filter(([k]) => !(others && k === 'incident') && !(k === 'doctor' && !opd)).map(([k, t]) => `<button type="button" role="tab" data-sub="${k}" class="${S.sub === k ? 'on' : ''}${k === 'incident' && incN ? ' alert' : ''}">${t}${badge[k] ? `<small>${esc(badge[k])}</small>` : ''}</button>`).join('')}</div>`;
}

// รายงานผู้ป่วยนอก: แยกตำแหน่งชัดเจน แพทย์ / พยาบาล (RN) / PN / NA / นศ. / ไม่ระบุ  (นับไม่รวมคนที่ออกหน่วย)
const OPD_STAFF_GROUPS = [['พยาบาล (RN)', ['RN', 'หัวหน้า']], ['PN', ['PN']], ['NA', ['NA']], ['นศ.', ['นศ.']]];
function opdGroups(r, nameFn) {
  const staff = r.staff || [], docs = r.doctors || [], out = [];
  if (docs.length) out.push({ label: 'แพทย์', n: docs.filter(x => !x.off).length, unit: 'ท่าน', items: docs.map(x => ({ text: esc(x.name) + (x.time ? ' ' + esc(x.time) : '') + (x.off ? ' (งด)' : ''), off: !!x.off })) });
  const known = OPD_STAFF_GROUPS.flatMap(g => g[1]);
  OPD_STAFF_GROUPS.concat([['ไม่ระบุ', null]]).forEach(([label, roles]) => {
    const l = staff.filter(x => roles ? roles.indexOf(x.role) >= 0 : known.indexOf(x.role) < 0);
    if (!l.length) return;
    out.push({ label, n: l.filter(x => x.tag !== 'ออกหน่วย').length, unit: 'คน', items: l.map(x => ({ text: esc(nameFn ? nameFn(x.name) : x.name) + (x.role === 'หัวหน้า' ? ' (' + esc(dutyPos(x, r.unit)) + ')' : '') + (timeText(x) ? ' ' + esc(timeText(x)) : '') + (x.tag ? ' [' + esc(x.tag) + (x.tagNote ? ' ' + esc(x.tagNote) : '') + ']' : '') })) });
  });
  return out;
}
const opdGroupsHtml = r => { const g = opdGroups(r); return g.length ? g.map(x => `<div style="margin-top:8px"><b>${esc(x.label)}</b> <span class="pill plain">${x.n} ${x.unit}</span></div>${x.items.map(i => `<div style="font-size:14px;padding-left:10px${i.off ? ';text-decoration:line-through;color:var(--muted)' : ''}">${i.text}</div>`).join('')}`).join('') : '<span class="muted">ไม่ได้ระบุ</span>'; };
const docLine = x => `${esc(x.name)}${x.time ? ' ' + esc(x.time) : ''}${x.off ? ' (งด)' : ''}`;
const doctorsViewHtml = r => `<div class="card"><h3>แพทย์ออกตรวจ <span class="sub">${(r.doctors || []).filter(x => !x.off).length} ท่าน</span></h3>
  ${(r.doctors || []).map(x => `<div style="font-size:14px${x.off ? ';text-decoration:line-through;color:var(--muted)' : ''}"><b>${esc(x.name)}</b> ${esc(x.time || '')}${x.off ? ' (งด / ไม่มา)' : ''}</div>`).join('') || '<span class="muted">ไม่ได้ระบุ</span>'}</div>`;

/* ===== มุมมองอ่านอย่างเดียว ===== */
function renderReportView(u, r) {
  if (S.me.role === 'unit' && r.unit && !sameZone(r.unit) && S.sub === 'incident') S.sub = 'patient';
  if (S.sub === 'doctor' && !isOpdUnit(r.unit || u.code)) S.sub = 'staff';
  const v = r.values || {};
  let body = '';
  if (S.sub === 'patient') {
    const cards = u.form.sections.map(s => {
      if (s.type === 'list') return listCard(s, v);
      if (s.type === 'docs') return docsCard(s, v);
      if (s.categories) return catCard(s, v);
      if (s.type === 'grid') {
        return `<div class="card"><h3>${esc(s.title)}</h3><div class="grid-scroll"><table class="g"><tr><th></th>${s.cols.map(c => `<th>${esc(c[1])}</th>`).join('')}<th>รวม</th></tr>
          ${s.rows.map(rw => { const vals = s.cols.map(c => v[rw[0] + '_' + c[0]]); return `<tr><td>${esc(rw[1])}</td>${vals.map(x => `<td class="num">${show(x)}</td>`).join('')}<td class="num"><b>${vals.reduce((a, x) => a + num(x), 0)}</b></td></tr>`; }).join('')}</table></div></div>`;
      }
      const rows = s.fields.map(f => {
        const val = fieldValue(u, v, f);
        if (f.type === 'text') return `<div class="full"><span class="muted">${esc(f.label)}</span><br><span class="pre">${show(val)}</span></div>`;
        let shown = show(val);
        if (f.type === 'time' && val) shown = esc(val) + ' น.';
        if (f.pctOf && num(v[f.pctOf])) shown += ` <span class="muted" style="font-weight:400">/${num(v[f.pctOf])} = ${(num(val) / num(v[f.pctOf]) * 100).toFixed(2)}%</span>`;
        if (s.categories && ballText(v, f.key)) shown += `<div class="muted" style="font-size:13px;font-weight:400">${ballText(v, f.key)}</div>`;
        if (f.note && num(val) && v[f.key + '_note']) shown += ` <span class="muted" style="font-weight:400;font-size:13px">(${esc(v[f.key + '_note'])})</span>`;
        return `<div>${esc(f.label)}${f.noSum ? ' <small class="muted">(ไม่นับในยอดรวม)</small>' : ''}</div><div class="v">${shown}</div>`;
      }).join('');
      const sum = s.sum ? `<div class="total">${esc(s.sum)}</div><div class="total v">${sectionSum(s, v)}</div>` : '';
      return `<div class="card"><h3>${esc(s.title)}</h3><div class="kv">${rows}${sum}</div></div>`;
    });
    if (u.form.total) cards.push(`<div class="card"><div class="kv"><div><b>${esc(u.form.total)}</b></div><div class="v">${u.form.sections.filter(s => s.sum).reduce((a, s) => a + sectionSum(s, v), 0)}</div></div></div>`);
    { const rd0 = r.reduce || {}; if (u.group === 'OPD' && (num(rd0.RN) + num(rd0.PN) + num(rd0.NA) || rd0.detail)) cards.push(reduceViewHtml(rd0)); }
    if (r.notes) cards.push(`<div class="card"><h3>เรื่องแจ้ง</h3><div class="pre">${esc(r.notes)}</div></div>`);
    body = `<div class="view-grid">${cards.join('')}</div>`;
    if ((r.cases || []).length) body += `<h3 style="margin:14px 0 8px">รายงานเคส (${r.cases.length})</h3>` + r.cases.map((i, n) => caseCardHtml(i, n + 1)).join('');
  } else if (S.sub === 'staff') {
    const staff = r.staff || [], rd = r.reduce || {};
    if (u.group === 'OPD') body = `<div class="view-grid"><div class="card"><h3>อัตรากำลัง <span class="sub">เวร ${esc(shiftName(r.shift))}</span></h3>${opdGroupsHtml(Object.assign({ unit: u.code }, r))}</div></div>`;
    else
    body = `<div class="view-grid"><div class="card"><h3>อัตรากำลัง <span class="sub">เวร ${esc(shiftName(r.shift))}</span></h3>
      <div class="counts">${roleCounts(staff).map(([k, n]) => `<span>${esc(k)} ${n}</span>`).join('') || '<span class="muted">ไม่ได้ระบุ</span>'}</div>
      ${(u.staffSlot ? slotSort(staff) : staff).map(s => `<div style="font-size:14px"><b style="display:inline-block;min-width:40px">${esc(dutyPos(s, u.code))}</b>${u.staffSlot && s.slot ? `คนที่ ${esc(s.slot)} ` : ''}${esc(s.name)}${timeText(s) ? ` <span class="muted">${esc(timeText(s))}</span>` : ''}${s.tag ? ` <span class="pill plain">${esc(s.tag)}${s.tagNote ? ' ' + esc(s.tagNote) : ''}</span>` : ''}</div>`).join('')}</div>
      ${u.group === 'OPD' ? '' : reduceViewHtml(rd)}</div>`;
  } else if (S.sub === 'doctor') {
    body = `<div class="view-grid">${doctorsViewHtml(r)}</div>`;
  } else {
    const incs = r.incidents || [];
    body = incs.length ? incs.map((i, n) => `<div class="card inc-view">
        <div class="inc-head"><span>${n + 1}. ${esc(i.type)}</span><span class="pill ${i.severity && i.severity !== '-' ? 'warn' : 'plain'}">ระดับ ${esc(i.severity || '-')}</span></div>
        <div class="pt">${i.patient ? `<b>${esc(i.patient)}</b>` : '<span class="muted">ไม่ระบุชื่อผู้ป่วย</span>'}${i.age ? ` \u00b7 อายุ ${esc(ageText(i.age))}` : ''}${i.hn ? ` \u00b7 HN ${esc(i.hn)}` : ''}</div>
        <div class="muted" style="font-size:14px">${i.time ? `มารับบริการ ${esc(i.time)} น.` : ''}${i.time && i.doctor ? ' \u00b7 ' : ''}${i.doctor ? `แพทย์เจ้าของไข้ ${esc(i.doctor)}` : ''}</div>
        ${vitals(i).length || i.o2mode ? `<div class="vsline">${vitals(i).map(([k, x, unit]) => `<span><small>${k}</small> ${esc(x)} <small>${unit}</small></span>`).join('')}${i.o2mode ? `<span><small>O2</small> ${esc(o2Text(i))}</span>` : ''}</div>` : ''}
        <div class="pre" style="margin-top:6px">${esc(i.detail)}</div>
        ${i.action ? `<div class="muted pre" style="font-size:14px;margin-top:4px">การแก้ไขเบื้องต้น: ${esc(i.action)}</div>` : ''}
        ${(i.files || []).length ? `<div class="atts">${i.files.map(f => attChip(f, false)).join('')}</div>` : ''}</div>`).join('')
      : '<div class="card muted fit">ไม่มีเหตุการณ์ผิดปกติ</div>';
  }
  return subTabs(r) + body;
}

/* ===== แบบฟอร์ม ===== */
// หน่วยงานที่กำลังแก้ไขรายงาน: หน่วยงานของตนเอง หรือ (Admin) หน่วยงานที่เลือกแก้
const euUnit = () => (S.me.role === 'admin' ? S.editUnit : S.me.unit);
function startEdit(unit) {
  if (S.me.role === 'admin') {
    S.editUnit = unit; const eu = unitCfg(unit);
    S.shift = unitHas(eu, S.vshift) ? S.vshift : eu.shifts[0]; S.tab = 'edit';
  }
  const rep = repOf(euUnit(), S.shift);
  S.draft = rep ? JSON.parse(JSON.stringify(rep)) : { date: S.date, unit: euUnit(), values: {}, staff: [], reduce: {}, notes: '', incidents: [], cases: [], reporter: store.get('reporter') || '' };
  S.draft.date = S.date; S.draft.shift = S.shift; S.draft.cases = S.draft.cases || []; S.docSched = null;
  S.editing = true; S.dirty = false; S.docSt = {};
  render(); window.scrollTo(0, 0);
  prefillCarry();
}
// ยอดสะสมที่ยกมา (เช่น ยอด ปกส. ของทันตกรรม): ถ้ายังไม่มีค่าให้ดึงยอดรวมจากรายงานล่าสุดก่อนวันนี้ (ปีเดียวกัน) ถ้าไม่มีให้กรอกเอง
async function prefillCarry() {
  const eu = euUnit(), u = unitCfg(eu), d = S.draft;
  let f = null; u.form.sections.forEach(x => (x.fields || []).forEach(y => { if (y.carryFrom) f = y; }));
  const blank = () => d.values[f.key] === undefined || d.values[f.key] === '';
  if (!f || !blank()) return;
  try {
    const r = await api('getCarry', S.token, eu, S.date, f.carryFrom);
    if (!r || !S.editing || S.draft !== d || !blank()) return;
    d.values[f.key] = r.value;
    const el = document.querySelector(`[data-v="${f.key}"]`); if (el) el.value = r.value;
    recalc(true); toast('ยก' + f.label + ' มาจากวันที่ ' + fmtDMY(r.date) + ' (แก้ไขได้)');
  } catch (e) { /* ไม่มีข้อมูลก่อนหน้า: กรอกเอง */ }
}

function mountForm() {
  const u = unitCfg(euUnit()), d = S.draft, v = d.values;
  S.catKeys = new Set(u.form.sections.filter(s => s.categories).flatMap(s => s.fields.map(f => f.key)));
  const numInput = (key, extra) => `<input type="number" inputmode="numeric" min="0" step="1" data-v="${esc(key)}" value="${esc(v[key] ?? '')}" placeholder="\u2013" ${extra || ''}>`;
  let pat = (u.form.draft ? draftNote() : '') + `<div class="card"><div class="row2">
      <div><label class="f" for="fm_reporter">ผู้รายงาน</label><input id="fm_reporter" value="${esc(d.reporter)}" placeholder="ชื่อผู้ส่งรายงาน"></div>
      <div><label class="f">วันที่ / เวร</label><input value="${esc(thaiDate(S.date, true))} \u00b7 เวร ${esc(d.shift)}" disabled></div></div></div>`;
  u.form.sections.forEach((s, si) => {
    pat += `<div class="card"><h3>${esc(s.title)}</h3>`;
    if (s.type === 'list') pat += `<div data-list="${esc(s.key)}"></div>`;
    else if (s.type === 'docs') pat += `<div data-docs="${esc(s.key)}"></div>`;
    else if (s.type === 'grid') {
      pat += `<div class="grid-scroll"><table class="g"><tr><th></th>${s.cols.map(c => `<th>${esc(c[1])}</th>`).join('')}<th>รวม</th></tr>
        ${s.rows.map(rw => `<tr><td>${esc(rw[1])}</td>${s.cols.map(c => `<td>${numInput(rw[0] + '_' + c[0])}</td>`).join('')}<td class="num"><b data-rowsum="${si}:${esc(rw[0])}">0</b></td></tr>`).join('')}</table></div>`;
    } else {
      s.fields.forEach(f => {
        if (f.type === 'text' && f.rooms && roomsFor(euUnit()).length) pat += `<div class="frow text"><span class="lab">${esc(f.label)}</span><div data-rooms="${esc(f.key)}"></div></div>`;
        else if (f.type === 'text') pat += `<div class="frow text"><label class="lab" for="v_${esc(f.key)}">${esc(f.label)}</label><textarea id="v_${esc(f.key)}" data-v="${esc(f.key)}" rows="2">${esc(v[f.key] ?? '')}</textarea></div>`;
        else if (f.type === 'time') pat += `<div class="frow"><span class="lab">${esc(f.label)} <small>24 \u0e0a\u0e21. \u0e1e\u0e34\u0e21\u0e1e\u0e4c 2030</small></span><input class="tin" type="text" inputmode="numeric" maxlength="5" placeholder="20:30" autocomplete="off" data-v="${esc(f.key)}" value="${esc(v[f.key] ?? '')}"></div>`;
        else if (f.calc && !f.calc.manual) pat += `<div class="frow"><span class="lab"><b>${esc(f.label)}</b> <small>(คำนวณอัตโนมัติ)</small></span><div class="calc num" data-calc="${esc(f.key)}">0</div></div>${f.key === 'remain' && s.fields.length && u.form.sections.some(x => x.categories) ? '<div class="remwarn" data-remwarn></div>' : ''}`;
        else {
          if (s.categories) pat += `<div class="frow ext cat"><span class="lab">${esc(f.label)} <small>${esc(f.unit)}</small></span><div class="calc cnt gray" data-catcnt="${esc(f.key)}" title="รวมจากลูกบอลสีอัตโนมัติ ไม่ต้องกรอก">${num(v[f.key])}</div><div class="ballin extra">${ballGroups(f, v)}</div></div>`;
          else {
            const extra = f.note ? `<input class="notein extra off" data-notefor="${esc(f.key)}" data-v="${esc(f.key)}_note" value="${esc(v[f.key + '_note'] ?? '')}" placeholder="${esc(f.note)} (พิมพ์เอง)" aria-label="${esc(f.note)}">` : '';
            pat += `<div class="frow${extra ? ' ext noted' : ''}"><span class="lab">${esc(f.label)} <small>${esc(f.unit)}${f.noSum ? ' \u00b7 ไม่นับในยอดรวม' : ''}</small>${f.pctOf ? ` <small data-pct="${esc(f.key)}"></small>` : ''}</span>${numInput(f.key, 'class="cnt"')}${extra}</div>${f.calc && f.calc.manual ? '<div class="remwarn" data-remwarn></div>' : ''}`;
          }
        }
      });
      if (s.fields.some(f => f.rooms)) pat += `<div style="margin-top:8px"><button type="button" class="btn ghost sm" data-roomedit>\u270e แก้ไขรายการห้อง (เลขห้อง / ชื่อ)</button></div><div id="room_editor"></div>`;
      if (s.sum) pat += `<div class="sumline"><span>${esc(s.sum)}</span><span class="num" data-sum="${si}">0</span></div>`;
      if (s.categories && allFields(u).some(f => f.key === 'remain' && f.calc)) pat += '<div class="remwarn" data-remwarn></div>';
    }
    pat += '</div>';
  });
  if (u.form.total) pat += `<div class="card"><div class="sumline" style="border:0;margin:0;padding:0"><span>${esc(u.form.total)}</span><span class="num" id="fm_total">0</span></div></div>`;
  if (unitCfg(euUnit()).group === 'OPD') pat += reduceFormHtml(d.reduce || {});
  pat += `<div class="card"><h3>เรื่องแจ้ง</h3><textarea id="fm_notes" rows="3" placeholder="เช่น พรุ่งนี้แพทย์งดออกตรวจ / ไม่มีเอกสารค้างส่ง">${esc(d.notes || '')}</textarea></div>
    <div class="card"><h3>รายงานเคส</h3><div id="fm_cases"></div>${(S.cfg.lineCaseUnits || []).indexOf(euUnit()) >= 0 ? '<button type="button" class="addinc" id="fm_linecase" style="margin-bottom:8px">\u21e9 ดึงเคสจาก LINE</button>' : ''}<button type="button" class="addinc" id="fm_addcase">+ เพิ่มเคส</button></div>`;

  const rd = d.reduce || {};
  const isOpd = unitCfg(euUnit()).group === 'OPD';

// แนะนำชื่อรายการ: เรียงตามความคล้ายกับที่พิมพ์ (มีคำนั้นอยู่ / ตัวอักษรคู่ซ้ำกัน) จากชื่อที่เคยใช้ + รายการในเมนู
function procSuggest(items, rows, memKey, typed) {
  const q = String(typed || '').toLowerCase().replace(/\s+/g, '');
  if (q.length < 1) return [];
  const bg = t => { const a = []; for (let i = 0; i < t.length - 1; i++) a.push(t.slice(i, i + 2)); return a; };
  const qb = bg(q), seen = new Set();
  const score = label => {
    const t = label.toLowerCase().replace(/\s+/g, '');
    if (t === q) return 0;
    if (t.indexOf(q) === 0) return 5; if (t.indexOf(q) >= 0) return 4; if (q.indexOf(t) >= 0 && t.length >= 3) return 3;
    const tb = bg(t); if (!qb.length || !tb.length) return 0;
    const hit = qb.filter(x => tb.indexOf(x) >= 0).length, dice = 2 * hit / (qb.length + tb.length);
    return dice >= 0.4 ? 2 * dice : 0;
  };
  const mem = ((S.cfg.procs || {})[euUnit()] || {})[memKey] || [], drafted = (rows || []).filter(r => r.name).map(r => r.name);
  const cands = [];
  items.filter(i => !i.custom).forEach(i => cands.push({ label: i.label, builtin: true, k: i.k }));
  mem.concat(drafted).forEach(n => cands.push({ label: n }));
  return cands.map(c => Object.assign(c, { sc: score(c.label) })).filter(c => c.sc > 0)
    .sort((a, b) => b.sc - a.sc).filter(c => { const k = c.label.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 6);
}
// หลังบันทึก: จำชื่อที่พิมพ์เอง (หัตถการ / ชื่อแพทย์) ไว้ในหน้านี้ด้วย (ฝั่งเซิร์ฟเวอร์จำไว้ให้แล้ว)
function rememberProcs(unit, form, values) {
  S.cfg.procs = S.cfg.procs || {};
  const norm = t => String(t).toLowerCase().replace(/\s+/g, '');
  const add = (key, name) => { const u = S.cfg.procs[unit] = S.cfg.procs[unit] || {}, l = u[key] = u[key] || []; if (name && !l.some(n => norm(n) === norm(name))) l.unshift(name); };
  form.sections.filter(x => x.type === 'list').forEach(sec => (values[sec.key] || []).forEach(r => {
    const it = sec.items.find(i => i.k === r.k); if (it && it.custom && r.name) add(sec.key, r.name);
  }));
  form.sections.filter(x => x.type === 'docs').forEach(sec => (values[sec.key] || []).forEach(d => {
    if (d.name) add(sec.key + ':doc', d.name);
    (d.rows || []).forEach(r => { const it = sec.items.find(i => i.k === r.k); if (it && it.custom && r.name) add(sec.key, r.name); });
  }));
}
// รายการ "เลือกจากดรอปดาวน์ + ใส่จำนวน + เพิ่มรายการเอง (พิมพ์ชื่อ มีคำแนะนำ)" ใช้ร่วมกันทั้งรายการทั่วไป (HPC / EENT) และหัตถการรายแพทย์

      ${it && it.ask ? `<input data-lname value="${esc(st.name)}" maxlength="80" autocomplete="off" placeholder="${esc(it.ask)} (ต้องระบุก่อนจึงจะเพิ่มได้)" aria-label="${esc(it.ask)}">${it.custom ? '<div class="sug" data-sug hidden></div>' : ''}` : ''}

      <div class="sumline"><span>${esc(o.totalLabel)}</span><span class="num" data-ltotal>${total()}</span></div>`;

  const nm = box.querySelector('[data-lname]');
  if (nm) {
    nm.oninput = e => { st.name = e.target.value; upd(); drawSug(); };

    const sug = box.querySelector('[data-sug]');
    const drawSug = () => {

      sug.innerHTML = list.map((x, i) => `<button type="button" class="sugi" data-si="${i}">${esc(x.label)}${x.builtin ? ' <small>(รายการในเมนู)</small>' : ''}</button>`).join('');
      sug.querySelectorAll('[data-si]').forEach(b => b.onmousedown = ev => {
        ev.preventDefault();
        const x = list[+b.dataset.si];
        if (x.builtin) { st.k = x.k; st.name = ''; o.rerender(); } else { st.name = x.label; nm.value = x.label; upd(); sug.hidden = true; }

  }

  box.querySelector('[data-ladd]').onclick = () => {
    if (!canAdd()) return;

  box.querySelectorAll('[data-ldel]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.ldel, 1); o.onChange(); o.rerender(); });
}

const typingTime = v => { const d = String(v).replace(/\D/g, '').slice(0, 4); return d.length === 4 ? d.slice(0, 2) + ':' + d.slice(2) : d; };
function finishTime(v) {
  const d = String(v).replace(/\D/g, '');
  if (d.length === 4) return d.slice(0, 2) + ':' + d.slice(2);
  if (d.length === 3) return '0' + d[0] + ':' + d.slice(1);
  if (d.length >= 1 && d.length <= 2) return d.padStart(2, '0') + ':00';
  return '';
}
const validTime = v => v === '' || /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
// กดช่องเวลาครั้งเดียวแล้วคลุมข้อความทั้งช่อง พิมพ์เวลาใหม่ทับได้เลย (ไม่ต้องลบหรือดับเบิลคลิก)

  const t = e.target;

  t.dataset.sel = '1';
  const go = () => { try { t.select(); t.setSelectionRange(0, t.value.length); } catch (x) {} };
  const v0 = t.value;
  go(); setTimeout(() => { if (t.value === v0) go(); }, 0); // มือถือ/บางเบราว์เซอร์เลือกตำแหน่งเคอร์เซอร์หลังโฟกัส จึงเลือกซ้ำอีกครั้ง (ถ้ายังไม่ได้พิมพ์)
}

    const b = e.target.closest('button'); if (!b) return;

    else if (b.hasAttribute('data-radd')) { list.push({ no: '', name: '' }); draw(); const ins = box.querySelectorAll('[data-rn]'); ins[ins.length - 1].focus(); }
    else if (b.hasAttribute('data-rbulk')) {
      const p = box.querySelector('[data-bp]').value.trim(), a = parseInt(box.querySelector('[data-b1]').value, 10), z = parseInt(box.querySelector('[data-b2]').value, 10);
      if (!p || !(a >= 0) || !(z >= a) || z - a > 200) return toast('กรอกคำนำหน้าและช่วงเลขให้ถูกต้อง');
      const have = new Set(list.map(r => r.no));
      for (let i = a; i <= z; i++) { const no = p + String(i).padStart(2, '0'); if (!have.has(no)) list.push({ no, name: '' }); }
      draw();
    }
    else if (b.hasAttribute('data-rcancel')) { box.innerHTML = ''; }
    else if (b.hasAttribute('data-rsave')) {
      b.disabled = true; box.querySelector('[data-rmsg]').textContent = 'กำลังบันทึก...';
      try {
        S.cfg.rooms = await api('saveRooms', S.token, unit, list.filter(r => r.no.trim()));
        box.innerHTML = ''; toast('บันทึกรายการห้องแล้ว'); done();
      } catch (err) { box.querySelector('[data-rmsg]').textContent = err.message; b.disabled = false; }
    }
  };
}

/* ห้องพัก: กดเลือกจากรายการห้องของหน่วยงาน หรือพิมพ์ชื่อเอง (ห้องหนึ่งอยู่ได้ที่เดียว ว่างหรือรอทำความสะอาด) */
const parseRooms = v => String(v || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
const roomsRaw = unit => {
  const a = (S.cfg.rooms && S.cfg.rooms[unit]) || [], cnt = {};
  a.forEach(r => { if (r.name) cnt[r.name] = (cnt[r.name] || 0) + 1; });
  a.forEach(r => { r._dup = !!(r.name && cnt[r.name] > 1); });
  return a;
};
// ชื่อห้องซ้ำกันได้ ถ้าซ้ำจะต่อท้ายด้วยเลขห้องในวงเล็บ เช่น Superior คอก (B505)
const roomLabel = r => (r._dup ? r.name + ' (' + r.no + ')' : r.name || r.no);
const roomsFor = unit => roomsRaw(unit).map(roomLabel);
function setRooms(key, list) {
  const reg = roomsFor(euUnit()), uniq = list.filter((r, i) => list.indexOf(r) === i);
  uniq.sort((a, b) => { const ia = reg.indexOf(a), ib = reg.indexOf(b); return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib) || a.localeCompare(b); });
  S.draft.values[key] = uniq.join(', '); S.dirty = true;
}
const otherRoomKey = key => key === 'rooms_ready' ? 'rooms_clean' : 'rooms_ready';
function addRooms(key, names) {
  const other = otherRoomKey(key), add = parseRooms(names);
  if (!add.length) return;
  setRooms(key, parseRooms(S.draft.values[key]).concat(add));
  setRooms(other, parseRooms(S.draft.values[other]).filter(r => add.indexOf(r) < 0));
  renderRoomPickers();
}
function renderRoomPickers() {
  const raw = roomsRaw(euUnit()), reg = raw.map(roomLabel);
  document.querySelectorAll('[data-rooms]').forEach(box => {
    const key = box.dataset.rooms, sel = parseRooms(S.draft.values[key]), used = new Set(parseRooms(S.draft.values[otherRoomKey(key)]));
    const extra = sel.filter(r => reg.indexOf(r) < 0);
    box.innerHTML = `<div class="rooms">${raw.map(o => { const r = roomLabel(o); return `<button type="button" class="rm${sel.indexOf(r) >= 0 ? ' on' : ''}${used.has(r) ? ' used' : ''}" data-room="${esc(r)}" data-rkey="${esc(key)}">${esc(o.no)}${o.name && o.name !== o.no ? `<small>${esc(o.name)}</small>` : ''}</button>`; }).join('')}${extra.map(r => `<button type="button" class="rm on" data-room="${esc(r)}" data-rkey="${esc(key)}">${esc(r)} \u00d7</button>`).join('')}</div>
      <div class="muted" style="font-size:12px">เลือกแล้ว ${sel.length} ห้อง</div>
      <div class="addrow rm-add"><input data-roomtext="${esc(key)}" placeholder="พิมพ์ชื่อห้องเอง เช่น VIP1 (คั่นหลายห้องด้วย ,)"><button type="button" class="btn sm" data-roomadd="${esc(key)}">+ เพิ่ม</button></div>`;
  });
}
$('view').addEventListener('click', e => {
  if (!(S.editing && (S.tab === 'mine' || S.tab === 'edit'))) return;
  if (e.target.closest('[data-roomedit]')) { roomEditor($('room_editor'), euUnit(), () => { mountForm(); }); return; }
  const rb = e.target.closest('[data-room]');
  if (rb) {
    const key = rb.dataset.rkey, r = rb.dataset.room, sel = parseRooms(S.draft.values[key]);
    if (sel.indexOf(r) >= 0) { setRooms(key, sel.filter(x => x !== r)); renderRoomPickers(); } else addRooms(key, r);
    return;
  }
  const ad = e.target.closest('[data-attdel]');
  if (ad) { const [ii, kk] = ad.dataset.attdel.split(':').map(Number); S.draft.incidents[ii].files.splice(kk, 1); S.dirty = true; renderIncidents(); return; }
  const adc = e.target.closest('[data-attdelc]');
  if (adc) { const [ii, kk] = adc.dataset.attdelc.split(':').map(Number); S.draft.cases[ii].files.splice(kk, 1); S.dirty = true; renderCases(); return; }
  const ab = e.target.closest('[data-roomadd]');
  if (ab) { const inp = document.querySelector(`[data-roomtext="${ab.dataset.roomadd}"]`); addRooms(ab.dataset.roomadd, inp.value); }
});
$('view').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.roomtext) { e.preventDefault(); addRooms(e.target.dataset.roomtext, e.target.value); }
});
function onFormInput(e) {
  const t = e.target, d = S.draft;
  S.dirty = true;
  const agk = t.dataset && (t.dataset.ag || t.dataset.agc);
  if (agk) {
    // อายุ: ปี / เดือน / วัน รวมเป็นข้อความเก็บในช่อง age (เดือนไม่เกิน 11 วันไม่เกิน 31)
    const [i, part] = agk.split(':'), list = t.dataset.agc ? d.cases : d.incidents, card = t.closest('.card');
    if (part === 'm' && num(t.value) > 11) t.value = '11';
    if (part === 'd' && num(t.value) > 31) t.value = '31';
    const g = p => { const el = card.querySelector(`[${t.dataset.agc ? 'data-agc' : 'data-ag'}="${i}:${p}"]`); return el ? el.value : ''; };
    list[i].age = composeAge(g('y'), g('m'), g('d'));
    return;
  }
  if (t.classList && t.classList.contains('tin')) t.value = typingTime(t.value);
  if (t.dataset.v) {
    d.values[t.dataset.v] = t.type === 'number' ? (t.value === '' ? '' : Number(t.value)) : t.value;
    // กรอกลูกบอลสี \u2192 ระบบรวมจำนวนประเภทผู้ป่วยให้เอง
    const bm = /^(.*)_([gyor])$/.exec(t.dataset.v);
    if (bm && S.catKeys && S.catKeys.has(bm[1])) d.values[bm[1]] = ballSum(d.values, bm[1]);
    recalc();
  }
  else if (t.id === 'fm_reporter') d.reporter = t.value;
  else if (t.id.startsWith('rd_')) { d.reduce = d.reduce || {}; d.reduce[t.id.slice(3)] = t.id === 'rd_detail' ? t.value : (t.value === '' ? '' : Number(t.value)); }
  else if (t.id === 'fm_notes') d.notes = t.value;
  else if (t.dataset.inc) {
    const [i, k] = t.dataset.inc.split(':'); d.incidents[i][k] = t.value;
    if (k === 'o2mode') { const box = document.querySelector(`[data-o2flow="${i}"]`); box.hidden = t.value === 'Room air'; }
  }
  else if (t.dataset.cs) {
    const [i, k] = t.dataset.cs.split(':'); d.cases[i][k] = t.value;
    if (k === 'o2mode') { const box = document.querySelector(`[data-o2flowc="${i}"]`); box.hidden = t.value === 'Room air'; }
  }
  else if (t.dataset.duty) {
    const [i, k] = t.dataset.duty.split(':'); d.staff[i][k] = t.value;
    if (k === 'tag' || k === 'role') { renderStaffPicker(); showSub(); }
    if (k === 'from' || k === 'to') { const el = document.querySelector(`[data-hrs="${i}"]`); if (el) el.textContent = workHours(d.staff[i]) ? fmtHrs(workHours(d.staff[i])) : ''; }
  }
  else if (t.dataset.doc) {
    const [i, k] = t.dataset.doc.split(':'); d.doctors[i][k] = k === 'off' ? !!t.value : t.value;
    if (k === 'off') renderDoctors();
  }
}

// ยอดคงพยาบาล (ระบบคำนวณจาก ยกมา + รับใหม่ + รับย้าย - ย้ายไป - Refer - Dead - จำหน่าย) ต้องเท่ากับผลรวมลูกบอลสีทุกประเภท
function remCheck(u, v, quiet) {
  const rf = allFields(u).find(f => f.key === 'remain' && f.calc), cats = u.form.sections.filter(s => s.categories);
  if (!rf || !cats.length) return;
  const cat = cats.reduce((a, s) => a + sectionSum(s, v), 0), rem = fieldValue(u, v, rf);
  let msg = '', ok = false;
  if (cat !== rem && (cat > 0 || rem > 0)) msg = `ลูกบอลสีรวม ${cat} ราย ${cat < rem ? 'ขาด ' + (rem - cat) : 'เกิน ' + (cat - rem)} ราย จาก${rf.label} ${rem} ราย`;
  else if (cat === rem && cat > 0) { msg = `ลูกบอลสีรวมตรงกับ${rf.label} (${rem} ราย)`; ok = true; }
  document.querySelectorAll('[data-remwarn]').forEach(el => { el.textContent = msg; el.classList.toggle('ok', ok); });
  const over = cat > rem;
  if (over && !S.overWarned && !quiet) showDialog('ลูกบอลสีเกินยอดคงพยาบาล', `<p>ลูกบอลสีรวม <b>${cat}</b> ราย เกิน${esc(rf.label)} <b>${rem}</b> ราย อยู่ ${cat - rem} ราย</p><p class="muted" style="font-size:14px">${esc(rf.label)} คำนวณจาก ยอดยกมา + รับใหม่ + รับย้าย \u2212 ย้ายไป \u2212 Refer \u2212 Dead \u2212 จำหน่าย กรุณาตรวจสอบตัวเลขทั้งสองฝั่ง</p>`);
  S.overWarned = over;
}
function recalc(quiet) {
  const u = unitCfg(euUnit()), v = S.draft.values;
  u.form.sections.forEach((s, si) => {
    if (s.type === 'grid') s.rows.forEach(rw => { const el = document.querySelector(`[data-rowsum="${si}:${rw[0]}"]`); if (el) el.textContent = s.cols.reduce((a, c) => a + num(v[rw[0] + '_' + c[0]]), 0); });
    else {
      s.fields.forEach(f => {
        if (f.calc && !f.calc.manual) document.querySelector(`[data-calc="${f.key}"]`).textContent = fieldValue(u, v, f);
        if (f.pctOf) { const el = document.querySelector(`[data-pct="${f.key}"]`); el.textContent = num(v[f.pctOf]) ? `= ${(num(v[f.key]) / num(v[f.pctOf]) * 100).toFixed(2)}%` : ''; }
        if (f.note) { const row = document.querySelector(`[data-notefor="${f.key}"]`); if (row) row.classList.toggle('off', !num(v[f.key])); }
        if (s.categories) { const el = document.querySelector(`[data-catcnt="${f.key}"]`); if (el) el.textContent = num(v[f.key]); }
      });
      if (s.sum) document.querySelector(`[data-sum="${si}"]`).textContent = sectionSum(s, v);
    }
  });
  remCheck(u, v, quiet);
  if (u.form.total) $('fm_total').textContent = u.form.sections.filter(s => s.sum).reduce((a, s) => a + sectionSum(s, v), 0);
}

/* อัตรากำลัง: เลือกชื่อจาก Drop down หรือพิมพ์ชื่อใหม่ */
const reduceViewHtml = rd => `<div class="card"><h3>ลดอัตรากำลัง</h3><div class="kv">

// ชื่อต้นอย่างเดียว (ตัดคำนำหน้าและนามสกุล) สำหรับหน้าสรุป
const firstName = n => {
  // ตัดคำนำหน้า (น.ส. นาย นาง นางสาว คุณ ด.ช. ฯลฯ) ออกก่อน แล้วเอาชื่อต้นอย่างเดียว; คำเต็มต้องตามด้วยช่องว่าง เพื่อไม่ตัดชื่อที่ขึ้นต้นเหมือนกัน เช่น นายิกา
  let t = String(n || '').trim(), prev;
  do {
    prev = t;
    t = t.replace(/^(?:ว่าที่\s*)?(?:ร\.[ตทอ]\.(?:หญิง)?|น\.ส\.?|นส\.|ด\.ช\.|ด\.ญ\.|ดร\.|ผศ\.|รศ\.|ศ\.|นพ\.|พญ\.|ทพ\.|ทญ\.|ภก\.|ภญ\.)\s*/, '')
         .replace(/^(?:นางสาว|นาง|นาย|คุณ|เด็กชาย|เด็กหญิง|Miss|Mrs?\.?|Ms\.?)\s+/i, '').trim();
  } while (t !== prev);
  return t.split(/\s+/)[0] || String(n || '').trim();
};
// ตำแหน่งของคนในเวร: ค่าที่บันทึกไว้ในรายงาน หรือค้นจากทะเบียนของหน่วยงาน
const dutyPos = (s, unit) => s.pos || (() => { const r = S.staff.find(x => x.name === s.name && x.unit === unit); return posLabel(r ? r.title : '', s.role); })();
// ผู้ป่วยนอก: เวลาทำงานของแต่ละคน (เริ่ม-เลิก 24 ชม.) และจำนวนชั่วโมง
const isOpdUnit = code => (unitCfg(code) || {}).group === 'OPD';
const toMin = t => { const m = /^(\d\d):(\d\d)$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
function workHours(s) {
  const a = toMin(s.from), b = toMin(s.to);
  if (a === null || b === null) return 0;
  return ((b - a + 1440) % 1440 || 1440) / 60;
}
const fmtHrs = h => (Math.round(h * 10) / 10) + ' ชม.';
const timeText = s => s.from || s.to ? `${s.from || '?'}\u2013${s.to || '?'} น.` : '';

// คนที่เพิ่มใหม่ใช้เวลาทำงานเดียวกับคนล่าสุดที่ระบุเวลาไว้ (ผู้ป่วยนอก)
function lastTimes() {
  if (!isOpdUnit(euUnit())) return {};

/* ===== แพทย์ออกตรวจ (ผู้ป่วยนอก): ดึงจากตารางเวรแพทย์ประจำเดือน หน่วยงานแก้ชื่อ/เวลา เพิ่ม ลบ หรือระบุงดได้เอง ===== */
const docKey = n => String(n || '').replace(/^(?:ทพญ|ทพ|ทญ|นพ|พญ|พ|นส|น\.ส|ดร|คุณ)\s*\.*\s*/, '').replace(/\s+/g, '').toLowerCase();
const docFromSched = e => ({ name: e.name, time: e.time, sheet: e.sheet, text: e.text, off: !!e.off });
async function loadDoctors(merge) {
  const d = S.draft, unit = euUnit();
  if (!isOpdUnit(unit)) return;
  let r;
  try { r = await (merge ? api : apiRaw)('getDocSchedule', S.token, unit, S.date); } catch (e) { if (merge) handleErr(e); return; }
  if (!S.editing || S.draft !== d) return;
  S.docSched = r;
  if (!d.doctors) d.doctors = r.list.map(docFromSched);
  else if (merge) {
    const have = new Set(d.doctors.map(x => docKey(x.name)));
    const add = r.list.filter(e => !have.has(docKey(e.name)));
    add.forEach(e => d.doctors.push(docFromSched(e)));
    if (add.length) S.dirty = true;
    toast(r.loaded ? (add.length ? `เพิ่มแพทย์จากตารางเวร ${add.length} ท่าน` : 'แพทย์ในตารางเวรของวันนี้มีครบแล้ว') : 'ยังไม่มีตารางเวรแพทย์ของเดือนนี้ (Admin อัปโหลดที่แท็บรายชื่อเจ้าหน้าที่)');
  }
  renderDoctors();
}
function renderDoctors() {
  const box = $('fm_docs'); if (!box) return;
  const d = S.draft, list = d.doctors, sc = S.docSched;
  if (!list) { box.innerHTML = '<p class="muted">กำลังดึงตารางเวรแพทย์...</p>'; return; }
  const have = new Set(list.map(x => docKey(x.name)));
  const sugg = [];
  ((sc && sc.list) || []).concat((sc && sc.others) || []).forEach(e => { if (!have.has(docKey(e.name)) && !sugg.some(x => docKey(x.name) === docKey(e.name))) sugg.push(e); });
  const on = list.filter(x => !x.off).length;
  box.innerHTML = `${sc && !sc.loaded ? '<p class="muted" style="font-size:13px;margin:0 0 6px">ยังไม่มีตารางเวรแพทย์ของเดือนนี้ \u2014 เพิ่มชื่อแพทย์เองได้ (Admin อัปโหลดตารางที่แท็บรายชื่อเจ้าหน้าที่)</p>' : ''}
    <div class="counts"><span>มาออกตรวจ ${on} ท่าน</span>${list.length - on ? `<span>งด/ไม่มา ${list.length - on}</span>` : ''}</div>
    ${list.map((x, i) => [x, i]).reverse().map(([x, i]) => `<div class="drow${x.off ? ' off' : ''}">
      <input data-doc="${i}:name" value="${esc(x.name)}" placeholder="ชื่อแพทย์" aria-label="ชื่อแพทย์">

      <button type="button" class="x" data-docdel="${i}" aria-label="ลบแพทย์">\u00d7</button>
      <input class="tm" data-doc="${i}:time" value="${esc(x.time)}" placeholder="เวลาออกตรวจ เช่น 08.00-16.00" aria-label="เวลาออกตรวจ">
      ${x.text ? `<div class="src">ตารางเวร${x.sheet ? ' (' + esc(x.sheet) + ')' : ''}: ${esc(x.text)}</div>` : ''}</div>`).join('') || '<p class="muted" style="margin:6px 0">ไม่มีแพทย์ในตารางเวรของวันนี้ \u2014 กดเพิ่มแพทย์ได้</p>'}
    <div class="addrow" style="grid-template-columns:1fr auto">
      <select id="doc_pick"><option value="">+ เพิ่มแพทย์ (เลือกจากตารางวันนี้)</option>${sugg.map((e, i) => `<option value="${i}">${esc(e.name)}${e.time ? ' ' + esc(e.time) : ''}${e.sheet ? ' \u00b7 ' + esc(e.sheet) : ''}</option>`).join('')}<option value="__new">\uff0b พิมพ์ชื่อแพทย์เอง</option></select>
      <button type="button" class="btn ghost sm" id="doc_reload" title="เพิ่มแพทย์ในตารางเวรวันนี้ที่ยังไม่มีในรายการ">\u21bb ดึงจากตารางเวร</button>
    </div>`;
  box.querySelectorAll('[data-docdel]').forEach(b => b.onclick = () => { list.splice(+b.dataset.docdel, 1); S.dirty = true; renderDoctors(); });
  $('doc_pick').onchange = () => {
    const v = $('doc_pick').value; if (!v) return;

/* เหตุการณ์ผิดปกติ: ข้อมูลผู้ป่วย -> V/S -> รายละเอียด */
/* ===== ไฟล์แนบของเหตุการณ์ผิดปกติ (JPG / PNG / PDF) ===== */
const ATT_MAX_FILES = 5, PDF_MAX = 5 * 1024 * 1024;
S.att = {};
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const readB64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); r.readAsDataURL(file); });
function b64Blob(b64, mime) { const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: mime }); }
async function prepAttachment(file) {
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    if (file.size > PDF_MAX) throw new Error(file.name + ': PDF ใหญ่เกิน 5 MB');
    return { name: file.name, mime: 'application/pdf', data: await readB64(file) };
  }
  if (/^image\/(jpeg|png)$/.test(file.type) || /\.(jpe?g|png)$/i.test(file.name)) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error(file.name + ': เปิดรูปไม่ได้')); im.src = url; });
      const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      return { name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] };
    } finally { URL.revokeObjectURL(url); }
  }
  throw new Error(file.name + ': แนบได้เฉพาะ JPG, PNG หรือ PDF');
}
async function getAtt(id) { if (!S.att[id]) S.att[id] = await api('getAttachment', S.token, id); return S.att[id]; }
const attChip = (f, editable, i, k, cs) => `<span class="att"><button type="button" class="open" data-attview="${esc(f.id)}" data-attname="${esc(f.name)}" data-attmime="${esc(f.mime)}">${f.mime === 'application/pdf' ? 'PDF' : 'รูป'} ${esc(f.name)}</button><small>${fmtSize(f.size || 0)}</small>${editable ? `<button type="button" class="x" data-attdel${cs ? 'c' : ''}="${i}:${k}" aria-label="เอาไฟล์ออก">\u00d7</button>` : ''}</span>`;

$('view').addEventListener('change', async e => {
  const t = e.target;
  if (!(S.editing && t.dataset && (t.dataset.fileadd !== undefined || t.dataset.fileaddc !== undefined))) return;
  const cs = t.dataset.fileaddc !== undefined, i = +(cs ? t.dataset.fileaddc : t.dataset.fileadd), x = (cs ? S.draft.cases : S.draft.incidents)[i], files = Array.from(t.files);
  t.value = ''; x.files = x.files || [];
  for (const f of files) {
    if (x.files.length >= ATT_MAX_FILES) { toast('แนบได้สูงสุด ' + ATT_MAX_FILES + ' ไฟล์ต่อเหตุการณ์'); break; }
    try {
      toast('กำลังอัปโหลด ' + f.name + ' ...');
      const p = await Busy.wrap('กำลังเตรียมไฟล์...', () => prepAttachment(f), true);
      const r = await api('uploadAttachment', S.token, p);
      S.att[r.id] = { name: r.name, mime: r.mime, data: p.data };
      x.files.push({ id: r.id, name: r.name, mime: r.mime, size: r.size }); S.dirty = true;
      if (cs) renderCases(); else renderIncidents(); toast('แนบไฟล์แล้ว: ' + r.name);
    } catch (err) { toast(err.message); }
  }
});

async function openAtt(id, name) {
  $('viewer').hidden = false; $('v_title').textContent = name; $('v_dl').removeAttribute('href');
  $('v_body').innerHTML = '<div class="vpdf">กำลังโหลดไฟล์...</div>';
  try {
    const f = await getAtt(id), url = URL.createObjectURL(b64Blob(f.data, f.mime));
    if (S.viewUrl) URL.revokeObjectURL(S.viewUrl);
    S.viewUrl = url; $('v_dl').href = url; $('v_dl').download = f.name;
    $('v_body').innerHTML = f.mime.indexOf('image/') === 0 ? `<img alt="${esc(f.name)}" src="${url}">`
      : `<div class="vpdf"><div>ไฟล์ PDF: ${esc(f.name)}</div><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${url}">เปิด PDF ในแท็บใหม่</a></div>`;
  } catch (e) { $('v_body').innerHTML = `<div class="vpdf" style="color:#fecaca">${esc(e.message)}</div>`; }
}
$('v_close').onclick = () => { $('viewer').hidden = true; $('v_body').innerHTML = ''; };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('viewer').hidden) $('v_close').click(); });

/* พิมพ์: ใส่ภาพไฟล์แนบลงในรายงาน (รูปใส่ตรงๆ ส่วน PDF แปลงหน้าแรกๆ เป็นภาพ) */
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  if (!S.pdfjsP) S.pdfjsP = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js'; res(); };
    s.onerror = () => { S.pdfjsP = null; rej(new Error('โหลดตัวแสดง PDF ไม่ได้')); };
    document.head.appendChild(s);
  });
  return S.pdfjsP;
}
async function pdfPages(b64, max) {
  await loadPdfJs();
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const doc = await window.pdfjsLib.getDocument({ data: arr }).promise, pages = [];
  for (let p = 1; p <= Math.min(doc.numPages, max); p++) {
    const page = await doc.getPage(p), vp = page.getViewport({ scale: 1.4 }), c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    pages.push(c.toDataURL('image/jpeg', 0.85));
  }
  return { pages, total: doc.numPages };
}
S.pendingAtt = 0;
async function hydratePrint() {
  const figs = Array.from(document.querySelectorAll('figure[data-attfile]'));
  S.pendingAtt = figs.length;
  await Promise.all(figs.map(async fig => {
    const cap = fig.querySelector('figcaption');
    try {
      const f = await getAtt(fig.dataset.attfile);
      if (f.mime.indexOf('image/') === 0) fig.insertAdjacentHTML('afterbegin', `<img alt="" src="data:${f.mime};base64,${f.data}">`);
      else {
        const r = await pdfPages(f.data, 3);
        fig.insertAdjacentHTML('afterbegin', r.pages.map(u => `<img alt="" src="${u}">`).join(''));
        if (r.total > r.pages.length) cap.textContent += ` (แสดง ${r.pages.length} จาก ${r.total} หน้า ดูไฟล์เต็มในระบบ)`;
      }
    } catch (err) { cap.textContent += ' \u2014 แสดงไฟล์ไม่ได้: ' + err.message; }
    S.pendingAtt--;
  }));
}

/* ===== ตารางเวรแพทย์ประจำเดือน (ADMIN อัปโหลดไฟล์ปฏิทิน 1 ชีตต่อสาขา) ===== */
const DOC_PREFIX = /^(?:ทพญ|ทพ|ทญ|นพ|พญ|พ|นส|น\.ส|ดร|ภก|ภญ|กภ|อ)\s*\.+|^(?:พญ|นพ|ทพญ|ทพ|คุณ|Dr\.?)\s+/i;
const DOC_EN = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const DOC_TH = ['มกรา', 'กุมภา', 'มีนา', 'เมษา', 'พฤษภา', 'มิถุนา', 'กรกฎา', 'สิงหา', 'กันยา', 'ตุลา', 'พฤศจิกา', 'ธันวา'];
function docMonthOf(text) {
  const t = String(text || '').replace(/0(?=ct)/i, 'O');
  let m = DOC_EN.findIndex(x => new RegExp('\\b' + x, 'i').test(t));
  if (m < 0) m = DOC_TH.findIndex(x => t.indexOf(x) >= 0);
  const y = (t.match(/(25\d\d|20\d\d)/) || [])[1];
  if (m < 0 || !y) return '';
  return (+y > 2500 ? +y - 543 : +y) + '-' + String(m + 1).padStart(2, '0');
}
const hhmm = (h, m) => String(+h).padStart(2, '0') + '.' + String(m == null || m === '' ? 0 : +m).padStart(2, '0');
// ช่วงเวลาทั้งหมดในข้อความ เช่น "8-16 และ 17-20.00" ได้ "08.00-16.00, 17.00-20.00" (ไม่นับช่วงในวงเล็บที่มี "งด")
function docTimes(text) {
  const t = String(text).replace(/\([^)]*งด[^)]*\)/g, ' '), out = [], re = /(\d{1,2})(?:[.:](\d{1,2}))?\.?\s*-\s*(\d{1,2})(?:[.:](\d{1,2}))?/g;
  let m;
  while ((m = re.exec(t))) if (+m[1] <= 24 && +m[3] <= 24 && (m[2] == null || +m[2] < 60) && (m[4] == null || +m[4] < 60)) out.push(hhmm(m[1], m[2]) + '-' + hhmm(m[3], m[4]));
  return out.join(', ');
}
// ข้อความ 1 ช่องในปฏิทิน: แพทย์ท่านละบรรทัด (หรือเลขลำดับ 1. 2.) บรรทัดที่ไม่มีคำนำหน้าเป็นรายละเอียดต่อจากท่านก่อนหน้า
function docCell(raw) {
  const out = [];
  String(raw == null ? '' : raw).replace(/(^|[\s\/])\d{1,2}\.(?=\s*[ก-๙A-Za-z])/g, '\n').split(/\r?\n/).forEach(line => {
    const l = line.replace(/^[\s*\-\u2022\u00b7]+/, '').replace(/\s+/g, ' ').trim();
    if (!l) return;
    if (DOC_PREFIX.test(l) || (!out.length && /\d{1,2}(?:[.:]\d{1,2})?\s*-\s*\d/.test(l) && /^[^\d(]{2,}/.test(l))) out.push(l);
    else if (out.length) out[out.length - 1] += ' ' + l;
  });
  return out.map(text => {
    const m = text.match(/^([^\d(]+)/);
    const name = (m ? m[1] : text).replace(/\s+/g, ' ').replace(/\s*(ON\s*CALL|CP|รับ\s*CONSULT.*)$/i, '').trim().replace(/^(ทพญ|ทพ|ทญ|นพ|พญ|พ|นส|น\.ส)\s*\.+\s*/, '$1.');
    return { name, time: docTimes(text), text, off: /\(\s*งด\s*\)|ไม่(?:ต้อง)?เข้า\s*รพ/.test(text) };
  }).filter(x => x.name.replace(DOC_PREFIX, '').trim().length >= 2);
}
// ปฏิทิน: แถวที่มีแต่เลขวันที่ 1-31 = หัวสัปดาห์ แถวถัดไปคือแพทย์ของแต่ละวันในคอลัมน์นั้น
function parseDocSchedule(sheets) {
  let month = '';
  const entries = [];
  sheets.forEach(({ name, rows }) => {
    const sheet = String(name).trim();
    rows.slice(0, 4).forEach(r => r.forEach(c => { if (!month) month = docMonthOf(c); }));
    let days = null;
    rows.forEach(r => {
      const filled = r.slice(0, 8).map((c, i) => [i, String(c == null ? '' : c).trim()]).filter(x => x[1]);
      if (filled.length && filled.every(([, c]) => /^\d{1,2}(\.0+)?$/.test(c) && +c >= 1 && +c <= 31)) { days = filled.map(([i, c]) => [i, +c]); return; }
      if (!days) return;
      days.forEach(([i, day]) => docCell(r[i]).forEach(d => entries.push(Object.assign({ day, sheet }, d))));
    });
  });
  return { month, entries };
}
async function readDocFile(file) {
  await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  return parseDocSchedule(wb.SheetNames.map(n => ({ name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' }) })));
}
// ชื่อชีตที่ระบบเดาหน่วยงานผู้ป่วยนอกให้ (แก้ได้ก่อนยืนยัน)
const DOC_SUGGEST = [
  [/สูติ/, ['OBG-IVF']], [/ศัลย์/, ['OPD3']], [/กุมาร|นมแม่|พัฒนาการ/, ['PC']], [/อายุร/, ['OPD1']], [/ENT|จักษุ/i, ['EENT']],
  [/ทันต/, ['Dent']], [/OPD4|HPC|ER/i, ['HPC', 'ER']], [/CP/, ['PC']]
];
function docBindDefault(sheet) {
  const have = (S.docInfo && S.docInfo.bindings) || {};
  if (have[sheet]) return have[sheet];
  const hit = DOC_SUGGEST.find(x => x[0].test(sheet));
  return hit ? hit[1] : [];
}
const opdCodes = () => S.cfg.units.filter(u => u.group === 'OPD').map(u => u.code);

    <p class="muted" style="margin:0 0 8px;font-size:14px">อัปโหลดไฟล์ตารางออกตรวจของแพทย์ (Excel .xls / .xlsx ชีตละสาขา) ทุกเดือน ระบบดึงแพทย์ของแต่ละวันเข้าฟอร์มอัตรากำลังของแผนกผู้ป่วยนอกตามสาขาที่ผูกไว้ อัปโหลดเดือนเดิมซ้ำจะแทนที่ทั้งเดือน แผนกยังแก้ เพิ่ม ลบ ปรับเวลาแพทย์ในรายงานเองได้</p>

function docPreviewHtml(up) {

function bindDocCard() {
  if ($('doc_file')) $('doc_file').onchange = async () => {

    $('doc_preview').innerHTML = '<p class="muted">กำลังอ่านไฟล์...</p>';

      const r = await Busy.wrap('กำลังอ่านไฟล์...', () => readDocFile(f), true);

  });

    } catch (e) { handleErr(e); $('doc_go').disabled = false; }
  };
}

function normUnit(s) { return String(s || '').toUpperCase().replace(/ผู้ป่วยใน|ผู้ป่วยนอก|ตึก|หอผู้ป่วย|หอ|แผนก|หน่วยงาน|ชั้น|\s|[-_.\/()]/g, ''); }
const cleanName = s => String(s || '').replace(/\s+/g, ' ').trim();
function builtinRole(raw) {
  const t = String(raw || '').trim(), up = t.toUpperCase().replace(/[\s.]/g, '');

  [/นักรังสี/, 'RT'], [/กายภาพบำบัด/, 'PT'], [/กิจกรรมบำบัด/, 'OT'], [/นักโภชนาการ|นักกำหนดอาหาร/, 'RD'], [/นักจิตวิทยา/, 'Psychologist'],

function posLabel(title, role) {

  if (t) {
    if (/ผู้ช่วยหัวหน้า/.test(t)) return 'ผช.หัวหน้าแผนก';
    if (/หัวหน้า/.test(t)) return 'หัวหน้าแผนก';
    if (/ผู้ช่วยเหลือ/.test(t)) return 'NA';
    if (/ผู้ช่วยพยาบาล|ผู้ช่วยการพยาบาล/.test(t)) return 'PN';
    if (/พยาบาลวิชาชีพ/.test(t)) return 'RN';
    const ab = POS_ABBR.find(x => x[0].test(t));
    return ab ? ab[1] : t; // ตำแหน่งอื่น: ตามเอกสารที่อัปโหลด (ใช้ตัวย่อสากลถ้ามี)
  }
  return S.cfg.roles.indexOf(role) >= 0 ? (role === 'หัวหน้า' ? 'หัวหน้าแผนก' : role) : 'ไม่ระบุ';
}
const normTitle = t => String(t || '').toLowerCase().replace(/\s+/g, '');
// ตำแหน่งที่แอดมินจับคู่เองมาก่อนกฎอัตโนมัติ
function mapRole(raw) { return (S.titleMap || {})[normTitle(raw)] || builtinRole(raw); }
const SUGGEST = [
  [/อุบัติเหตุ/, 'ER'], [/อายุรกรรม/, 'OPD1'], [/ศัลยกรรม/, 'OPD3'], [/สูตินรีเวช|สูติ/, 'OBG-IVF'],
  [/กุมารเวช|เด็กสุขภาพดี|พัฒนาการเด็ก/, 'PC'], [/ตา\s*หู\s*คอ/, 'EENT'], [/ทันตกรรม/, 'Dent'],
  [/ห้องผ่าตัด/, 'OR'], [/ห้องคลอด/, 'LR'], [/ทารกแรกเกิด/, 'NB'], [/ผู้ป่วยวิกฤต/, 'ICU'], [/ส่งเสริมสุขภาพ/, 'HPC'], [/CCC/i, 'CCC']
];
function suggestUnit(raw) {
  const hit = SUGGEST.find(x => x[0].test(raw));
  return hit && S.cfg.units.some(u => u.code === hit[1]) ? hit[1] : '';
}
function findHeader(rows) {
  const lim = Math.min(rows.length, 15);
  for (let i = 0; i < lim; i++) {
    const h = rows[i].map(c => String(c == null ? '' : c).replace(/\s/g, ''));
    const cn = h.findIndex(x => (/ชื่อ/.test(x) && !/เล่น/.test(x)) || /^name$/i.test(x));
    const cu = h.findIndex(x => /แผนก|หน่วย|ตึก|^unit$|^ward$/i.test(x));
    const cr = h.findIndex(x => /ตำแหน่ง|role|position/i.test(x));
    if (cn >= 0 && cu >= 0 && cr >= 0) return { row: i, cu, cn, cr };
  }
  return null;
}
async function readRoster(file) {
  let sheets;
  if (/\.csv$/i.test(file.name)) {
    sheets = [(await file.text()).replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim()).map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g, '')))];
  } else {
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    sheets = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' }).map(r => r.map(c => String(c).trim())));
  }
  let rows = null, cu = 0, cn = 1, cr = 2;
  for (const sh of sheets) {
    const f = findHeader(sh);
    if (f) { rows = sh.slice(f.row + 1); cu = f.cu; cn = f.cn; cr = f.cr; break; }
  }
  if (!rows) rows = sheets[0] || [];
  rows = rows.filter(r => r.some(c => String(c).trim()));
  if (!rows.length) throw new Error('ไม่พบข้อมูลในไฟล์');
  const out = [], bad = [];
  rows.forEach((r, i) => {
    const name = cleanName(r[cn]);
    if (name) out.push({ dept: cleanName(r[cu]), name, role: mapRole(r[cr]), title: String(r[cr] || '').replace(/\s+/g, ' ').trim() });
    else if (cleanName(r[cu])) bad.push(i + 1);
  });
  return { rows: out, bad };
}
function resolveDept(dept) {
  const k = normUnit(dept);
  if (!k) return '';
  const al = (S.aliases || []).find(a => normUnit(a.alias) === k);
  if (al) return al.unit;
  const hit = S.cfg.units.find(u => normUnit(u.code) === k);
  return hit ? hit.code : '';
}
function downloadTemplate() {
  const rows = [['หน่วยงาน', 'ชื่อ-สกุล', 'ตำแหน่ง'], ['A4', 'ตัวอย่าง หนึ่ง', 'RN'], ['A4', 'ตัวอย่าง สอง', 'PN'], ['B5', 'ตัวอย่าง สาม', 'NA'], ['OPD1', 'ตัวอย่าง สี่', 'RN']];
  const csv = '\ufeff' + rows.map(r => r.join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'roster-template.csv';
  document.body.appendChild(a); a.click(); a.remove();
  Busy.start('กำลังดาวน์โหลดไฟล์...', true); setTimeout(() => Busy.end(), 700);
}
