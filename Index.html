<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายงานยอดประจำวัน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;600&display=swap">
<style>
  /* Layout: แถบหัว + แท็บ + วันที่ติดด้านบน, เนื้อหาคอลัมน์เดียวบนมือถือ, 2 คอลัมน์บนจอกว้าง */
  :root {
    --bg: #eef3f3; --surface: #ffffff; --sunk: #f5f8f8; --line: #d5e0e0; --fg: #15282a; --muted: #5b7073;
    --accent: #0e6f6a; --accent-ink: #ffffff; --accent-soft: #dcefed;
    --ok: #1d7a3e; --ok-soft: #e1f3e7; --warn: #a15c00; --warn-soft: #fbefdc; --bad: #b42318; --bad-soft: #fde7e5;
    --font: 'IBM Plex Sans Thai', 'Sarabun', system-ui, sans-serif; --print: 'Sarabun', 'IBM Plex Sans Thai', sans-serif;
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1a1b; --surface: #172526; --sunk: #1d2e2f; --line: #2c4143; --fg: #e3eeee; --muted: #93a9ab;
    --accent: #4fc1b8; --accent-ink: #062523; --accent-soft: #1b3a38;
    --ok: #5fd08a; --ok-soft: #173326; --warn: #f0b04f; --warn-soft: #3a2d15; --bad: #ff8a80; --bad-soft: #3d1c1a; color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #0f1a1b; --surface: #172526; --sunk: #1d2e2f; --line: #2c4143; --fg: #e3eeee; --muted: #93a9ab;
    --accent: #4fc1b8; --accent-ink: #062523; --accent-soft: #1b3a38;
    --ok: #5fd08a; --ok-soft: #173326; --warn: #f0b04f; --warn-soft: #3a2d15; --bad: #ff8a80; --bad-soft: #3d1c1a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font); -webkit-text-size-adjust: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .num { font-variant-numeric: tabular-nums; }

  /* ===== Login ===== */
  #login { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
  .login-card h1 { margin: 0; font-size: 22px; text-wrap: balance; }
  .login-card p { margin: 0; color: var(--muted); font-size: 14px; }
  .hint { font-size: 13px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }

  /* ===== Top bar ===== */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--accent-ink); }
  .top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
  .top .title { font-weight: 600; flex: 1; min-width: 0; line-height: 1.25; }
  .top .title small { display: block; font-weight: 400; opacity: .85; font-size: 12px; }
  .unit-pill { background: var(--accent-ink); color: var(--accent); font-weight: 700; padding: 3px 10px; border-radius: 99px; font-size: 14px; white-space: nowrap; }
  .top button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; opacity: .9; }
  .tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 4; }
  .tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; padding: 11px 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tabs button.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .datebar { display: flex; align-items: center; gap: 8px; padding-block: 12px; }
  .dpick { position: relative; flex: 0 1 190px; min-width: 150px; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-weight: 600; }
  .dpick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; padding: 0; border: 0; }
  .dpick .cal { color: var(--muted); }
  .datebar .dlabel { color: var(--muted); font-size: 14px; flex: 1; min-width: 0; }
  .iconbtn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: 0 0 auto; }

  /* ===== Common ===== */
  main { padding-bottom: 96px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; }
  .card > h3 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card > h3 .sub { font-weight: 400; color: var(--muted); font-size: 13px; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.sm { padding: 6px 12px; font-size: 14px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .muted { color: var(--muted); }
  .pill { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 99px; font-weight: 500; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.no { background: var(--bad-soft); color: var(--bad); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.plain { background: var(--sunk); color: var(--muted); }
  .note { font-size: 13px; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 99px; z-index: 20; font-size: 14px; max-width: calc(100% - 32px); }

  /* ===== Form ===== */
  .frow { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .frow:last-child { border-bottom: 0; }
  .frow.text { grid-template-columns: 1fr; }
  .frow .lab small { color: var(--muted); }
  .frow input[type=number] { text-align: center; }
  .frow .calc { text-align: center; font-weight: 700; padding: 9px 0; background: var(--accent-soft); border-radius: 8px; }
  .sumline { display: flex; justify-content: space-between; padding-top: 8px; margin-top: 4px; border-top: 2px solid var(--line); font-weight: 600; }
  .grid-scroll { overflow-x: auto; }
  table.g { border-collapse: collapse; width: 100%; min-width: 360px; }
  table.g th, table.g td { border: 1px solid var(--line); padding: 4px; text-align: center; font-size: 14px; }
  table.g th { background: var(--sunk); font-weight: 600; }
  table.g td:first-child, table.g th:first-child { text-align: left; }
  table.g input { padding: 6px 2px; text-align: center; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .savebar .wrap { display: flex; gap: 10px; align-items: center; padding-block: 10px; }
  .savebar .msg { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }

  /* staff picker */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--sunk); border-radius: 99px; padding: 5px 11px; cursor: pointer; font-size: 14px; }
  .chip b { font-size: 11px; color: var(--muted); margin-left: 4px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.on b { color: inherit; opacity: .8; }
  .duty { display: grid; grid-template-columns: 1fr 64px 108px 32px; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .duty .nm { min-width: 0; overflow-wrap: anywhere; }
  .duty select { padding: 6px; font-size: 14px; }
  .x { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--bad); cursor: pointer; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .counts span { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 9px; font-weight: 600; font-size: 14px; }
  .addrow { display: grid; grid-template-columns: 1fr 84px auto; gap: 6px; margin-top: 10px; }

  /* sub tabs */
  .subtabs { display: flex; gap: 4px; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-bottom: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 98px); z-index: 3; }
  .subtabs button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; border-radius: 7px; padding: 8px 4px; cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1.25; }
  .subtabs button.on { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .subtabs .c { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 99px; background: var(--bad-soft); color: var(--bad); font-size: 11px; font-weight: 700; margin-left: 3px; }
  .subtabs .c.z { background: var(--line); color: var(--muted); }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px 10px; margin: 8px 0 0; min-width: 0; }
  legend { font-size: 13px; font-weight: 600; color: var(--accent); padding: 0 4px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .unitin { position: relative; }
  .unitin input { padding-right: 52px; }
  .unitin span { position: absolute; right: 8px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .vs { font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 4px 0; }
  .vs b { font-variant-numeric: tabular-nums; }
  .pt { font-size: 14px; margin: 4px 0; }

  /* เลือกห้องพัก */
  .rooms { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .rm { min-width: 62px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); cursor: pointer; font-variant-numeric: tabular-nums; }
  .rm.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .rm.used { opacity: .4; }
  .tin { text-align: center; max-width: 110px; font-variant-numeric: tabular-nums; }
  .frow .tin { justify-self: end; }
  .frow[hidden] { display: none; }
  .notein { width: 100%; }
  .atts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .att { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); max-width: 100%; }
  .att > button.open { border: 0; background: transparent; padding: 6px 8px; cursor: pointer; color: var(--accent); font-weight: 600; text-align: left; overflow-wrap: anywhere; }
  .att small { color: var(--muted); padding-right: 4px; white-space: nowrap; }
  .att .x { width: 28px; height: 28px; margin-right: 3px; }
  .viewer { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.82); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .viewer .vbar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; color: #fff; }
  .viewer .vbar b { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .viewer .vbar a, .viewer .vbar button { color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 6px 12px; background: transparent; text-decoration: none; cursor: pointer; font-size: 14px; }
  .viewer .vbody { flex: 1; overflow: auto; display: grid; place-items: center; padding: 8px; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; }
  .viewer .vpdf { color: #fff; text-align: center; display: grid; gap: 12px; justify-items: center; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
  .tile b { font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 13px; color: var(--muted); }
  .tile.bad b { color: var(--bad); }
  .sbox .shead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 16px; }
  .sbox .ln { font-size: 14px; margin: 3px 0; overflow-wrap: anywhere; }
  .sbox .ln b { font-weight: 700; }
  .sbox .miss { color: var(--bad); font-size: 14px; }
  .sbox .shl { font-weight: 700; color: var(--accent); margin: 8px 0 2px; border-bottom: 1px solid var(--line); }
  .addrow { display: grid; gap: 8px; }
  .addn { display: flex; gap: 8px; }
  .addn input { width: 110px; flex: 0 0 auto; }
  .lrow { display: grid; grid-template-columns: 1fr 96px auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .slines .lg { break-inside: avoid; margin-bottom: 4px; }
  .slines .ln.d { padding-left: 10px; color: var(--muted); margin: 1px 0; }
  @media (min-width: 720px) { .slines { columns: 2; column-gap: 24px; } }
  .a4 .shl { font-weight: 700; font-size: 9.5pt; border-bottom: .4pt solid #999; margin-top: 3px; }
  .a4 .ub .ln.d { padding-left: 6px; font-size: 8.5pt; }
  .a4 .ub .lg { break-inside: avoid; }
  .rm small { display: block; font-size: 10px; opacity: .75; line-height: 1.1; }
  .rrow { display: grid; grid-template-columns: 1fr 1.4fr 36px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .rrow .btn { grid-column: 1 / -1; justify-self: start; }
  .rbulk { display: grid; grid-template-columns: 1fr 64px 64px auto; gap: 6px; align-items: center; margin: 8px 0; font-size: 13px; color: var(--muted); }
  .rbulk > span { grid-column: 1 / -1; }
  .ractions { display: flex; gap: 8px; margin-top: 8px; }
  .binding { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; align-items: center; margin: 4px 0 8px; font-size: 14px; }
  .rm-add { grid-template-columns: 1fr auto; margin-top: 6px; }
  /* แท็บย่อยของหน่วยงาน */
  .seg { display: flex; gap: 4px; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-bottom: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 98px); z-index: 3; }
  .seg button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; border-radius: 7px; padding: 8px 6px; cursor: pointer; color: var(--muted); font-weight: 500; line-height: 1.25; }
  .seg button small { display: block; font-size: 11px; font-weight: 600; opacity: .9; }
  .seg button.on { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg button.alert small { color: var(--bad); }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 12px 0 0; padding: 4px 12px 12px; min-width: 0; }
  legend { font-size: 13px; font-weight: 600; color: var(--accent); padding: 0 6px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .vsgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 8px; margin-top: 8px; }
  .vs { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; background: var(--surface); }
  .vs span { font-weight: 600; font-size: 14px; }
  .vs input { border: 0; padding: 7px 2px; text-align: center; background: transparent; }
  .vs small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .o2row { display: grid; grid-template-columns: auto 130px 1fr; gap: 8px; align-items: center; margin-top: 8px; }
  .inc-view .pt { margin-top: 6px; }
  .vsline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .vsline span { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .vsline small { color: var(--muted); }

  /* incidents */
  .inc, .inc-view { border-left: 4px solid var(--bad); }
  .inc-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .addinc { width: 100%; border: 2px dashed var(--line); background: transparent; color: var(--accent); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }

  /* ===== Read view ===== */
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .kv .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .kv .full { grid-column: 1 / -1; }
  .kv .total { border-top: 1px solid var(--line); padding-top: 3px; }
  .pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .view-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; align-items: start; }
  .view-grid .card { margin: 0; }
  .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

  /* ===== All units ===== */
  .ulist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .ucard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
  .ucard:hover { border-color: var(--accent); }
  .ucard .code { font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .ucard > .pill { justify-self: start; }
  .ucard .big { font-size: 13px; color: var(--muted); }
  .ucard.mine { outline: 2px solid var(--accent); }
  h2.grp { font-size: 14px; letter-spacing: .03em; color: var(--muted); margin: 6px 0 8px; font-weight: 600; }
  .progress { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin: 6px 0 14px; }
  .progress i { display: block; height: 100%; background: var(--ok); }

  /* ===== Staff registry ===== */
  .srow { display: grid; grid-template-columns: 1fr 70px auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .srow .acts { display: flex; gap: 4px; }
  .srow.edit { grid-template-columns: 1fr 84px auto; }

  /* ===== A4 print ===== */
  .a4-scroll { overflow-x: auto; }
  .a4 { width: 210mm; min-height: 297mm; margin: 0 auto; background: #fff; color: #111; padding: 12mm 12mm; font: 10pt/1.4 var(--print); box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  .a4 h1 { font-size: 15pt; margin: 0; text-align: center; }
  .a4 .d { text-align: center; margin-bottom: 6px; }
  .a4 .st { font-size: 9.5pt; margin-bottom: 6px; }
  .a4 .st .m { color: #b42318; }
  .a4 h2 { font-size: 11.5pt; margin: 8px 0 4px; border-bottom: 1.5pt solid #111; }
  .a4 .cols { columns: 2; column-gap: 8mm; }
  .a4 .ub { break-inside: avoid; border: .5pt solid #999; padding: 3px 6px; margin-bottom: 5px; }
  .a4 .ub b.c { font-size: 10.5pt; }
  .a4 .ub .ln { font-size: 9pt; }
  .a4 .ub .miss { color: #b42318; }
  .a4 table { width: 100%; border-collapse: collapse; font-size: 9pt; }
  .a4 th, .a4 td { border: .5pt solid #777; padding: 2px 4px; vertical-align: top; }
  .a4 th { background: #eee; }
  .a4 .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 6px 0 4px; }
  .a4 .kpis div { border: .5pt solid #999; padding: 3px 4px; text-align: center; font-size: 8.5pt; line-height: 1.25; }
  .a4 .kpis b { display: block; font-size: 15pt; line-height: 1.2; }
  .a4 .kpis .alert b { color: #b42318; }
  .a4 table.stat td.n { text-align: center; font-variant-numeric: tabular-nums; }
  .a4 table.stat td.b { font-weight: 700; }

<!-- ===== กำลังโหลด / แจ้งข้อผิดพลาด (ไม่ให้เป็นหน้าว่าง) ===== -->
<div id="boot" class="wrap" style="padding-block:56px;text-align:center">
  <div id="boot_msg" class="muted">กำลังโหลด...</div>
  <button class="btn ghost sm" id="boot_retry" type="button" hidden style="margin-top:14px" onclick="location.reload()">ลองใหม่</button>
</div>
<script>
function bootFail(m) {
  var b = document.getElementById('boot'), t = document.getElementById('boot_msg'), r = document.getElementById('boot_retry');
  if (!b || window.__ready) return;
  b.hidden = false; r.hidden = false;
  t.style.color = 'var(--bad)'; t.textContent = 'เปิดระบบไม่สำเร็จ: ' + m;
}
function diag(msg) {
  try {
    if (!/SyntaxError/.test(msg)) return '';
    var target = String(msg).replace(/^Uncaught\s+/, '').replace(/^SyntaxError:\s*/, '');
    var ss = document.getElementsByTagName('script');
    for (var i = 0; i < ss.length; i++) {
      var t = ss[i].text || '';
      if (t.length < 5000) continue;
      var L = t.split('\n');
      var bad = function (k) { try { new Function(L.slice(0, k).join('\n')); return false; } catch (x) { return x.message === target; } };
      if (!bad(L.length)) continue;
      var lo = 0, hi = L.length;
      while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (bad(mid)) hi = mid; else lo = mid; }
      var line = L[hi - 1], codes = [];
      for (var j = 0; j < line.length; j++) { var c = line.charCodeAt(j); if (c > 127 && (c < 0xE00 || c > 0xE7F)) codes.push('U+' + c.toString(16).toUpperCase()); }
      return ' | สคริปต์หลัก บรรทัดที่ ' + hi + ': ' + line.replace(/^\s+/, '').slice(0, 120) + (codes.length ? ' | อักขระพิเศษ: ' + codes.slice(0, 6).join(' ') : '');
    }
  } catch (x) {}
  return '';
}
window.addEventListener('error', function (e) { var m = e.message || 'เกิดข้อผิดพลาดในหน้าเว็บ'; bootFail(m + diag(m)); });
window.addEventListener('unhandledrejection', function (e) { bootFail((e.reason && e.reason.message) || e.reason || 'เกิดข้อผิดพลาด'); });
setTimeout(function () {
  if (!window.__ready) bootFail(window.__scriptLoaded ? 'เซิร์ฟเวอร์ไม่ตอบสนอง ลองรีเฟรชหน้านี้' : 'ไฟล์ Index วางโค้ดไม่ครบ (ต้องมีครบถึงบรรทัดสุดท้าย)');
}, 12000);
</script>

<!-- ===== เข้าสู่ระบบ ===== -->

<!-- ===== แอป ===== -->
<div id="app" hidden>

  <main class="wrap">
    <div class="datebar noprint" id="datebar">
      <button class="iconbtn" id="d_prev" type="button" aria-label="วันก่อนหน้า">‹</button>
      <label class="dpick" for="d_date"><span class="num" id="d_text"></span><span class="cal" aria-hidden="true">&#9662;</span><input type="date" id="d_date"></label>

</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== เรียกฝั่งเซิร์ฟเวอร์ (Apps Script) ===== */
function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e && e.message ? e : new Error(String(e))))[fn](...args);
    } else if (window.MockAPI) {
      Promise.resolve().then(() => window.MockAPI[fn](...args)).then(r => resolve(JSON.parse(JSON.stringify(r === undefined ? null : r))), reject);
    } else reject(new Error('ไม่พบเซิร์ฟเวอร์'));
  });
}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const shiftDate = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const thaiDate = (s, long) => new Date(s + 'T12:00:00').toLocaleDateString('th-TH', long ? { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' } : { weekday: 'short', day: 'numeric', month: 'short', year: '2-digit' });
const store = { get(k) { try { return JSON.parse(localStorage.getItem('dr.' + k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('dr.' + k, JSON.stringify(v)); } catch (e) {} } };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDMY = s => { const p = String(s).split('-'); return p[2] + '/' + MON[+p[1] - 1] + '/' + p[0]; };
const num = v => (v === '' || v == null || isNaN(v)) ? 0 : Number(v);
const show = v => (v === '' || v == null) ? '\u2013' : esc(v);

function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }

const S = { token: null, me: null, cfg: null, date: todayStr(), day: {}, staff: [], tab: 'mine', sub: 'patient', viewUnit: null, editing: false, draft: null };
/* ===== เวร Day / Night: รายงานแยกตามเวร  S.dayRaw = { หน่วยงาน: { Day, Night } } ===== */
const guessShift = () => { const h = new Date().getHours(); return h >= 7 && h < 19 ? 'Day' : 'Night'; };
S.shift = guessShift();
S.vshift = guessShift();
S.dayRaw = {};
const shiftName = s => s || '-';
const repOf = (code, shift) => (S.dayRaw[code] || {})[shift];
const unitHas = (u, k) => (u.shifts || ['Day', 'Night']).includes(k);
const shiftsOf = u => u.shifts || ['Day', 'Night'];
const repAt = (u, k) => (S.dayRaw[u.code] || {})[k];
// full = ส่งครบทุกเวรของหน่วยงาน, part = ส่งบางเวร, none = ยังไม่ส่ง
const unitState = u => { const n = shiftsOf(u).filter(k => repAt(u, k)).length; return n === shiftsOf(u).length ? 'full' : n ? 'part' : 'none'; };
const missingShifts = u => shiftsOf(u).filter(k => !repAt(u, k));
const missingText = () => S.cfg.units.filter(u => unitState(u) !== 'full').map(u => esc(u.code) + (shiftsOf(u).length > 1 && unitState(u) === 'part' ? ' (' + missingShifts(u).join(', ') + ')' : '')).join(', ');
const shiftLab = (u, k) => esc(u.code) + (shiftsOf(u).length > 1 ? ' \u00b7 ' + esc(k) : '');
function deriveReports(vs) {
  const out = {};
  S.cfg.units.forEach(u => { const r = (S.dayRaw[u.code] || {})[vs]; if (r && unitHas(u, vs)) out[u.code] = r; });
  return out;
}
function setDay(raw) { S.dayRaw = (raw && raw.reports) || {}; S.day = { reports: deriveReports(S.vshift) }; }
const vshiftSeg = u => shiftsOf(u).length < 2 ? '' : `<div class="seg noprint" style="position:static;margin-bottom:12px">${shiftsOf(u).map(k => [k, 'เวร ' + k]).map(([k, t]) => `<button type="button" data-vshift="${k}" class="${S.vshift === k ? 'on' : ''}">${t}</button>`).join('')}</div>`;

const unitCfg = code => S.cfg.units.find(u => u.code === code);
const groupName = key => S.cfg.groups.find(g => g.key === key).name;
const unitLabel = u => groupName(u.group) + (u.sub ? ' \u00b7 ' + u.sub : '');
const unitOptgroups = (sel, prefix) => S.cfg.sections.map(sc => `<optgroup label="${esc((prefix || '') + sc.label)}">${sc.units.map(c => `<option${c === sel ? ' selected' : ''}>${esc(c)}</option>`).join('')}</optgroup>`).join('');

/* ===== เริ่มต้น / เข้าสู่ระบบ ===== */
(async function boot() {
  S.token = store.get('token');
  try {
    if (S.token) {
      try { return await startApp(await api('getBoot', S.token)); }
      catch (e) { if (!/เข้าสู่ระบบ/.test(e.message)) throw e; store.set('token', null); S.token = null; }
    }
    await showLogin();
  } catch (e) { bootFail(e && e.message ? e.message : e); }
})();

async function showLogin() {
  $('app').hidden = true; $('login').hidden = false; $('boot').hidden = true; window.__ready = true;
  if ($('l_unit').options.length) return;
  let info;
  try { info = await api('getLoginInfo'); }
  catch (e) { $('l_msg').textContent = 'โหลดรายชื่อหน่วยงานไม่สำเร็จ: ' + e.message + ' (ลองรีเฟรชหน้านี้)'; return; }
  $('l_unit').innerHTML = info.groups.map(g => g.sections.map(sc => `<optgroup label="${esc(sc.label)}">${sc.units.map(u => `<option>${esc(u)}</option>`).join('')}</optgroup>`).join('')).join('')
    + '<optgroup label="ผู้บริหาร / ผู้ดูแลระบบ"><option value="MANAGER">ผู้จัดการ</option><option value="ADMIN">Admin (ผู้ดูแลระบบ)</option></optgroup>';
  const last = store.get('lastUnit'); if (last) $('l_unit').value = last;
  if (info.hint) { $('l_hint').hidden = false; $('l_hint').textContent = info.hint; }
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('l_btn').disabled = true; $('l_msg').textContent = 'กำลังตรวจสอบ...';
  try {
    const r = await api('login', $('l_unit').value, $('l_pass').value);
    store.set('token', r.token); store.set('lastUnit', $('l_unit').value);
    S.token = r.token; $('l_pass').value = ''; $('l_msg').textContent = '';
    startApp(await api('getBoot', S.token));
  } catch (err) { $('l_msg').textContent = err.message; }
  $('l_btn').disabled = false;
});

$('t_logout').onclick = async () => {
  try { await api('logout', S.token); } catch (e) {}
  store.set('token', null); S.token = null; showLogin();
};

async function startApp(b) {
  S.me = b.me; S.cfg = b.config;
  $('login').hidden = true; $('boot').hidden = true; $('app').hidden = false; window.__ready = true;
  const admin = S.me.role === 'admin', manager = S.me.role === 'manager';
  $('t_unit').textContent = admin ? 'ADMIN' : manager ? 'ผู้จัดการ' : S.me.unit;
  $('t_sub').textContent = admin ? 'ผู้ดูแลระบบ \u00b7 ดูได้ทุกหน่วยงาน' : manager ? 'ดูได้ทุกหน่วยงาน' : unitLabel(unitCfg(S.me.unit));
  const tabs = admin
    ? [['summary', 'สรุป'], ['all', 'ติดตามรายแผนก'], ['print', 'พิมพ์ A4'], ['staff', 'รายชื่อเจ้าหน้าที่ (อัปโหลด)']]
    : manager ? [['summary', 'สรุป'], ['all', 'ติดตามรายแผนก'], ['print', 'พิมพ์ A4']]
    : [['mine', 'หน่วยงานของฉัน'], ['all', 'ติดตามรายแผนก'], ['print', 'พิมพ์รายงาน'], ['staff', 'ทะเบียนเจ้าหน้าที่ / ห้อง']];
  $('tabs').innerHTML = tabs.map(([k, t]) => `<button type="button" data-tab="${k}">${t}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(btn => btn.onclick = () => go(btn.dataset.tab));
  S.tab = tabs[0][0];
  S.aliases = [];
  if (admin) { try { S.aliases = await api('getAliases', S.token); } catch (e) { handleErr(e); } }
  await loadStaff();
  await loadDay();
}

function setDateUI() { $('d_date').value = S.date; $('d_text').textContent = fmtDMY(S.date); $('d_label').textContent = thaiDate(S.date, true); }
$('d_date').onchange = () => { if ($('d_date').value) { S.date = $('d_date').value; loadDay(); } };
$('d_date').addEventListener('click', () => { try { $('d_date').showPicker(); } catch (e) {} });
$('d_prev').onclick = () => { S.date = shiftDate(S.date, -1); loadDay(); };
$('d_next').onclick = () => { S.date = shiftDate(S.date, 1); loadDay(); };

async function loadDay() {
  if (S.editing && S.dirty) { S.date = S.draft.date; setDateUI(); toast('บันทึกหรือยกเลิกรายงานก่อนเปลี่ยนวันที่'); return; }
  S.editing = false;
  setDateUI();
  $('view').innerHTML = '<div class="card muted">กำลังโหลด...</div>';
  try { setDay(await api('getDay', S.token, S.date)); } catch (e) { return handleErr(e); }
  render();
}
async function loadStaff() { try { S.staff = await api('listStaff', S.token); } catch (e) { handleErr(e); } }

function handleErr(e) {
  if (/เข้าสู่ระบบ/.test(e.message)) { store.set('token', null); showLogin(); }
  toast(e.message);
}

function go(tab, unit) {
  if (S.editing && S.dirty && !leaveGuard()) return;
  S.editing = false; S.dirty = false;
  S.tab = tab; S.viewUnit = unit || null;
  if (tab === 'print') S.monthData = null;
  render(); window.scrollTo(0, 0);
}
// ไม่มี confirm() ในบางเบราว์เซอร์ฝังตัว -> กดซ้ำเพื่อยืนยัน
function leaveGuard() {
  if (S.leaveArmed) { S.leaveArmed = false; return true; }
  S.leaveArmed = true; toast('ยังไม่ได้บันทึก \u2014 กดอีกครั้งเพื่อออกโดยไม่บันทึก');
  setTimeout(() => S.leaveArmed = false, 3000); return false;
}

function render() {
  $('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('savebar').hidden = !S.editing;
  $('datebar').hidden = S.tab === 'staff';
  const v = $('view');
  if (S.tab === 'mine') v.innerHTML = S.editing ? '' : renderMine();
  else if (S.tab === 'all') v.innerHTML = S.viewUnit ? renderUnitDetail(S.viewUnit) : renderAll();
  else if (S.tab === 'summary') v.innerHTML = renderSummary();
  else if (S.tab === 'print') v.innerHTML = renderPrint();
  else if (S.tab === 'staff') v.innerHTML = renderStaff();
  if (S.tab === 'mine' && S.editing) mountForm();
  bindView();
  if (S.tab === 'print') hydratePrint();
}

/* ===== หน่วยงานของฉัน ===== */
function renderMine() {
  const u = unitCfg(S.me.unit);
  if (!unitHas(u, S.shift)) S.shift = u.shifts[0];
  const rep = repOf(u.code, S.shift);
  const seg = u.shifts.length < 2 ? '' : `<div class="seg" style="position:static">${u.shifts.map(k => `<button type="button" data-mshift="${k}" class="${S.shift === k ? 'on' : ''}">เวร ${k}<small>${repOf(u.code, k) ? 'ส่งแล้ว' : 'ยังไม่ส่ง'}</small></button>`).join('')}</div>`;
  if (!rep) {
    return `${seg}${u.form.draft ? draftNote() : ''}<div class="card"><h3>ยังไม่ได้ส่งรายงานเวร ${esc(S.shift)} ของ ${esc(thaiDate(S.date))}</h3>
      <p class="muted" style="margin:0 0 12px">กรอกยอดผู้ป่วย อัตรากำลัง และเหตุการณ์ผิดปกติของหน่วยงาน ${esc(u.code)}</p>
      <button class="btn" data-act="edit" type="button">เริ่มกรอกรายงานเวร ${esc(S.shift)}</button></div>`;
  }
  return `${seg}<div class="meta">เวร ${esc(S.shift)} \u00b7 ส่งโดย ${esc(rep.reporter)} \u00b7 แก้ไขล่าสุด ${esc(rep.updatedAt)}</div>

const draftNote = () => '<div class="note">แบบฟอร์มของหน่วยงานนี้เป็นตัวอย่าง รอปรับตามรูปแบบรายงานจริง</div>';

/* ===== ทุกหน่วยงาน ===== */
function renderAll() {

      html += `<button type="button" class="ucard${u.code === S.me.unit ? ' mine' : ''}" data-unit="${esc(u.code)}">

        ${reps.map(k => `<span class="big num">${shiftsOf(u).length > 1 ? esc(k) + ' \u00b7 ' : ''}${esc(headline(u, repAt(u, k)))}</span>`).join('') || '<span class="big">&nbsp;</span>'}
        ${incN ? `<span class="pill warn">เหตุการณ์ผิดปกติ ${incN}</span>` : ''}</button>`;

function statusPill(u) {
  const st = unitState(u);
  if (st === 'full') return `<span class="pill ok">${shiftsOf(u).length > 1 ? 'ส่งครบ 2 เวร' : 'ส่งแล้ว'}</span>`;
  if (st === 'part') return `<span class="pill warn">ส่งไม่ครบ \u00b7 ขาดเวร ${esc(missingShifts(u).join(', '))}</span>`;
  return '<span class="pill no">ยังไม่ส่ง</span>';
}
// ตัวเลขหลักบนการ์ด: คงพยาบาล หรือช่องแรก
function headline(u, r) {
  const f = allFields(u).find(f => f.calc) || allFields(u).find(f => !f.type);
  if (!f) { const t = stdValues(u, r.values).total; return t === undefined ? '' : 'ยอดรวม ' + t; }
  return `${f.label} ${fieldValue(u, r.values, f)}`;
}
function renderUnitDetail(code) {
  const u = unitCfg(code);
  if (!unitHas(u, S.vshift) || (S.detailFor !== code && !repAt(u, S.vshift) && shiftsOf(u).some(k => repAt(u, k)))) S.vshift = shiftsOf(u).find(k => repAt(u, k)) || shiftsOf(u)[0];
  S.detailFor = code; S.day = { reports: deriveReports(S.vshift) };
  const r = S.day.reports[code];
  return vshiftSeg(u) + `<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
      <button class="btn ghost sm" data-act="back" type="button">\u2039 ติดตามรายแผนก</button>

    ${r ? `<div class="meta">ส่งโดย ${esc(r.reporter)} \u00b7 แก้ไขล่าสุด ${esc(r.updatedAt)}</div>${renderReportView(u, r)}`
        : `<div class="card muted">หน่วยงานนี้ยังไม่ส่งรายงานเวร ${esc(S.vshift)} ของวันนี้</div>`}`;
}

/* ===== ค่าที่คำนวณ ===== */
const allFields = u => u.form.sections.flatMap(s => s.type === 'grid' ? [] : s.fields);
function fieldValue(u, vals, f) {
  if (f.calc) return f.calc.plus.reduce((a, k) => a + num(vals[k]), 0) - f.calc.minus.reduce((a, k) => a + num(vals[k]), 0);
  return vals[f.key];
}
const sectionSum = (s, vals) => s.fields.filter(f => !f.type && !f.calc).reduce((a, f) => a + num(vals[f.key]), 0);
const roleCounts = staff => S.cfg.roles.map(r => [r, staff.filter(s => s.role === r && s.tag !== 'ออกหน่วย').length]).filter(x => x[1]);
// ยอดมาตรฐาน / ประเภทผู้ป่วย (สำเนาเดียวกับ Schema.gs)
function fieldNum(form, vals, key) {
  for (const s of form.sections) for (const f of (s.fields || [])) if (f.key === key && f.calc) return f.calc.plus.reduce((a, k) => a + num(vals[k]), 0) - f.calc.minus.reduce((a, k) => a + num(vals[k]), 0);
  return num(vals[key]);
}
function stdValues(u, vals) {
  const out = {};
  Object.entries(u.form.std || {}).forEach(([k, spec]) => { out[k] = (Array.isArray(spec) ? spec : [spec]).reduce((a, key) => a + fieldNum(u.form, vals || {}, key), 0); });
  return out;
}
function categoryValues(u, vals) {
  const out = {};
  u.form.sections.filter(s => s.categories).forEach(s => s.fields.forEach(f => {
    const n = num((vals || {})[f.key]), c = S.cfg.categories[f.key] || f.label;
    if (n) out[c] = (out[c] || 0) + n;
  }));
  return out;
}
const vitals = i => [['BP', i.bp, 'mmHg'], ['PR', i.pr, 'ครั้ง/min'], ['RR', i.rr, 'ครั้ง/min'], ['T', i.temp, '\u00b0C'], ['O2 sat', i.spo2, '%']].filter(x => x[1] !== '' && x[1] != null);
const o2Text = i => i.o2mode ? (i.o2mode === 'Room air' ? 'Room air' : `${i.o2mode}${i.o2flow ? ' ' + i.o2flow : ''}`) : '';

/* ===== รายการแบบเลือกจาก Drop down แล้วกดเพิ่ม (เช่น HPC) ===== */
const listRows = (s, v) => (v[s.key] || []).map(r => Object.assign({ it: s.items.find(i => i.k === r.k) }, r));
const listLabel = (it, r) => (it ? it.label : r.k) + (r.name ? ' \u00b7 ' + r.name : '');
const listTotal = (s, v) => (v[s.key] || []).reduce((a, r) => a + num(r.n), 0);
function listCard(s, v) {
  const rows = listRows(s, v);
  return `<div class="card"><h3>${esc(s.title)}</h3><div class="kv">${rows.map(r => `<div>${esc(listLabel(r.it, r))}</div><div class="v">${r.n}</div>`).join('') || '<div class="full muted">ยังไม่มีรายการ</div>'}
    <div class="total">${esc(s.totalLabel)}</div><div class="total v">${listTotal(s, v)}</div></div></div>`;
}

/* ===== แท็บย่อยของหน่วยงาน ===== */
const SUBS = [['patient', 'รายงานผู้ป่วย'], ['staff', 'อัตรากำลัง'], ['incident', 'เหตุการณ์ผิดปกติ']];
function subTabs(r) {
  const staffN = r ? roleCounts(r.staff || []).map(([k, n]) => k + ' ' + n).join(' ') : '';
  const incN = r ? (r.incidents || []).length : 0;
  const badge = { staff: staffN, incident: incN ? String(incN) : '' };
  return `<div class="seg" role="tablist">${SUBS.map(([k, t]) => `<button type="button" role="tab" data-sub="${k}" class="${S.sub === k ? 'on' : ''}${k === 'incident' && incN ? ' alert' : ''}">${t}${badge[k] ? `<small>${esc(badge[k])}</small>` : ''}</button>`).join('')}</div>`;
}

/* ===== มุมมองอ่านอย่างเดียว ===== */
function renderReportView(u, r) {
  const v = r.values || {};
  let body = '';
  if (S.sub === 'patient') {
    const cards = u.form.sections.map(s => {
      if (s.type === 'list') return listCard(s, v);
      if (s.type === 'grid') {
        return `<div class="card"><h3>${esc(s.title)}</h3><div class="grid-scroll"><table class="g"><tr><th></th>${s.cols.map(c => `<th>${esc(c[1])}</th>`).join('')}<th>รวม</th></tr>
          ${s.rows.map(rw => { const vals = s.cols.map(c => v[rw[0] + '_' + c[0]]); return `<tr><td>${esc(rw[1])}</td>${vals.map(x => `<td class="num">${show(x)}</td>`).join('')}<td class="num"><b>${vals.reduce((a, x) => a + num(x), 0)}</b></td></tr>`; }).join('')}</table></div></div>`;
      }
      const rows = s.fields.map(f => {
        const val = fieldValue(u, v, f);
        if (f.type === 'text') return `<div class="full"><span class="muted">${esc(f.label)}</span><br><span class="pre">${show(val)}</span></div>`;
        let shown = show(val);
        if (f.type === 'time' && val) shown = esc(val) + ' น.';
        if (f.pctOf && num(v[f.pctOf])) shown += ` <span class="muted" style="font-weight:400">/${num(v[f.pctOf])} = ${(num(val) / num(v[f.pctOf]) * 100).toFixed(2)}%</span>`;
        const nt = f.note && num(val) && v[f.key + '_note'] ? `<div class="full muted" style="font-size:13px">\u2514 ${esc(f.note)}: ${esc(v[f.key + '_note'])}</div>` : '';
        return `<div>${esc(f.label)}</div><div class="v">${shown}</div>${nt}`;
      }).join('');
      const sum = s.sum ? `<div class="total">${esc(s.sum)}</div><div class="total v">${sectionSum(s, v)}</div>` : '';
      return `<div class="card"><h3>${esc(s.title)}</h3><div class="kv">${rows}${sum}</div></div>`;
    });
    if (u.form.total) cards.push(`<div class="card"><div class="kv"><div><b>${esc(u.form.total)}</b></div><div class="v">${u.form.sections.filter(s => s.sum).reduce((a, s) => a + sectionSum(s, v), 0)}</div></div></div>`);
    if (r.notes) cards.push(`<div class="card"><h3>เรื่องแจ้ง</h3><div class="pre">${esc(r.notes)}</div></div>`);
    body = `<div class="view-grid">${cards.join('')}</div>`;
  } else if (S.sub === 'staff') {
    const staff = r.staff || [], rd = r.reduce || {};
    body = `<div class="view-grid"><div class="card"><h3>อัตรากำลัง <span class="sub">เวร ${esc(shiftName(r.shift))}</span></h3>
      <div class="counts">${roleCounts(staff).map(([k, n]) => `<span>${esc(k)} ${n}</span>`).join('') || '<span class="muted">ไม่ได้ระบุ</span>'}</div>
      ${staff.map(s => `<div style="font-size:14px"><b style="display:inline-block;min-width:40px">${esc(s.role)}</b>${esc(s.name)}${s.tag ? ` <span class="pill plain">${esc(s.tag)}${s.tagNote ? ' ' + esc(s.tagNote) : ''}</span>` : ''}</div>`).join('')}</div>
      <div class="card"><h3>ลดอัตรากำลัง</h3><div class="kv">
        <div>RN</div><div class="v">${num(rd.RN)} ชม.</div><div>PN</div><div class="v">${num(rd.PN)} ชม.</div><div>NA</div><div class="v">${num(rd.NA)} ชม.</div>
        <div class="total">รวม</div><div class="total v">${num(rd.RN) + num(rd.PN) + num(rd.NA)} ชม.</div></div>
        ${rd.detail ? `<div class="pre muted" style="margin-top:6px;font-size:14px">${esc(rd.detail)}</div>` : ''}</div></div>`;
  } else {
    const incs = r.incidents || [];
    body = incs.length ? incs.map((i, n) => `<div class="card inc-view">
        <div class="inc-head"><span>${n + 1}. ${esc(i.type)}</span><span class="pill ${i.severity && i.severity !== '-' ? 'warn' : 'plain'}">ระดับ ${esc(i.severity || '-')}</span></div>
        <div class="pt">${i.patient ? `<b>${esc(i.patient)}</b>` : '<span class="muted">ไม่ระบุชื่อผู้ป่วย</span>'}${i.age ? ` \u00b7 อายุ ${esc(i.age)} ปี` : ''}${i.hn ? ` \u00b7 HN ${esc(i.hn)}` : ''}</div>
        <div class="muted" style="font-size:14px">${i.time ? `มารับบริการ ${esc(i.time)} น.` : ''}${i.time && i.doctor ? ' \u00b7 ' : ''}${i.doctor ? `แพทย์เจ้าของไข้ ${esc(i.doctor)}` : ''}</div>
        ${vitals(i).length || i.o2mode ? `<div class="vsline">${vitals(i).map(([k, x, unit]) => `<span><small>${k}</small> ${esc(x)} <small>${unit}</small></span>`).join('')}${i.o2mode ? `<span><small>O2</small> ${esc(o2Text(i))}</span>` : ''}</div>` : ''}
        <div class="pre" style="margin-top:6px">${esc(i.detail)}</div>
        ${i.action ? `<div class="muted pre" style="font-size:14px;margin-top:4px">การแก้ไขเบื้องต้น: ${esc(i.action)}</div>` : ''}
        ${(i.files || []).length ? `<div class="atts">${i.files.map(f => attChip(f, false)).join('')}</div>` : ''}</div>`).join('')
      : '<div class="card muted">ไม่มีเหตุการณ์ผิดปกติ</div>';
  }
  return subTabs(r) + body;
}

      <div class="lrows">${rows.map((r, i) => `<div class="lrow"><span>${esc(listLabel(s.items.find(x => x.k === r.k), r))}</span><input type="number" inputmode="numeric" min="0" step="1" data-lcount="${i}" value="${esc(r.n)}" aria-label="จำนวน"><button type="button" class="btn ghost sm" data-ldel="${i}" aria-label="ลบรายการ">\u00d7</button></div>`).join('') || '<div class="muted" style="padding:6px 0">ยังไม่มีรายการ \u2014 เลือกรายการแล้วกด + เพิ่ม</div>'}</div>
      <div class="sumline"><span>${esc(s.totalLabel)}</span><span class="num" data-ltotal>${listTotal(s, v)}</span></div>`;
    const upd = () => { box.querySelector('[data-ladd]').disabled = !canAdd(); };
    box.querySelector('[data-lsel]').onchange = e => { st.k = e.target.value; st.name = ''; renderLists(); };
    const nm = box.querySelector('[data-lname]'); if (nm) nm.oninput = e => { st.name = e.target.value; upd(); };
    box.querySelector('[data-ln]').oninput = e => { st.n = e.target.value; upd(); };
    box.querySelector('[data-ladd]').onclick = () => {
      if (!canAdd()) return;
      const name = it.ask ? st.name.trim() : '', n = Math.floor(num(st.n)), same = rows.find(r => r.k === it.k && String(r.name || '').toLowerCase() === name.toLowerCase());
      if (same) { same.n = num(same.n) + n; toast('มีรายการนี้อยู่แล้ว \u2014 รวมจำนวนให้'); } else rows.push({ k: it.k, name, n });
      st.k = ''; st.name = ''; st.n = '1'; sync(); renderLists();
    };
    box.querySelectorAll('[data-lcount]').forEach(inp => inp.oninput = () => { rows[+inp.dataset.lcount].n = Math.max(0, Math.floor(num(inp.value))); sync(); });
    box.querySelectorAll('[data-ldel]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.ldel, 1); sync(); renderLists(); });
  });
}

/* เวลา 24 ชม.: พิมพ์ตัวเลขอย่างเดียว เช่น 2030 ระบบใส่ : ให้เอง */
const typingTime = v => { const d = String(v).replace(/\D/g, '').slice(0, 4); return d.length === 4 ? d.slice(0, 2) + ':' + d.slice(2) : d; };
function finishTime(v) {
  const d = String(v).replace(/\D/g, '');
  if (d.length === 4) return d.slice(0, 2) + ':' + d.slice(2);
  if (d.length === 3) return '0' + d[0] + ':' + d.slice(1);
  if (d.length >= 1 && d.length <= 2) return d.padStart(2, '0') + ':00';
  return '';
}
const validTime = v => v === '' || /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
$('view').addEventListener('focusout', e => {
  const t = e.target;
  if (!(S.editing && t.classList && t.classList.contains('tin'))) return;
  const f = finishTime(t.value);
  if (f !== t.value) { t.value = f; t.dispatchEvent(new Event('input', { bubbles: true })); }
});
$('view').addEventListener('input', e => { if (S.editing && S.tab === 'mine') onFormInput(e); });

/* แก้ไขรายการห้องของหน่วยงาน: เลขห้อง + ชื่อ/ประเภท เพิ่ม ลบ แก้ไขได้ */
function roomEditor(box, unit, done) {
  let list = roomsRaw(unit).map(r => ({ no: r.no, name: r.name || '' }));
  const draw = () => {
    box.innerHTML = `<div class="card" style="border-color:var(--accent);margin-top:10px"><h3>แก้ไขรายการห้อง ${esc(unit)}</h3>
      <div class="muted" style="font-size:13px;margin-bottom:8px">ใส่เลขห้อง (จำเป็น) และชื่อ/ประเภท เช่น VIP, ห้องคอก (ไม่บังคับ) ถ้าใส่ชื่อ รายงานจะใช้ชื่อแทนเลขห้อง</div>
      ${list.map((r, i) => `<div class="rrow"><input data-rn="${i}" value="${esc(r.no)}" placeholder="เลขห้อง"><input data-rl="${i}" value="${esc(r.name)}" placeholder="ชื่อ/ประเภท (ถ้ามี)"><button type="button" class="x" data-rdel="${i}" aria-label="ลบห้อง">\u00d7</button></div>`).join('') || '<p class="muted">ยังไม่มีห้อง</p>'}
      <div class="rrow"><button type="button" class="btn ghost sm" data-radd>+ เพิ่มห้อง</button></div>
      <div class="rbulk"><span>เพิ่มเป็นชุด เช่น คำนำหน้า A4 ตั้งแต่ 1 ถึง 25 ได้ A401 ถึง A425</span><input data-bp placeholder="คำนำหน้า"><input data-b1 inputmode="numeric" value="1"><input data-b2 inputmode="numeric" value="25"><button type="button" class="btn ghost sm" data-rbulk>สร้างชุด</button></div>
      <div class="ractions"><button type="button" class="btn sm" data-rsave>บันทึกรายการห้อง</button><button type="button" class="btn ghost sm" data-rcancel>ยกเลิก</button></div>
      <div class="msg muted" data-rmsg></div></div>`;
  };
  draw();
  box.oninput = e => {
    const t = e.target;
    if (t.dataset.rn !== undefined) list[+t.dataset.rn].no = t.value;
    else if (t.dataset.rl !== undefined) list[+t.dataset.rl].name = t.value;
  };
  box.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.rdel !== undefined) { list.splice(+b.dataset.rdel, 1); draw(); }
    else if (b.hasAttribute('data-radd')) { list.push({ no: '', name: '' }); draw(); const ins = box.querySelectorAll('[data-rn]'); ins[ins.length - 1].focus(); }
    else if (b.hasAttribute('data-rbulk')) {
      const p = box.querySelector('[data-bp]').value.trim(), a = parseInt(box.querySelector('[data-b1]').value, 10), z = parseInt(box.querySelector('[data-b2]').value, 10);
      if (!p || !(a >= 0) || !(z >= a) || z - a > 200) return toast('กรอกคำนำหน้าและช่วงเลขให้ถูกต้อง');
      const have = new Set(list.map(r => r.no));
      for (let i = a; i <= z; i++) { const no = p + String(i).padStart(2, '0'); if (!have.has(no)) list.push({ no, name: '' }); }
      draw();
    }
    else if (b.hasAttribute('data-rcancel')) { box.innerHTML = ''; }
    else if (b.hasAttribute('data-rsave')) {
      b.disabled = true; box.querySelector('[data-rmsg]').textContent = 'กำลังบันทึก...';
      try {
        S.cfg.rooms = await api('saveRooms', S.token, unit, list.filter(r => r.no.trim()));
        box.innerHTML = ''; toast('บันทึกรายการห้องแล้ว'); done();
      } catch (err) { box.querySelector('[data-rmsg]').textContent = err.message; b.disabled = false; }
    }
  };
}

/* ห้องพัก: กดเลือกจากรายการห้องของหน่วยงาน หรือพิมพ์ชื่อเอง (ห้องหนึ่งอยู่ได้ที่เดียว ว่างหรือรอทำความสะอาด) */
const parseRooms = v => String(v || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
const roomsRaw = unit => (S.cfg.rooms && S.cfg.rooms[unit]) || [];
const roomLabel = r => r.name || r.no;
const roomsFor = unit => roomsRaw(unit).map(roomLabel);
function setRooms(key, list) {
  const reg = roomsFor(S.me.unit), uniq = list.filter((r, i) => list.indexOf(r) === i);
  uniq.sort((a, b) => { const ia = reg.indexOf(a), ib = reg.indexOf(b); return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib) || a.localeCompare(b); });
  S.draft.values[key] = uniq.join(', '); S.dirty = true;
}
const otherRoomKey = key => key === 'rooms_ready' ? 'rooms_clean' : 'rooms_ready';
function addRooms(key, names) {
  const other = otherRoomKey(key), add = parseRooms(names);
  if (!add.length) return;
  setRooms(key, parseRooms(S.draft.values[key]).concat(add));
  setRooms(other, parseRooms(S.draft.values[other]).filter(r => add.indexOf(r) < 0));
  renderRoomPickers();
}
function renderRoomPickers() {
  const raw = roomsRaw(S.me.unit), reg = raw.map(roomLabel);
  document.querySelectorAll('[data-rooms]').forEach(box => {
    const key = box.dataset.rooms, sel = parseRooms(S.draft.values[key]), used = new Set(parseRooms(S.draft.values[otherRoomKey(key)]));
    const extra = sel.filter(r => reg.indexOf(r) < 0);
    box.innerHTML = `<div class="rooms">${raw.map(o => { const r = roomLabel(o); return `<button type="button" class="rm${sel.indexOf(r) >= 0 ? ' on' : ''}${used.has(r) ? ' used' : ''}" data-room="${esc(r)}" data-rkey="${esc(key)}">${esc(r)}${o.name && o.name !== o.no ? `<small>${esc(o.no)}</small>` : ''}</button>`; }).join('')}${extra.map(r => `<button type="button" class="rm on" data-room="${esc(r)}" data-rkey="${esc(key)}">${esc(r)} \u00d7</button>`).join('')}</div>
      <div class="muted" style="font-size:12px">เลือกแล้ว ${sel.length} ห้อง</div>
      <div class="addrow rm-add"><input data-roomtext="${esc(key)}" placeholder="พิมพ์ชื่อห้องเอง เช่น VIP1 (คั่นหลายห้องด้วย ,)"><button type="button" class="btn sm" data-roomadd="${esc(key)}">+ เพิ่ม</button></div>`;
  });
}
$('view').addEventListener('click', e => {
  if (!(S.editing && S.tab === 'mine')) return;
  if (e.target.closest('[data-roomedit]')) { roomEditor($('room_editor'), S.me.unit, () => { mountForm(); }); return; }
  const rb = e.target.closest('[data-room]');

function onFormInput(e) {
  const t = e.target, d = S.draft;

  if (t.dataset.v) { d.values[t.dataset.v] = t.type === 'number' ? (t.value === '' ? '' : Number(t.value)) : t.value; recalc(); }
  else if (t.id === 'fm_reporter') d.reporter = t.value;
  else if (t.id.startsWith('rd_')) { d.reduce = d.reduce || {}; d.reduce[t.id.slice(3)] = t.id === 'rd_detail' ? t.value : (t.value === '' ? '' : Number(t.value)); }

function recalc() {
  const u = unitCfg(S.me.unit), v = S.draft.values;
  u.form.sections.forEach((s, si) => {
    if (s.type === 'grid') s.rows.forEach(rw => { const el = document.querySelector(`[data-rowsum="${si}:${rw[0]}"]`); if (el) el.textContent = s.cols.reduce((a, c) => a + num(v[rw[0] + '_' + c[0]]), 0); });
    else {
      s.fields.forEach(f => {
        if (f.calc) document.querySelector(`[data-calc="${f.key}"]`).textContent = fieldValue(u, v, f);
        if (f.pctOf) { const el = document.querySelector(`[data-pct="${f.key}"]`); el.textContent = num(v[f.pctOf]) ? `= ${(num(v[f.key]) / num(v[f.pctOf]) * 100).toFixed(2)}%` : ''; }
        if (f.note) { const row = document.querySelector(`[data-notefor="${f.key}"]`); if (row) row.hidden = !num(v[f.key]); }
      });
      if (s.sum) document.querySelector(`[data-sum="${si}"]`).textContent = sectionSum(s, v);
    }
  });
  if (u.form.total) $('fm_total').textContent = u.form.sections.filter(s => s.sum).reduce((a, s) => a + sectionSum(s, v), 0);
}

/* เหตุการณ์ผิดปกติ: ข้อมูลผู้ป่วย -> V/S -> รายละเอียด */
/* ===== ไฟล์แนบของเหตุการณ์ผิดปกติ (JPG / PNG / PDF) ===== */
const ATT_MAX_FILES = 5, PDF_MAX = 5 * 1024 * 1024;
S.att = {};
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const readB64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); r.readAsDataURL(file); });
function b64Blob(b64, mime) { const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: mime }); }
async function prepAttachment(file) {
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    if (file.size > PDF_MAX) throw new Error(file.name + ': PDF ใหญ่เกิน 5 MB');
    return { name: file.name, mime: 'application/pdf', data: await readB64(file) };
  }
  if (/^image\/(jpeg|png)$/.test(file.type) || /\.(jpe?g|png)$/i.test(file.name)) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error(file.name + ': เปิดรูปไม่ได้')); im.src = url; });
      const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      return { name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] };
    } finally { URL.revokeObjectURL(url); }
  }
  throw new Error(file.name + ': แนบได้เฉพาะ JPG, PNG หรือ PDF');
}
async function getAtt(id) { if (!S.att[id]) S.att[id] = await api('getAttachment', S.token, id); return S.att[id]; }
const attChip = (f, editable, i, k) => `<span class="att"><button type="button" class="open" data-attview="${esc(f.id)}" data-attname="${esc(f.name)}" data-attmime="${esc(f.mime)}">${f.mime === 'application/pdf' ? 'PDF' : 'รูป'} ${esc(f.name)}</button><small>${fmtSize(f.size || 0)}</small>${editable ? `<button type="button" class="x" data-attdel="${i}:${k}" aria-label="เอาไฟล์ออก">\u00d7</button>` : ''}</span>`;

$('view').addEventListener('change', async e => {
  const t = e.target;
  if (!(S.editing && t.dataset && t.dataset.fileadd !== undefined)) return;
  const i = +t.dataset.fileadd, x = S.draft.incidents[i], files = Array.from(t.files);
  t.value = ''; x.files = x.files || [];
  for (const f of files) {
    if (x.files.length >= ATT_MAX_FILES) { toast('แนบได้สูงสุด ' + ATT_MAX_FILES + ' ไฟล์ต่อเหตุการณ์'); break; }
    try {
      toast('กำลังอัปโหลด ' + f.name + ' ...');
      const p = await prepAttachment(f);
      const r = await api('uploadAttachment', S.token, p);
      S.att[r.id] = { name: r.name, mime: r.mime, data: p.data };
      x.files.push({ id: r.id, name: r.name, mime: r.mime, size: r.size }); S.dirty = true;
      renderIncidents(); toast('แนบไฟล์แล้ว: ' + r.name);
    } catch (err) { toast(err.message); }
  }
});

async function openAtt(id, name) {
  $('viewer').hidden = false; $('v_title').textContent = name; $('v_dl').removeAttribute('href');
  $('v_body').innerHTML = '<div class="vpdf">กำลังโหลดไฟล์...</div>';
  try {
    const f = await getAtt(id), url = URL.createObjectURL(b64Blob(f.data, f.mime));
    if (S.viewUrl) URL.revokeObjectURL(S.viewUrl);
    S.viewUrl = url; $('v_dl').href = url; $('v_dl').download = f.name;
    $('v_body').innerHTML = f.mime.indexOf('image/') === 0 ? `<img alt="${esc(f.name)}" src="${url}">`
      : `<div class="vpdf"><div>ไฟล์ PDF: ${esc(f.name)}</div><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${url}">เปิด PDF ในแท็บใหม่</a></div>`;
  } catch (e) { $('v_body').innerHTML = `<div class="vpdf" style="color:#fecaca">${esc(e.message)}</div>`; }
}

/* พิมพ์: ใส่ภาพไฟล์แนบลงในรายงาน (รูปใส่ตรงๆ ส่วน PDF แปลงหน้าแรกๆ เป็นภาพ) */
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  if (!S.pdfjsP) S.pdfjsP = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js'; res(); };
    s.onerror = () => { S.pdfjsP = null; rej(new Error('โหลดตัวแสดง PDF ไม่ได้')); };
    document.head.appendChild(s);
  });
  return S.pdfjsP;
}
async function pdfPages(b64, max) {
  await loadPdfJs();
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const doc = await window.pdfjsLib.getDocument({ data: arr }).promise, pages = [];
  for (let p = 1; p <= Math.min(doc.numPages, max); p++) {
    const page = await doc.getPage(p), vp = page.getViewport({ scale: 1.4 }), c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    pages.push(c.toDataURL('image/jpeg', 0.85));
  }
  return { pages, total: doc.numPages };
}
S.pendingAtt = 0;
async function hydratePrint() {
  const figs = Array.from(document.querySelectorAll('figure[data-attfile]'));
  S.pendingAtt = figs.length;
  await Promise.all(figs.map(async fig => {
    const cap = fig.querySelector('figcaption');
    try {
      const f = await getAtt(fig.dataset.attfile);
      if (f.mime.indexOf('image/') === 0) fig.insertAdjacentHTML('afterbegin', `<img alt="" src="data:${f.mime};base64,${f.data}">`);
      else {
        const r = await pdfPages(f.data, 3);
        fig.insertAdjacentHTML('afterbegin', r.pages.map(u => `<img alt="" src="${u}">`).join(''));
        if (r.total > r.pages.length) cap.textContent += ` (แสดง ${r.pages.length} จาก ${r.total} หน้า ดูไฟล์เต็มในระบบ)`;
      }
    } catch (err) { cap.textContent += ' \u2014 แสดงไฟล์ไม่ได้: ' + err.message; }
    S.pendingAtt--;
  }));
}

      S.sub = 'patient'; showSub(); toast(`กรุณาระบุ: ${f.note} (${f.label})`);

  const bad = d.incidents.findIndex(i => !i.detail.trim());

async function staffAction(act, id, unit) {
  try {
    if (act === 'edit') { S.editStaff = +id; S.delStaff = null; }
    else if (act === 'cancel') S.editStaff = null;
    else if (act === 'askdel') { S.delStaff = +id; S.editStaff = null; setTimeout(() => { if (S.delStaff === +id) { S.delStaff = null; if (S.tab === 'staff') render(); } }, 4000); }
    else if (act === 'del') { await api('deleteStaff', S.token, +id); S.delStaff = null; await loadStaff(); toast('ลบแล้ว'); }
    else if (act === 'save') {
      const s = S.staff.find(x => x.id === +id);
      await api('saveStaff', S.token, { id: +id, unit: $('es_unit') ? $('es_unit').value : s.unit, name: $('es_name').value.trim(), role: $('es_role').value });
      S.editStaff = null; await loadStaff(); toast('บันทึกแล้ว');
    } else if (act === 'add') {
      const name = $('as_name').value.trim(); if (!name) return toast('พิมพ์ชื่อก่อน');
      await api('saveStaff', S.token, { unit, name, role: $('as_role').value }); await loadStaff(); toast('เพิ่ม ' + name + ' แล้ว');
    }
  } catch (e) { handleErr(e); }
  render();
}

/* อ่านไฟล์รายชื่อ (Excel ใช้ SheetJS โหลดเมื่อจำเป็น) */
// หมายเหตุ: Apps Script ตัดข้อความหลัง // ในสคริปต์ทิ้งแม้อยู่ในสตริง จึงเขียน URL เป็น https:\/\/ (ห้ามมี // ต่อกันในโค้ด)
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('โหลดตัวอ่าน Excel ไม่ได้')); document.head.appendChild(s); });
}
function normUnit(s) { return String(s || '').toUpperCase().replace(/ผู้ป่วยใน|ผู้ป่วยนอก|ตึก|หอผู้ป่วย|หอ|แผนก|หน่วยงาน|ชั้น|\s|[-_.\/()]/g, ''); }
const cleanName = s => String(s || '').replace(/\s+/g, ' ').trim();
function mapRole(raw) {
  const t = String(raw || '').trim(), up = t.toUpperCase().replace(/[\s.]/g, '');
  if (up === 'RN' || up === 'PN' || up === 'NA') return up;
  if (/ผู้ช่วยพยาบาล|ผู้ช่วยการพยาบาล|ช่วยการพยาบาล/.test(t)) return 'PN';
  if (/ผู้ช่วยเหลือ|ช่วยเหลือคนไข้|ช่วยเหลือผู้ป่วย/.test(t)) return 'NA';
  if (/นักศึกษา|^นศ/.test(t)) return '\u0e19\u0e28.';
  if (/หัวหน้าแผนก|ผู้ช่วยหัวหน้า|รักษาการหัวหน้า|ผู้ช่วยผู้จัดการ|ผู้จัดการ/.test(t)) return 'RN';
  if (/^พยาบาล|^พว\.?$/.test(t)) return 'RN';
  return S.cfg.roleAliases[t] || S.cfg.roleAliases[t.toLowerCase()] || (S.cfg.roles.indexOf(t) >= 0 ? t : '\u0e2d\u0e37\u0e48\u0e19\u0e46');
}
const SUGGEST = [
  [/อุบัติเหตุ/, 'ER'], [/อายุรกรรม/, 'OPD1'], [/ศัลยกรรม/, 'OPD3'], [/สูตินรีเวช|สูติ/, 'OBG-IVF'],
  [/กุมารเวช|เด็กสุขภาพดี|พัฒนาการเด็ก/, 'PC'], [/ตา\s*หู\s*คอ/, 'EENT'], [/ทันตกรรม/, 'Dent'],
  [/ห้องผ่าตัด/, 'OR'], [/ห้องคลอด|ทารกแรกเกิด/, 'LR-NB'], [/ผู้ป่วยวิกฤต/, 'ICU'], [/ส่งเสริมสุขภาพ/, 'HPC']
];
function suggestUnit(raw) {
  const hit = SUGGEST.find(x => x[0].test(raw));
  return hit && S.cfg.units.some(u => u.code === hit[1]) ? hit[1] : '';
}
function findHeader(rows) {
  const lim = Math.min(rows.length, 15);
  for (let i = 0; i < lim; i++) {
    const h = rows[i].map(c => String(c == null ? '' : c).replace(/\s/g, ''));
    const cn = h.findIndex(x => (/ชื่อ/.test(x) && !/เล่น/.test(x)) || /^name$/i.test(x));
    const cu = h.findIndex(x => /แผนก|หน่วย|ตึก|^unit$|^ward$/i.test(x));
    const cr = h.findIndex(x => /ตำแหน่ง|role|position/i.test(x));
    if (cn >= 0 && cu >= 0 && cr >= 0) return { row: i, cu, cn, cr };
  }
  return null;
}
async function readRoster(file) {
  let sheets;
  if (/\.csv$/i.test(file.name)) {
    sheets = [(await file.text()).replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim()).map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g, '')))];
  } else {
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    sheets = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' }).map(r => r.map(c => String(c).trim())));
  }
  let rows = null, cu = 0, cn = 1, cr = 2;
  for (const sh of sheets) {
    const f = findHeader(sh);
    if (f) { rows = sh.slice(f.row + 1); cu = f.cu; cn = f.cn; cr = f.cr; break; }
  }
  if (!rows) rows = sheets[0] || [];
  rows = rows.filter(r => r.some(c => String(c).trim()));
  if (!rows.length) throw new Error('ไม่พบข้อมูลในไฟล์');
  const out = [], bad = [];
  rows.forEach((r, i) => {
    const name = cleanName(r[cn]);
    if (name) out.push({ dept: cleanName(r[cu]), name, role: mapRole(r[cr]) });
    else if (cleanName(r[cu])) bad.push(i + 1);
  });
  return { rows: out, bad };
}
function resolveDept(dept) {
  const k = normUnit(dept);
  if (!k) return '';
  const al = (S.aliases || []).find(a => normUnit(a.alias) === k);
  if (al) return al.unit;
  const hit = S.cfg.units.find(u => normUnit(u.code) === k);
  return hit ? hit.code : '';
}
function downloadTemplate() {

// รายงานประจำเดือนของหน่วยงานเดียว: หน้า 1 ยอดรายวัน/เวร + รวม + เฉลี่ย \u00b7 หน้า 2 รายการรวมทั้งเดือน + เหตุการณ์ผิดปกติ
function printMonthly(u, month, reps) {
  const L = S.cfg.stdLabels, keys = Object.keys(u.form.std || {}), two = shiftsOf(u).length > 1;
  const staff3 = r => { const st = (r.staff || []).filter(x => x.tag !== 'ออกหน่วย'); return ['RN', 'PN', 'NA'].map(n => st.filter(x => x.role === n).length); };
  const rows = reps.map(r => ({ r, sv: stdValues(u, r.values), st: staff3(r) }));
  const f1 = x => Number.isInteger(x) ? String(x) : x.toFixed(1);

  const days = new Set(reps.map(r => r.date)).size;
  let p1 = head('รายงานประจำเดือน') + `<div class="st">${esc(unitLabel(u))} \u00b7 มีรายงาน ${reps.length} ฉบับ จาก ${days} วัน</div>`;
  if (!rows.length) p1 += '<div class="miss" style="text-align:center;margin:20mm 0">ไม่มีรายงานในเดือนนี้</div>';
  else {
    const additive = k => k !== 'carried' && k !== 'remain';
    const cell = x => `<td class="n">${x}</td>`;
    const unitTxt = two ? 'เวร' : 'วัน';
    p1 += `<h2>ยอดรายวัน</h2><table class="stat"><thead><tr><th>วันที่</th>${two ? '<th>เวร</th>' : ''}${keys.map(k => `<th>${esc(L[k])}</th>`).join('')}<th>RN</th><th>PN</th><th>NA</th></tr></thead>
      ${rows.map(x => `<tr><td>${esc(fmtDMY(x.r.date))}</td>${two ? `<td>${esc(x.r.shift)}</td>` : ''}${keys.map(k => cell(x.sv[k] || '\u2013')).join('')}${x.st.map(n => cell(n || '\u2013')).join('')}</tr>`).join('')}
      <tr class="tot"><td colspan="${two ? 2 : 1}">รวมทั้งเดือน</td>${keys.map(k => additive(k) ? cell(rows.reduce((a, x) => a + (x.sv[k] || 0), 0)) : cell('\u2013')).join('')}${[0, 1, 2].map(() => cell('\u2013')).join('')}</tr>
      <tr class="sub"><td colspan="${two ? 2 : 1}">เฉลี่ยต่อ${unitTxt}</td>${keys.map(k => cell(f1(rows.reduce((a, x) => a + (x.sv[k] || 0), 0) / rows.length))).join('')}${[0, 1, 2].map(i => cell(f1(rows.reduce((a, x) => a + x.st[i], 0) / rows.length))).join('')}</tr></table>
      <div class="foot">RN / PN / NA = จำนวนเจ้าหน้าที่ที่ปฏิบัติงานในแต่ละ${unitTxt}ตามรายงาน (ไม่นับผู้ที่ออกไปปฏิบัติงานหน่วยอื่น) \u00b7 ยอดยกมาและคงพยาบาลไม่รวมเป็นยอดสะสม</div>`;
    const red = ['RN', 'PN', 'NA'].map(k => reps.reduce((a, r) => a + num((r.reduce || {})[k]), 0));
    if (red.some(Boolean)) p1 += `<div class="ln" style="margin-top:4px"><b>ลดอัตรากำลังรวมทั้งเดือน ${red.reduce((a, x) => a + x, 0)} ชม.</b> (RN ${red[0]} ชม., PN ${red[1]} ชม., NA ${red[2]} ชม.)</div>`;
  }
  // รายการรวมทั้งเดือน (ไม่ซ้ำกับตารางด้านบน)
  const stdKeys = new Set(Object.values(u.form.std || {}).flat());
  const boxes = [];
  u.form.sections.forEach(s => {

    if (s.type === 'list') {
      const agg = {};
      reps.forEach(r => listRows(s, r.values || {}).forEach(x => { const k = listLabel(x.it, x); agg[k] = (agg[k] || 0) + num(x.n); }));
      Object.entries(agg).sort((a, b) => b[1] - a[1]).forEach(([k, n]) => lines.push([k, n]));
